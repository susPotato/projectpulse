<style>
:root{
  --navy:#0D2B5E;--blue:#1565C0;--orange:#F47920;
  --text:#1A1F36;--muted:#6B7280;--light:#9CA3AF;--border:#E5E7EB;--bg:#F3F5F7;
  --green:#16A34A;--red:#EF4444;--teal:#0D9488;--amber:#D97706;
  --sidebar:60px;--topbar:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:var(--sidebar);background:var(--navy);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:4px;flex-shrink:0;z-index:100}
.sidebar-logo{width:36px;height:36px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;cursor:pointer}
.nav-icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;color:rgba(255,255,255,.55)}
.nav-icon:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-icon.active{background:rgba(255,255,255,.15);color:#fff}
.nav-icon svg{width:20px;height:20px}
.nav-label{font-size:9px;color:rgba(255,255,255,.5);margin-top:2px;text-align:center;line-height:1.2}
.nav-group{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav-group:hover .nav-icon{background:rgba(255,255,255,.1);color:#fff}
.nav-group:hover .nav-label{color:rgba(255,255,255,.8)}
.nav-group.active .nav-icon{background:rgba(255,255,255,.15);color:#fff}
.nav-group.active .nav-label{color:#fff}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* TOPBAR */
.topbar{height:var(--topbar);background:var(--navy);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.topbar-breadcrumb{color:rgba(255,255,255,.6);font-size:12.5px;display:flex;align-items:center;gap:5px}
.topbar-breadcrumb a{color:rgba(255,255,255,.6);text-decoration:none;cursor:pointer}
.topbar-breadcrumb a:hover{color:#fff}
.topbar-breadcrumb .sep{color:rgba(255,255,255,.3)}
.topbar-breadcrumb .cur{color:#fff;font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar-icon-btn{background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;padding:6px;border-radius:6px;display:flex;align-items:center;transition:background .15s}
.topbar-icon-btn:hover{background:rgba(255,255,255,.1);color:#fff}

/* CONTENT */
.content{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ── EMPTY STATE ── */
.empty-state{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.empty-card{background:#fff;border:2px dashed #CBD5E1;border-radius:14px;padding:40px 48px;width:520px;text-align:center}
.empty-preview{display:flex;justify-content:center;gap:10px;margin-bottom:24px}
.ep-box{background:#F8F9FB;border:1px solid var(--border);border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:8px}
.ep-label{font-size:11px;font-weight:600;color:var(--text)}
.ep-ext{font-size:10px;color:var(--blue);background:#EFF6FF;border-radius:4px;padding:1px 5px;font-weight:700}
.empty-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px}
.empty-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:6px}
.empty-link{font-size:13px;color:var(--muted)}.empty-link a{color:var(--blue);cursor:pointer}
.empty-actions{display:flex;gap:10px;margin-top:22px}
.ea-btn{flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .15s}
.ea-primary{background:var(--blue);color:#fff;border:none}
.ea-primary:hover{opacity:.9}
.ea-secondary{background:#fff;color:var(--text);border:1px solid var(--border)}
.ea-secondary:hover{background:var(--bg)}

/* ── SCHEDULE VIEW ── */
.sched-toolbar{background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:8px 16px;gap:8px;flex-shrink:0}
.tb-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:#fff;font-size:12.5px;font-family:inherit;color:var(--text);cursor:pointer;font-weight:500;transition:background .12s}
.tb-btn:hover{background:var(--bg)}
.tb-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.tb-btn.primary:hover{opacity:.9}
.tb-btn.success{background:#16A34A;color:#fff;border-color:#16A34A}
.tb-btn.success:hover{opacity:.9}
.tb-spacer{flex:1}
.mode-tabs{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.mode-tab{padding:5px 14px;font-size:12.5px;font-weight:500;font-family:inherit;border:none;background:#fff;cursor:pointer;color:var(--muted);transition:background .12s,color .12s;border-right:1px solid var(--border)}
.mode-tab:last-child{border-right:none}
.mode-tab.active{background:var(--blue);color:#fff;font-weight:600}
.tb-dropdown{display:flex;align-items:center;gap:5px;padding:6px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;font-size:12.5px;font-family:inherit;color:var(--text);cursor:pointer;font-weight:500}
.tb-dropdown:hover{background:var(--bg)}

/* GANTT MINI TIMELINE */
.timeline-wrap{background:#fff;border-bottom:1px solid var(--border);overflow:hidden;flex-shrink:0;position:relative}
.timeline-header{display:flex;align-items:center;padding:0 0 0 420px;height:22px;background:#F9FAFB;border-bottom:1px solid var(--border);overflow:hidden}
.tl-month{font-size:10px;color:var(--light);min-width:60px;padding-left:4px}
.timeline-phases{height:28px;padding-left:420px;display:flex;align-items:center;overflow:hidden;position:relative}
.phase-bar{height:22px;border-radius:3px;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;flex-shrink:0}
.today-marker{position:absolute;top:0;bottom:0;width:1.5px;background:var(--blue);z-index:2}
.today-label{position:absolute;top:-22px;font-size:10px;font-weight:700;color:var(--blue);transform:translateX(-50%)}
.completion-label{position:absolute;top:-22px;font-size:10px;font-weight:600;color:var(--muted);text-align:center;transform:translateX(-50%)}
.completion-marker{position:absolute;top:0;bottom:0;width:1.5px;background:#9CA3AF;z-index:2;border-left:1.5px dashed #9CA3AF}

/* ACTIVITY LIST */
.act-list-wrap{flex:1;overflow-y:auto;background:var(--bg)}
.act-list-wrap::-webkit-scrollbar{width:5px}
.act-list-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.act-row{background:#fff;border-bottom:1px solid #F0F2F5;display:flex;align-items:stretch;transition:background .1s}
.act-row:hover{background:#FAFBFF}
.act-left{display:flex;align-items:center;padding:10px 12px;gap:10px;width:420px;flex-shrink:0;border-right:1px solid #F0F2F5}
.act-drag{color:#D1D5DB;cursor:grab;font-size:12px;line-height:1;letter-spacing:-1px;flex-shrink:0}
.act-check{width:16px;height:16px;border:1.5px solid #D1D5DB;border-radius:3px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.act-info{flex:1;min-width:0}
.act-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-phase-tag{font-size:10.5px;font-weight:600;margin-top:2px;display:inline-block}
.ph-planning{color:#1565C0}.ph-design{color:#0D9488}.ph-dev{color:#92400E}.ph-test{color:#7C3AED}.ph-deploy{color:#EA580C}.ph-close{color:#DC2626}
.act-right{flex:1;display:flex;align-items:center;padding:0 12px;gap:4px;overflow:hidden}
.date-block{flex:1;display:flex;flex-direction:column;gap:2px}
.date-row{display:flex;align-items:center;gap:6px}
.date-label{font-size:10.5px;color:var(--light);width:130px;flex-shrink:0}
.date-val{font-size:11.5px;color:var(--muted)}
.date-val.overdue{color:var(--red);font-weight:600}
.act-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;padding-left:8px}
.act-status-box{width:24px;height:24px;border:1.5px solid var(--border);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s}
.act-status-box:hover{border-color:var(--blue)}
.act-status-box.done{background:var(--green);border-color:var(--green)}
.act-play-btn{width:28px;height:28px;border-radius:50%;background:#16A34A;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.act-play-btn:hover{opacity:.85}
.act-del-btn{background:none;border:none;cursor:pointer;color:#D1D5DB;padding:4px;border-radius:4px;display:flex;align-items:center;transition:color .12s}
.act-del-btn:hover{color:var(--red)}
.act-list-footer{padding:10px 14px;font-size:11.5px;color:var(--light);background:#F9FAFB;border-top:1px solid var(--border);text-align:right}
</style>
</head>

        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" fill="#F0FDF4"/><line x1="7" y1="8" x2="17" y2="8" stroke="#16A34A" stroke-width="1.5"/><line x1="7" y1="12" x2="17" y2="12" stroke="#86EFAC" stroke-width="1.5"/><line x1="7" y1="16" x2="13" y2="16" stroke="#86EFAC" stroke-width="1.5"/></svg>'+
        '<div><div class="ep-label">CSV File</div><div class="ep-ext">.CSV</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="empty-title">Drag and drop your files to upload</div>'+
    '<div class="empty-desc">Import your <strong>MS Project (.XML)</strong>, <strong>Primavera P6 (.XER)</strong>, or <strong>CSV file</strong>.<br>You can also use one of our templates or start from scratch!</div>'+
    '<div class="empty-link">If you\'d like to import a CSV file, please use our <a>template</a>.</div>'+
    '<div class="empty-actions">'+
      '<button class="ea-btn ea-primary" onclick="loadSchedule()">'+
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'+
        'Import Your Schedule'+
      '</button>'+
    '</div>'+
    '<div class="empty-actions" style="margin-top:8px">'+
      '<button class="ea-btn ea-secondary">'+
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>'+
        'Use Templates'+
      '</button>'+
      '<button class="ea-btn ea-secondary" onclick="loadSchedule()">'+
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'+
        'Add Activity'+
      '</button>'+
    '</div>'+
  '</div>'+
  '</div>';
}

function loadSchedule(){hasSchedule=true;render();}

var currentMode='Activities';
function setMode(m){
  currentMode=m;
  document.querySelectorAll('.mode-tab').forEach(function(t){
    t.className='mode-tab'+(t.dataset.m===m?' active':'');
  });
}

function renderSchedule(){
  var html='';

  // TOOLBAR
  html+='<div class="sched-toolbar">';
  html+='<button class="tb-btn primary" onclick="addActivity()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Activity</button>';
  html+='<button class="tb-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Create Report</button>';
  html+='<button class="tb-btn success"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg> Save</button>';
  html+='<div class="tb-spacer"></div>';
  html+='<div class="mode-tabs">';
  ['Activities','Gantt','Worm','Phases','None'].forEach(function(m){
    html+='<button class="mode-tab'+(m===currentMode?' active':'')+'" data-m="'+m+'" onclick="setMode(\''+m+'\')">'+m+'</button>';
  });
  html+='</div>';
  html+='<div class="tb-spacer"></div>';
  html+='<button class="tb-dropdown"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/></svg> Import <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>';
  html+='<button class="tb-dropdown">Bulk Edit <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>';
  html+='<button class="tb-dropdown">Sort <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>';
  html+='</div>';

  // MINI TIMELINE
  html+='<div class="timeline-wrap">';
  html+='<div style="position:relative;height:50px;overflow:hidden">';
  // month labels
  html+='<div style="position:absolute;top:0;left:420px;right:0;height:18px;background:#F9FAFB;border-bottom:1px solid #F0F2F5;display:flex;align-items:center">';
  var months=['Jul \'24','Oct \'24','Jan \'25','Apr \'25','Jul \'25','Oct \'25','Jan \'26','Apr \'26','Jul \'26'];
  months.forEach(function(m,i){html+='<span style="min-width:80px;font-size:10px;color:#9CA3AF;padding-left:4px">'+m+'</span>';});
  html+='</div>';
  // today & completion labels
  html+='<div style="position:absolute;top:2px;left:600px;font-size:10px;font-weight:700;color:#1565C0">Today</div>';
  html+='<div style="position:absolute;top:2px;left:780px;font-size:10px;color:#6B7280;text-align:center">Completion<br><span style="font-weight:600">23 Feb 2026</span></div>';
  // phase bars row
  html+='<div style="position:absolute;bottom:0;left:420px;right:0;height:28px;display:flex;align-items:center">';
  PHASE_BARS.forEach(function(p){
    html+='<div style="height:22px;width:'+p.w+'px;background:'+p.color+';display:flex;align-items:center;padding:0 6px;font-size:9.5px;font-weight:700;color:#fff;border-radius:2px;margin-right:2px;overflow:hidden;flex-shrink:0">'+p.label+'</div>';
  });
  html+='</div>';
  // today line
  html+='<div style="position:absolute;top:0;bottom:0;left:600px;width:1.5px;background:#1565C0;opacity:.7"></div>';
  // completion line
  html+='<div style="position:absolute;top:18px;bottom:0;left:780px;width:1.5px;background:#9CA3AF"></div>';
  html+='</div></div>';

  // ACTIVITY LIST
  html+='<div class="act-list-wrap" id="actList">';
  html+=renderActList();
  html+='<div class="act-list-footer">Total Activities: '+ACTIVITIES.length+'</div>';
  html+='</div>';

  document.getElementById('mainContent').innerHTML=html;
}

function renderActList(){
  var html='';
  ACTIVITIES.forEach(function(a,i){
    html+='<div class="act-row" id="arow-'+i+'">';
    html+='<div class="act-left">';
    html+='<span class="act-drag">⠿</span>';
    html+='<div class="act-check'+(a.done?' done':'')+'" onclick="toggleDone('+i+')">';
    if(a.done)html+='<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
    html+='</div>';
    html+='<div class="act-info">';
    html+='<div class="act-name">'+a.name+'</div>';
    html+='<div class="act-phase-tag '+a.phaseClass+'">'+a.phase+'</div>';
    html+='</div></div>';
    html+='<div class="act-right">';
    html+='<div class="date-block">';
    html+='<div class="date-row"><span class="date-label">Start</span><span class="date-val">'+a.start+'</span></div>';
    html+='<div class="date-row"><span class="date-label">Baseline Completion</span><span class="date-val">'+a.baseline+'</span></div>';
    html+='<div class="date-row"><span class="date-label">Planned Completion</span><span class="date-val">'+a.planned+'</span></div>';
    html+='</div>';
    html+='<div class="act-actions">';
    html+='<div class="act-status-box'+(a.done?' done':'')+'" onclick="toggleDone('+i+')">';
    if(a.done)html+='<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
    html+='</div>';
    if(a.playing){
      html+='<button class="act-play-btn"><svg width="10" height="10" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>';
    }
    html+='<button class="act-del-btn" onclick="deleteActivity('+i+')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>';
    html+='</div></div></div>';
  });
  return html;
}

function toggleDone(i){
  ACTIVITIES[i].done=!ACTIVITIES[i].done;
  var list=document.getElementById('actList');
  if(list) list.innerHTML=renderActList()+'<div class="act-list-footer">Total Activities: '+ACTIVITIES.length+'</div>';
}
function deleteActivity(i){
  if(confirm('Remove "'+ACTIVITIES[i].name+'" from schedule?')){
    ACTIVITIES.splice(i,1);
    var list=document.getElementById('actList');
    if(list) list.innerHTML=renderActList()+'<div class="act-list-footer">Total Activities: '+ACTIVITIES.length+'</div>';
  }
}
function addActivity(){
  var name=prompt('Activity name:');
  if(!name)return;
  ACTIVITIES.push({name:name,phase:'Planning',phaseClass:'ph-planning',start:'—',baseline:'—',planned:'—',done:false,playing:false});
  var list=document.getElementById('actList');
  if(list) list.innerHTML=renderActList()+'<div class="act-list-footer">Total Activities: '+ACTIVITIES.length+'</div>';
}

// ── INIT ──
// Demo toggle: click topbar title to switch state
render();
</script>
</body>
</html>
