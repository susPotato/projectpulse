<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schedule — Example Program | FPT Software</title>

<style>
:root{
  --navy:#0D2B5E;--blue:#1565C0;--orange:#F47920;
  --text:#1A1F36;--muted:#6B7280;--light:#9CA3AF;--border:#E5E7EB;--bg:#F8F9FB;
  --red:#EF4444;--green:#16A34A;--teal:#0D9488;--amber:#F59E0B;--coral:#F87171;
  --sidebar:60px;--topbar:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:var(--sidebar);background:var(--navy);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:4px;flex-shrink:0;z-index:100}
.sidebar-logo{width:36px;height:36px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;cursor:pointer}
.nav-icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;color:rgba(255,255,255,.55)}
.nav-icon:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-icon.active{background:rgba(255,255,255,.15);color:#fff}
.nav-icon svg{width:20px;height:20px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* TOPBAR */
.topbar{height:var(--topbar);background:var(--navy);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0}
.topbar-breadcrumb{color:rgba(255,255,255,.6);font-size:13px;display:flex;align-items:center;gap:6px}
.topbar-breadcrumb a{color:rgba(255,255,255,.6);text-decoration:none;cursor:pointer}
.topbar-breadcrumb a:hover{color:#fff}
.topbar-breadcrumb .sep{color:rgba(255,255,255,.3)}
.topbar-breadcrumb .cur{color:#fff;font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:7px;padding:6px 14px;font-size:12.5px;font-family:inherit;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s}
.topbar-btn:hover{background:rgba(255,255,255,.2)}

/* MODE TOGGLE */
.mode-bar{background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:center;align-items:center;padding:8px 0;flex-shrink:0}
.mode-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.mode-btn{padding:6px 22px;font-size:13px;font-weight:500;font-family:inherit;border:none;background:#fff;cursor:pointer;color:var(--muted);transition:background .15s,color .15s}
.mode-btn.active{background:var(--blue);color:#fff;font-weight:600}

/* TOOLBAR */
.toolbar{background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:8px 16px;gap:8px;flex-shrink:0;flex-wrap:wrap}
.tb-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:#fff;font-size:12.5px;font-family:inherit;color:var(--text);cursor:pointer;font-weight:500;transition:background .12s}
.tb-btn:hover{background:var(--bg)}
.tb-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.tb-btn.primary:hover{opacity:.9}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 2px}
.tb-spacer{flex:1}
.tb-label{font-size:12.5px;color:var(--muted)}
.tb-select{border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:12.5px;font-family:inherit;color:var(--text);background:#fff;cursor:pointer;outline:none}

/* CONTENT */
.sched-content{flex:1;overflow:auto;background:var(--bg)}

/* ── ACTIVITY STATUSES TABLE ── */
.act-wrap{padding:16px}
.act-table-outer{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:auto}
.act-table{border-collapse:collapse;font-size:12.5px;white-space:nowrap}
.act-table thead th{background:#F9FAFB;padding:9px 12px;text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:3}
.act-table thead th.milestone-head{text-align:center;padding:9px 8px;min-width:110px;max-width:110px}
.act-table tbody tr{border-bottom:1px solid #F3F4F6;transition:background .1s}
.act-table tbody tr:hover{background:#FAFBFF}
.act-table tbody tr.selected{background:#EFF6FF}
.act-table td{padding:10px 12px;vertical-align:middle;color:var(--text)}
.td-proj{font-weight:600;min-width:130px}
.td-date{min-width:90px;color:var(--muted);font-size:12px}
.td-delay{text-align:center;min-width:50px}
.td-phase{min-width:90px}
.td-poc{min-width:110px;color:var(--muted);font-size:12px}
.milestone-cell{text-align:center;vertical-align:middle;min-width:110px;max-width:110px;padding:8px}
.ms-icon{display:inline-flex;flex-direction:column;align-items:center;gap:3px;cursor:default}
.ms-date{font-size:10px;color:var(--light)}
.ms-box{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;position:relative}
.ms-done{background:#16A34A}
.ms-inprog{background:#1565C0}
.ms-pending{border:2px solid var(--border);background:#fff}
.ms-overdue{background:#DC2626;position:relative}
.ms-badge{position:absolute;top:-6px;right:-6px;background:#DC2626;color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:1px 5px;border:2px solid #fff}
.ms-done .ms-badge{background:#059669}
.phase-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.phase-init{background:#DBEAFE;color:#1565C0}
.phase-plan{background:#CCFBF1;color:#0D9488}
.phase-dev {background:#FEF3C7;color:#92400E}
.phase-close{background:#FEE2E2;color:#DC2626}
.table-footer{padding:10px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);text-align:right}

/* ── PHASES GANTT ── */
.gantt-wrap{padding:16px}
.gantt-box{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;padding:20px 24px 16px}
.gantt-legend{display:flex;align-items:center;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.gantt-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend-dot{width:14px;height:14px;border-radius:3px}
.gantt-area{overflow-x:auto}
svg.gantt-svg{font-family:'Inter',sans-serif}

/* ── SELECT ACTIVITIES MODAL ── */
.sa-back{display:none;position:fixed;inset:0;background:rgba(13,43,94,.3);z-index:800;align-items:flex-start;justify-content:flex-end}
.sa-back.open{display:flex}
.sa-modal{background:#fff;width:440px;height:100vh;display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(13,43,94,.15)}
.sa-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sa-title{font-size:15px;font-weight:700;color:var(--text)}
.sa-close{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted);padding:2px 8px;border-radius:5px}
.sa-close:hover{background:var(--bg)}
.sa-body{flex:1;overflow-y:auto;padding:16px 20px}
.sa-filter-row{margin-bottom:14px}
.sa-filter-label{font-size:12px;color:var(--muted);margin-bottom:5px}
.sa-filter-input{border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit;width:100%;outline:none}
.sa-filter-input:focus{border-color:var(--blue)}
.sa-item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F3F4F6}
.sa-item-label{font-size:13.5px;color:var(--text)}
.toggle{position:relative;width:40px;height:22px;cursor:pointer;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .sl{position:absolute;inset:0;background:#D1D5DB;border-radius:11px;transition:.25s}
.toggle input:checked+.sl{background:var(--blue)}
.toggle .sl:before{position:absolute;content:'';width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s}
.toggle input:checked+.sl:before{transform:translateX(18px)}

/* SCROLLBAR */
.sched-content::-webkit-scrollbar,.gantt-area::-webkit-scrollbar,.act-table-outer::-webkit-scrollbar{width:5px;height:5px}
.sched-content::-webkit-scrollbar-thumb,.gantt-area::-webkit-scrollbar-thumb,.act-table-outer::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>

function setMode(m){
  currentMode = m;
  document.getElementById('modeActBtn').className = 'mode-btn' + (m==='act'?' active':'');
  document.getElementById('modePhasBtn').className = 'mode-btn' + (m==='phase'?' active':'');
  document.getElementById('actToolbar').style.display = m==='act' ? 'flex' : 'none';
  if(m==='act') buildActTable(); else buildGantt();
}

// ── ACTIVITY TABLE ──
function msIcon(ms){
  if(!ms) return '<span class="ms-box ms-pending"></span>';
  if(ms.status==='done'){
    return '<div class="ms-icon"><div class="ms-box ms-done"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><div class="ms-date">'+(ms.date||'')+'</div></div>';
  }
  if(ms.status==='inprog'){
    return '<div class="ms-icon"><div class="ms-box ms-inprog"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg></div><div class="ms-date">'+(ms.date||'')+'</div></div>';
  }
  if(ms.status==='overdue'){
    return '<div class="ms-icon"><div class="ms-box ms-overdue" style="position:relative"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>'+(ms.badge?'<span class="ms-badge">'+ms.badge+'</span>':'')+'</div><div class="ms-date">'+(ms.date||'')+'</div></div>';
  }
  return '<div class="ms-icon"><div class="ms-box ms-pending"></div><div class="ms-date">'+(ms.date||'')+'</div></div>';
}

function phaseTag(p){
  var cls='phase-dev';
  if(p==='Initiation')cls='phase-init';
  else if(p==='Planning & Design')cls='phase-plan';
  else if(p==='Close Out')cls='phase-close';
  return '<span class="phase-tag '+cls+'">'+p+'</span>';
}

function buildActTable(){
  var html='<div class="act-wrap"><div class="act-table-outer"><table class="act-table"><thead><tr>';
  html+='<th class="td-proj">Project</th>';
  html+='<th class="td-date">Start Date</th>';
  html+='<th class="td-date">Last Updated</th>';
  html+='<th class="td-date">Completion D...</th>';
  html+='<th class="td-delay">Delay</th>';
  html+='<th class="td-phase">Phase</th>';
  html+='<th class="td-poc">Point of Contact</th>';
  visibleMilestones.forEach(function(m){
    html+='<th class="milestone-head">'+m+'</th>';
  });
  html+='</tr></thead><tbody>';
  PROJECTS.forEach(function(p){
    html+='<tr>';
    html+='<td class="td-proj">'+p.name+'</td>';
    html+='<td class="td-date">'+p.start+'</td>';
    html+='<td class="td-date">'+p.lastUpdated+'</td>';
    html+='<td class="td-date">'+p.completion+'</td>';
    html+='<td class="td-delay">'+p.delay+'</td>';
    html+='<td class="td-phase">'+phaseTag(p.phase)+'</td>';
    html+='<td class="td-poc">'+p.poc+'</td>';
    visibleMilestones.forEach(function(m){
      html+='<td class="milestone-cell">'+msIcon(p.milestones[m])+'</td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  html+='<div class="table-footer">Total Rows: '+PROJECTS.length+'</div>';
  html+='</div></div>';
  document.getElementById('schedContent').innerHTML = html;
}

// ── GANTT ──
function parseYM(ym){ // "2024-03" -> Date
  var parts=ym.split('-');
  return new Date(parseInt(parts[0]), parseInt(parts[1])-1, 1);
}
function monthsBetween(a,b){
  return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
}

function buildGantt(){
  // Find timeline bounds
  var minD = new Date(2024,0,1), maxD = new Date(2026,11,1);
  var totalMonths = monthsBetween(minD, maxD)+1;
  var rowH=50, labelW=140, colW=54, headerH=28, bottomH=28;
  var svgW = labelW + totalMonths*colW;
  var svgH = headerH + PROJECTS.length*rowH + bottomH + 20;
  var today = new Date(2026,8,5); // Sep 5 2026
  var todayX = labelW + monthsBetween(minD, today)*colW + colW/2;

  var svg='<svg class="gantt-svg" width="'+svgW+'" height="'+svgH+'" viewBox="0 0 '+svgW+' '+svgH+'">';

  // background stripes
  for(var mi=0;mi<totalMonths;mi++){
    var bx=labelW+mi*colW;
    svg+='<rect x="'+bx+'" y="0" width="'+colW+'" height="'+svgH+'" fill="'+(mi%2===0?'#F9FAFB':'#fff')+'"/>';
  }

  // month labels at bottom
  svg+='<rect x="0" y="'+(svgH-bottomH)+'" width="'+svgW+'" height="'+bottomH+'" fill="#F9FAFB"/>';
  for(var mi2=0;mi2<totalMonths;mi2+=2){
    var d=new Date(minD.getFullYear(), minD.getMonth()+mi2, 1);
    var lbl=d.toLocaleDateString('en-US',{month:'short',year:'2-digit'}).replace(' '," ");
    var lx=labelW+mi2*colW+4;
    svg+='<text x="'+lx+'" y="'+(svgH-10)+'" font-size="10" fill="#9CA3AF">'+lbl+'</text>';
  }

  // project label column header
  svg+='<rect x="0" y="0" width="'+labelW+'" height="'+svgH+'" fill="#F9FAFB"/>';

  // phase legend
  var phases=[{n:'Initiation',c:'#1E40AF'},{n:'Planning & Design',c:'#0D9488'},{n:'Development',c:'#D97706'},{n:'Close Out',c:'#EF4444'}];
  var lx2=labelW+8;
  phases.forEach(function(ph){
    svg+='<rect x="'+lx2+'" y="'+(svgH-bottomH+7)+'" width="12" height="12" rx="2" fill="'+ph.c+'"/>';
    svg+='<text x="'+(lx2+16)+'" y="'+(svgH-bottomH+18)+'" font-size="11" fill="#6B7280">'+ph.n+'</text>';
    lx2+=ph.n.length*6+36;
  });

  // rows
  PROJECTS.forEach(function(p,pi){
    var ry=headerH+pi*rowH;
    // project label
    svg+='<text x="8" y="'+(ry+rowH/2+5)+'" font-size="12" font-weight="600" fill="#1A1F36">'+p.name+'</text>';
    // separator line
    svg+='<line x1="0" y1="'+(ry+rowH)+'" x2="'+svgW+'" y2="'+(ry+rowH)+'" stroke="#E5E7EB" stroke-width="1"/>';
    // phase bars
    p.phases.forEach(function(ph){
      var px1=parseYM(ph.start), px2=parseYM(ph.end);
      var bx2=labelW+monthsBetween(minD,px1)*colW;
      var bw2=monthsBetween(px1,px2)*colW;
      var barY=ry+10, barH2=rowH-20;
      svg+='<rect x="'+bx2+'" y="'+barY+'" width="'+bw2+'" height="'+barH2+'" rx="4" fill="'+ph.color+'" opacity="0.88"/>';
      if(bw2>60){
        svg+='<text x="'+(bx2+bw2/2)+'" y="'+(barY+barH2/2+4)+'" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">'+ph.name+'</text>';
      }
    });
  });

  // Today line
  svg+='<line x1="'+todayX+'" y1="0" x2="'+todayX+'" y2="'+(svgH-bottomH)+'" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="4,3"/>';
  svg+='<text x="'+(todayX+4)+'" y="16" font-size="10" font-weight="600" fill="#1565C0">Today</text>';

  svg+='</svg>';

  var html='<div class="gantt-wrap"><div class="gantt-box"><div class="gantt-area">'+svg+'</div></div></div>';
  document.getElementById('schedContent').innerHTML=html;
}

// ── SELECT ACTIVITIES ──
function openSA(){
  renderSAList();
  document.getElementById('saBack').classList.add('open');
}
function closeSA(){
  document.getElementById('saBack').classList.remove('open');
}
function renderSAList(){
  var n=parseInt(document.getElementById('saFilterN').value)||1;
  var html='<div class="sa-item"><div class="sa-item-label" style="font-weight:600">Select All</div><label class="toggle"><input type="checkbox" id="saAll" onchange="toggleAllSA(this.checked)" '+(visibleMilestones.length===ALL_MILESTONES.length?'checked':'')+'/><span class="sl"></span></label></div>';
  ALL_MILESTONES.forEach(function(m){
    var count=PROJECTS.filter(function(p){return p.milestones[m];}).length;
    if(count<n)return;
    var checked=visibleMilestones.indexOf(m)>=0;
    html+='<div class="sa-item"><div class="sa-item-label">'+m+'</div><label class="toggle"><input type="checkbox" data-m="'+m+'" onchange="toggleSA(this)" '+(checked?'checked':'')+'/><span class="sl"></span></label></div>';
  });
  document.getElementById('saList').innerHTML=html;
}
function toggleAllSA(v){
  visibleMilestones=v?ALL_MILESTONES.slice():[];
  renderSAList();
  buildActTable();
}
function toggleSA(el){
  var m=el.dataset.m;
  if(el.checked){ if(visibleMilestones.indexOf(m)<0)visibleMilestones.push(m); }
  else { visibleMilestones=visibleMilestones.filter(function(x){return x!==m;}); }
  buildActTable();
}

// ── INIT ──
setMode('act');
</script>
</body>
</html>
