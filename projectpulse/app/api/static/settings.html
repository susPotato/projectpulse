<!doctype html>
<!--
  Program configuration: watched sources, project pairing, the rule table.

  The narration form used to live here too - provider, model, endpoint and an
  API key. It moved to `/llm`, which sets a model per *feature* rather than one
  for the whole app, and keeps keys in the encrypted store. Leaving a second
  copy here would not merely have been duplication: this page's save path wrote
  the key as plaintext JSON, so whichever form someone happened to use decided
  whether their credential was encrypted.

  Hand-written rather than part of the React app on purpose: this is the page
  someone opens when the model is NOT working, so it must not depend on the
  bundle being fresh, on npm, or on anything the failure might have taken with
  it. It uses the shared shell tokens, so it follows the theme like every other
  page.

  The page never receives the API key. It gets a hint ("sk-ant-...bQ4A") and a
  boolean, and it sends a key only when someone types one - an untouched field
  submits nothing and the stored key is left alone.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sources - Settings - ProjectPulse</title>
  <!-- Sets data-theme before the stylesheet paints anything, so a saved or
       system dark preference does not flash light first. Kept identical
       across all four rail copies - see theme.js. -->
  <script>(function(){try{var t=localStorage.getItem("pulse-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <!-- The sign-in gate. Not deferred, and ahead of the stylesheets and the
       rest of the scripts: everything below is work on a page this visitor
       may not be allowed to see, and a deferred redirect paints it first. -->
  <script src="/static/auth.js"></script>
  <link rel="stylesheet" href="/static/shell.css">
  <script src="/static/theme.js" defer></script>
<script src="/static/rail.js" defer></script>
  <style>
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    /* One frame width across the whole Settings section. The four tabs used
       to be 780, 900, 980 and 1120 wide, and `margin: 0 auto` re-centred each
       one - so the title and the tab row slid sideways every time you changed
       tab, which is the other half of why these did not read as one page.
       Content keeps its own comfortable width below. */
    .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 20px 60px; }
    h1 { font-size: 19px; margin: 0 0 4px; }
    .sub { color: var(--ink-2); font-size: 13px; margin-bottom: 20px; }
    .card { max-width: 820px; background: var(--surface); border: 1px solid var(--rule);
            border-radius: 8px; padding: 18px 20px; margin-bottom: 14px; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: .07em;
           text-transform: uppercase; color: var(--ink-3); }
    label { display: block; font-size: 12.5px; color: var(--ink-2); margin: 14px 0 5px; }
    input[type=text], input[type=password], select {
      width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit;
      font-size: 13px; color: var(--ink); background: var(--bg);
      border: 1px solid var(--rule); border-radius: 6px;
    }
    input:focus, select:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
    .row { display: flex; align-items: center; gap: 10px; }
    button { font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
             border-radius: 6px; padding: 9px 16px; border: 1px solid var(--rule);
             background: var(--bg); color: var(--ink); }
    /* Same as the Imports page, because it is the same control. */
    button.small { font-size: 12px; padding: 5px 10px; font-weight: 600; }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    button:disabled { opacity: .55; cursor: default; }
    .hint { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
    table.grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .warn { border-left: 2px solid var(--amber); padding-left: 12px;
            font-size: 12.5px; color: var(--ink-2); margin-top: 14px; }
    .ok { color: var(--green); }
    .bad { color: var(--red); }
    pre { white-space: pre-wrap; font: 12.5px/1.6 system-ui, sans-serif;
          background: var(--bg); border: 1px solid var(--rule); border-radius: 6px;
          padding: 12px 14px; margin: 10px 0 0; }
    code { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: 12px; }
    .pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px;
            padding: 2px 10px; border: 1px solid var(--rule); color: var(--ink-2); }
    .key-row { position: relative; }
    .key-row input { padding-right: 62px; font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; }
    .key-toggle { position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
                  font-size: 11px; font-weight: 700; padding: 5px 9px; border-radius: 4px; }
    table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.grid th { text-align: left; font-size: 10.5px; letter-spacing: .06em;
                    text-transform: uppercase; color: var(--ink-3); font-weight: 700;
                    padding: 0 10px 7px 0; border-bottom: 1px solid var(--rule); }
    table.grid td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--rule-2);
                    vertical-align: top; }
    .sev { font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
           border-radius: 4px; padding: 2px 7px; color: var(--surface); }
  </style>
</head>

<div class="shell">
<nav class="rail" aria-label="Sections">

  <a href="/projects"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 11h18"/></svg><span>Projects</span></a>
  <a href="/gantt"><svg viewBox="0 0 24 24"><path d="M4 6h9M4 12h14M4 18h6"/></svg><span>Schedule</span></a>
  <a href="/insight"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span>Insight</span></a>
  <a href="/traceability"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1.6"/><circle cx="4" cy="12" r="1.6"/><circle cx="4" cy="18" r="1.6"/></svg><span>Trace</span></a>
  <a href="/jira"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/></svg><span>Jira</span></a>
  <a href="/risk"><svg viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><span>Risk</span></a>
  <a href="/team"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.5a3 3 0 0 1 0 5"/><path d="M18 20a6 6 0 0 0-2-4.5"/></svg><span>Team</span></a>
  <a href="/reports"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span>Reports</span></a>
  <a href="/agent"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 20h8"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/><path d="M9 14h6"/></svg><span>Agent</span></a>
  <a href="/settings" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></a>
</nav>
<main>
<div class="wrap">

  <div class="appbar">
    <h1>Settings</h1>
    <span class="scope">watched sources, uploads and project pairing</span>
  </div>
  <nav class="subtabs" id="subtabs">
    <button type="button" data-view="sources" aria-current="page">Sources</button>
    <button type="button" data-view="rules">Rule table</button>
    <a href="/imports">Imports</a>
    <a href="/llm">Models &amp; keys</a>
    <a href="/usage">Usage</a>
  </nav>

  <div id="program">Loading&hellip;</div>
</div>

<script>
(function () {
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }

  var SEV = { critical: "var(--red)", high: "var(--red)", medium: "var(--orange)",
              low: "var(--blue)", info: "var(--ink-3)" };
  var programBox = document.getElementById("program");
  var program = null;
  /* The tab the URL asks for. Sources and the rule table are views of this
     one document, but the other three tabs are separate pages - so the rule
     table needs a URL of its own, or a link to it from those pages has
     nowhere to point and the row disagrees with itself. */
  var params = new URLSearchParams(window.location.search);
  var view = params.get("view") === "rules" ? "rules" : "sources";

  function renderSources() {
    var rows = program.sources.map(function (src) {
      var when = src.last_scan ? String(src.last_scan).replace("T", " ").slice(0, 16) : "never";
      /* Only a stored upload can be forgotten. A demo sheet is compiled
         into the image, and a button that always fails is worse than no
         button - the row says why instead. */
      var action = src.removable
        ? '<button type="button" class="small del">Forget</button>'
        : '<span class="hint">part of the image</span>';
      return "<tr data-file=\"" + esc(src.file_name || "") + "\"><td><b>" +
        esc(src.scope) + "</b><div class=\"hint\" style=\"margin:2px 0 0\">" +
        "<code>" + esc(src.path) + "</code></div></td>" +
        "<td>" + esc(src.kind) + "</td>" +
        "<td>" + (src.exists ? '<span class="ok">present</span>' : '<span class="bad">missing</span>') + "</td>" +
        "<td>" + esc(when) + "</td><td>" + src.rows + "</td>" +
        "<td>" + action + "</td></tr>";
    }).join("");

    var scope = program.scope.map(function (p) {
      var also = p.also.length
        ? p.also.map(function (a) { return "<code>" + esc(a) + "</code>"; }).join(", ")
        : "<span class=\"hint\">no other source</span>";
      return "<tr><td><b>" + esc(p.name) + "</b></td><td><code>" + esc(p.canonical_id) +
        "</code></td><td>" + also + "</td></tr>";
    }).join("");

    var projectOptions = program.scope.map(function (p) {
      return '<option value="' + esc(p.canonical_id) + '">' + esc(p.name) + "</option>";
    }).join("");

    programBox.innerHTML =
      '<div class="card"><div class="lbl">Upload a document</div>' +
      '<div class="hint" style="margin:6px 0 12px">The alternative to the OneDrive-synced folder below ' +
      "&mdash; the only way to add data on a deployed host, which has no such folder to sync. " +
      "Ingests through the same reader, differ and rules as everything else. " +
      "The tab is found from the workbook's own contents, so it can be called anything &mdash; " +
      "it needs a header row with the template's columns, including <code>Task ID</code>, " +
      "which is what identifies a row across imports.</div>" +
      '<label for="up-target">Project</label>' +
      '<select id="up-target">' +
        '<option value="__new__">New project&hellip;</option>' +
        projectOptions +
      "</select>" +
      '<input type="text" id="up-name" placeholder="project name" style="margin-top:8px">' +
      '<label for="up-kind">Sheet</label>' +
      '<select id="up-kind">' +
        '<option value="schedule">Schedule (Activities)</option>' +
        '<option value="worklog">Worklog</option>' +
        '<option value="jira_export">Jira issue export</option>' +
      "</select>" +
      '<div class="hint" id="up-kind-hint" style="margin-top:6px"></div>' +
      '<label for="up-file">Workbook</label>' +
      '<input type="file" id="up-file" accept=".xlsx,.xlsm">' +
      '<div class="row" style="margin-top:14px">' +
        '<button class="primary" id="up-submit">Upload &amp; sync</button>' +
        '<span id="up-status" class="hint" style="margin:0"></span>' +
      "</div>" +
      '<div id="up-result"></div>' +
      "</div>" +
      '<div class="card"><div class="lbl">Watched sources</div>' +
      '<div class="hint" style="margin:6px 0 12px">Read from <code>' + esc(program.data_root) +
      "</code>. A missing file is a note, not a failure &mdash; someone has not uploaded this week&rsquo;s sheet yet.</div>" +
      '<table class="grid"><tr><th>Scope</th><th>Kind</th><th>File</th><th>Last scan</th><th>Rows</th><th></th></tr>' +
      rows + "</table>" +
      '<div class="hint" style="margin:10px 0 0">Forgetting a source removes the ' +
      "stored workbook and its watch registration. <b>The tasks it produced " +
      "stay</b> &mdash; removing a superseded upload does not empty the pages " +
      'built from it. To remove those too, delete the project on <a href="/imports">Imports</a>.</div>' +
      "</div>" +
      '<div class="card"><div class="lbl">Test a Jira connection</div>' +
      '<div class="hint" style="margin:6px 0 12px">Checks one credential against ' +
      "<code>myself</code> and reports who it belongs to. " +
      "<b>Nothing is saved</b> &mdash; the token is used for one request and " +
      "discarded. Cloud and Data Center are both tried, so you do not need to " +
      "know which you are on.</div>" +
      '<label for="jt-site">Site</label>' +
      '<input type="text" id="jt-site" placeholder="acme.atlassian.net  or  insight.example.com/jiradc" autocomplete="off">' +
      '<div class="hint" style="margin:4px 0 0">Paste any Jira URL &mdash; the ' +
      "ticket you are looking at is fine. A self-hosted Jira often sits under " +
      "a path such as <code>/jira</code> or <code>/jiradc</code>, and that part " +
      "is kept.</div>" +
      '<label for="jt-email">Email <span class="hint">(Jira Cloud; blank for a Data Center token)</span></label>' +
      '<input type="text" id="jt-email" placeholder="you@company.com" autocomplete="off">' +
      '<label for="jt-token">API token</label>' +
      '<input type="password" id="jt-token" autocomplete="off" spellcheck="false">' +
      '<label for="jt-project">Project key <span class="hint">(optional)</span></label>' +
      '<input type="text" id="jt-project" placeholder="COWORKLOCAL" autocomplete="off">' +
      '<div class="hint" style="margin:4px 0 0">Give one and the test also ' +
      "reports what the API carries for it &mdash; which is the question a " +
      "spreadsheet export cannot answer.</div>" +
      '<div class="row" style="margin-top:14px">' +
        '<button class="primary" id="jt-submit">Test connection</button>' +
        '<span id="jt-status" class="hint" style="margin:0"></span>' +
      "</div><div id=\"jt-result\"></div></div>" +
      '<div class="card"><div class="lbl">Jira connections</div>' +
      '<div class="hint" style="margin:6px 0 12px">Which Jira project feeds ' +
      "which delivery project. A portfolio has many of both and they do not " +
      "line up one to one, so this is a list rather than a setting. The token " +
      "is sealed with <code>PULSE_SECRET_KEY</code>; only a masked hint is " +
      "shown. <b>Collect</b> pulls issues in &mdash; the first run fetches the " +
      'project, later ones only what changed. Results appear on <a href="/jira">Jira</a>.</div>' +
      '<table class="grid" id="jc-table"><tr><th>Delivery project</th>' +
      "<th>Jira</th><th>Key</th><th>Token</th><th></th></tr></table>" +
      '<div class="hint" id="jc-empty" style="margin:8px 0 0"></div>' +
      '<div style="margin-top:14px">' +
      '<label for="jc-project">Link a project</label>' +
      '<select id="jc-project">' + projectOptions + "</select>" +
      '<label for="jc-site">Jira site</label>' +
      '<input type="text" id="jc-site" placeholder="insight.example.com/jiradc" autocomplete="off">' +
      '<label for="jc-email">Email <span class="hint">(blank for a Data Center token)</span></label>' +
      '<input type="text" id="jc-email" autocomplete="off">' +
      '<label for="jc-key">Jira project key</label>' +
      '<input type="text" id="jc-key" placeholder="COWORKLOCAL" autocomplete="off">' +
      '<label for="jc-token">API token <span class="hint">(blank keeps the stored one)</span></label>' +
      '<input type="password" id="jc-token" autocomplete="off" spellcheck="false">' +
      '<div class="row" style="margin-top:14px">' +
        '<button class="primary" id="jc-save">Save connection</button>' +
        '<span id="jc-status" class="hint" style="margin:0"></span>' +
      "</div></div></div>" +
      '<div class="card"><div class="lbl">Code repository</div>' +
      '<div class="hint" style="margin:6px 0 12px">The code a project is traced ' +
      "against, and the documents that describe it. Documentation is read from " +
      "<b>one directory in the repository</b> &mdash; <code>docs/</code> unless " +
      "this says otherwise &mdash; and a repository without one is refused rather " +
      "than registered empty, because every documentation stage would then report " +
      "nothing and read as a broken page. The clone is shallow and disposable; what " +
      "is stored is the registration and the commit that was read. A token for a " +
      "private repository is sealed with <code>PULSE_SECRET_KEY</code>, and only a " +
      "masked hint is shown.</div>" +
      '<div class="hint warn" id="rp-blocked" style="display:none;margin:10px 0 14px"></div>' +
      '<table class="grid" id="rp-table"><tr><th>Delivery project</th>' +
      "<th>Repository</th><th>Ref</th><th>Documents from</th><th>Documents</th>" +
      "<th>Commit</th><th>Token</th><th></th></tr></table>" +
      '<div class="hint" id="rp-empty" style="margin:8px 0 0"></div>' +
      '<div style="margin-top:14px">' +
      '<label for="rp-project">Register a repository</label>' +
      '<select id="rp-project">' + projectOptions + "</select>" +
      '<label for="rp-url">Clone URL</label>' +
      '<input type="text" id="rp-url" placeholder="https://github.com/org/repo.git" autocomplete="off">' +
      '<label for="rp-ref">Branch or tag <span class="hint">(blank takes the remote default)</span></label>' +
      '<input type="text" id="rp-ref" placeholder="main" autocomplete="off">' +
      '<label for="rp-docs">Documents directory <span class="hint">(relative to the repository root)</span></label>' +
      '<input type="text" id="rp-docs" value="docs" autocomplete="off">' +
      '<label for="rp-token">Access token <span class="hint">(only for a private repository; blank keeps the stored one)</span></label>' +
      '<input type="password" id="rp-token" autocomplete="off" spellcheck="false">' +
      '<div class="row" style="margin-top:14px">' +
        '<button class="primary" id="rp-save">Register &amp; read</button>' +
        '<span id="rp-status" class="hint" style="margin:0"></span>' +
      "</div></div></div>" +
      '<div class="card"><div class="lbl">Backlog export</div>' +
      '<div class="hint" style="margin:6px 0 12px">The tracker export a ' +
      "traceability run reads its tickets from. Stored <b>as exported</b>, and " +
      "deliberately not the same upload as the one above: that one converts a " +
      "Jira export into a schedule and a worklog and keeps those, which is what " +
      "the dashboard needs and loses the ticket prose. The process stage reads " +
      "that prose, so it needs the file as it left the tracker. One export per " +
      "project; uploading again replaces it.</div>" +
      '<table class="grid" id="tx-table"><tr><th>Delivery project</th>' +
      "<th>File</th><th>Size</th><th>Rows from</th><th>Finished status</th>" +
      "<th>Uploaded</th></tr></table>" +
      '<div class="hint" id="tx-empty" style="margin:8px 0 0"></div>' +
      '<div style="margin-top:14px">' +
      '<label for="tx-project">Store an export</label>' +
      '<select id="tx-project">' + projectOptions + "</select>" +
      '<label for="tx-file">Export workbook</label>' +
      '<input type="file" id="tx-file" accept=".xlsx,.xlsm">' +
      '<label for="tx-filter">Project name inside the export ' +
      '<span class="hint">(blank reads every row)</span></label>' +
      '<input type="text" id="tx-filter" autocomplete="off">' +
      '<label for="tx-done">Status(es) meaning finished ' +
      '<span class="hint">(comma separated; blank skips reconciliation, which ' +
      "will not guess)</span></label>" +
      '<input type="text" id="tx-done" placeholder="Done,Closed" autocomplete="off">' +
      '<div class="row" style="margin-top:14px">' +
        '<button class="primary" id="tx-save">Store export</button>' +
        '<span id="tx-status" class="hint" style="margin:0"></span>' +
      "</div></div></div>" +
      '<div class="card"><div class="lbl">Project pairing</div>' +
      '<div class="hint" style="margin:6px 0 12px">One delivery project can have several source ids. ' +
      "Jira and Excel each create their own row for the same work, and without this pairing a Jira event " +
      "could never explain a spreadsheet observation.</div>" +
      '<table class="grid"><tr><th>Project</th><th>Canonical id</th><th>Also known as</th></tr>' +
      scope + "</table></div>";

    var target = document.getElementById("up-target");
    var nameField = document.getElementById("up-name");
    function syncNameField() {
      nameField.style.display = target.value === "__new__" ? "" : "none";
    }
    target.addEventListener("change", syncNameField);
    syncNameField();

    document.getElementById("up-submit").addEventListener("click", uploadSource);

    document.getElementById("jt-submit").addEventListener("click", testJira);
    document.getElementById("jc-save").addEventListener("click", saveConnection);
    loadConnections();

    document.getElementById("rp-save").addEventListener("click", saveRepo);
    document.getElementById("tx-save").addEventListener("click", saveExport);
    loadRepos();
    loadExports();

    /* Forgetting a source. Deliberately the same endpoint, the same wording
       and the same gate as the Imports page rather than a second way to do
       it: two screens that delete the same thing must not be able to
       disagree about what deleting means. */
    [].forEach.call(programBox.querySelectorAll("tr[data-file] .del"), function (btn) {
      btn.addEventListener("click", function () {
        var file = btn.closest("tr").getAttribute("data-file");
        if (!file) return;
        if (!confirm("Forget this import?\n\n" + file +
            "\n\nThe tasks it produced stay; only the stored workbook and its " +
            "watch registration go.")) return;

        var h = {};
        try {
          var t = sessionStorage.getItem("pulse-admin-token");
          if (t) h["X-Pulse-Admin-Token"] = t;
        } catch (e) { /* private mode - the request will be refused and say so */ }

        btn.disabled = true;
        fetch("/api/imports/" + encodeURIComponent(file), { method: "DELETE", headers: h })
          .then(readBody)
          .then(function () { return loadProgram(); })
          .catch(function (e) {
            btn.disabled = false;
            // Says which of the two refusals happened, because "no token is
            // configured" and "your token is wrong" need opposite fixes.
            alert("Could not forget this source.\n\n" + e.message);
          });
      });
    });

    // Said before the upload, not after: a Jira export cannot carry a baseline
    // or dependency edges, and finding that out from a flat dashboard is worse
    // than being told while choosing the file.
    var kindEl = document.getElementById("up-kind");
    var kindHint = document.getElementById("up-kind-hint");
    function describeKind() {
      if (!kindHint) return;
      kindHint.innerHTML = kindEl.value.indexOf("jira") === 0
        ? "Upload the workbook straight from Jira&rsquo;s <b>Excel (All fields)</b> export. " +
          "It is converted into a schedule sheet here. Jira has no baseline or " +
          "dependency column, so recorded slip stays empty until a <i>second</i> " +
          "export is uploaded &mdash; the differ compares the two. Effort is taken " +
          "from the same file when the export carries it."
        : "";
    }
    kindEl.addEventListener("change", describeKind);
    describeKind();
  }

  /* One connection test.

     The token field is never read back into the page after the request and
     never lands in a URL - it goes in a JSON body, which does not end up in
     a browser history entry or a proxy access log the way a query string
     does. The result says which auth scheme was tried, because "wrong
     token" and "right token, wrong scheme for this Jira" look identical
     otherwise. */
  function testJira() {
    var statusEl = document.getElementById("jt-status");
    var resultEl = document.getElementById("jt-result");
    var btn = document.getElementById("jt-submit");
    var body = {
      site: document.getElementById("jt-site").value.trim(),
      email: document.getElementById("jt-email").value.trim(),
      token: document.getElementById("jt-token").value
    };

    var h = { "Content-Type": "application/json" };
    try {
      var t = sessionStorage.getItem("pulse-admin-token");
      if (t) h["X-Pulse-Admin-Token"] = t;
    } catch (e) { /* refused below, with a reason */ }

    statusEl.className = "hint";
    statusEl.textContent = "Testing…";
    resultEl.innerHTML = "";
    btn.disabled = true;

    fetch("/api/jira/test", { method: "POST", headers: h, body: JSON.stringify(body) })
      .then(readBody)
      .then(function (j) {
        statusEl.textContent = "";
        var who = j.account && j.account.accountId
          ? '<div class="hint" style="margin-top:4px">accountId <code>' +
            esc(j.account.accountId) + "</code></div>"
          : "";
        resultEl.innerHTML = '<div class="hint ' + (j.ok ? "ok" : "bad") +
          '" style="margin-top:8px">' + esc(j.detail) + "</div>" + who +
          '<div class="hint" style="margin-top:4px">tried: ' +
          esc(j.scheme || "") + "</div>";
        // Only worth asking once the credential is known to work.
        var key = document.getElementById("jt-project").value.trim();
        if (j.ok && key) return previewJira(key, body, h, resultEl);
      })
      .catch(function (e) {
        statusEl.textContent = "";
        resultEl.innerHTML = '<div class="hint bad" style="margin-top:8px">' +
          esc(e.message) + "</div>";
      })
      .then(function () { btn.disabled = false; });
  }

  /* What the API carries for one project, appended under the test result.

     Field coverage rather than a yes/no. "Jira has a created date" and
     "this instance fills it in" are different claims, and only the second
     decides whether a live collector beats the spreadsheet somebody is
     emailing around. A field nobody fills is shown at zero rather than
     hidden - an empty column is the finding. */
  /* Can the spreadsheet be retired?

     One question decides it. The export's Description column carries a
     block the tracker has no fields for - PO, BA, Developer, and a
     `Ghi chu` list naming twelve people who appear nowhere else. If Jira's
     own description is empty, that block lives only in the spreadsheet and
     dropping it loses the ownership record.

     Stated as evidence, never as a verdict: a sample of 25 is not proof
     about 190. */
  function binVerdict(j) {
    var e = j.only_in_export;
    if (!e) return "";
    var names = Object.keys(e.assignees || {}).map(function (n) {
      return esc(n) + " (" + e.assignees[n] + ")";
    }).join(", ");
    var keeps = e.with_export_block > 0;
    return '<div class="hint" style="margin-top:12px"><b>Can the export go?' +
      "</b><br>" +
      "Jira fills a description on <b>" + e.described + " of " + j.sampled +
      "</b> sampled issues, and <b>" + e.with_export_block +
      "</b> of those carry the <code>PO:/BA:/Developer:</code> block the " +
      "spreadsheet keeps." +
      (keeps
        ? " So the block is in Jira too &mdash; the export adds nothing here."
        : " <b>So that block is only in the spreadsheet.</b> Retiring the " +
          "export would lose the PO and BA roles and the <code>Ghi chú</code> " +
          "names, none of which Jira has a field for.") +
      (names ? "<br>Jira&rsquo;s own assignees in the sample: " + names : "") +
      '<br><span class="hint">A sample of ' + j.sampled + " is evidence " +
      "about " + j.total + ", not proof.</span></div>";
  }

  function previewJira(key, creds, headers, resultEl) {
    var payload = {
      site: creds.site, email: creds.email, token: creds.token, project: key
    };
    resultEl.insertAdjacentHTML("beforeend",
      '<div class="hint" id="jp-wait" style="margin-top:10px">Looking at ' +
      esc(key) + "&hellip;</div>");

    return fetch("/api/jira/preview",
                 { method: "POST", headers: headers, body: JSON.stringify(payload) })
      .then(readBody)
      .then(function (j) {
        var wait = document.getElementById("jp-wait");
        if (wait) wait.remove();
        if (!j.ok) {
          resultEl.insertAdjacentHTML("beforeend",
            '<div class="hint bad" style="margin-top:8px">' + esc(j.detail) + "</div>");
          return;
        }
        var rows = j.fields.map(function (f) {
          var none = f.filled === 0;
          return "<tr><td>" + (none ? '<span class="bad">' : "<b>") +
            esc(f.name) + (none ? "</span>" : "</b>") +
            '</td><td style="text-align:right">' + f.filled + " / " + j.sampled +
            '</td><td class="hint" style="padding-left:10px">' +
            esc(f.unlocks) + "</td></tr>";
        }).join("");
        resultEl.insertAdjacentHTML("beforeend",
          '<div class="hint" style="margin-top:12px"><b>' + esc(j.project) +
          "</b> &mdash; " + j.total + " issues, " + j.sampled + " sampled, " +
          j.histories + " change-history entries in the sample.</div>" +
          '<table class="grid" style="margin-top:6px">' +
          "<tr><th>Field</th><th>Filled</th><th>What it unlocks</th></tr>" +
          rows + "</table>" +
          '<div class="hint" style="margin-top:6px">A field at 0 is one this ' +
          "instance does not fill in &mdash; the API having it is not the same " +
          "as the team using it.</div>" + binVerdict(j));
      })
      .catch(function (e) {
        var wait = document.getElementById("jp-wait");
        if (wait) wait.remove();
        resultEl.insertAdjacentHTML("beforeend",
          '<div class="hint bad" style="margin-top:8px">' + esc(e.message) + "</div>");
      });
  }

  /* Jira connections: list, save, collect, forget.

     `adminHeaders` rather than a per-call copy - four of these need the
     same gate, and a fifth that forgot it would fail in a way that reads
     as a server problem. */
  /* Read one response, whatever it turned out to be.

     Every handler here used to assume the body is JSON, which holds until
     something 500s: FastAPI answers plain `Internal Server Error`, the
     parse fails, and the page reports `Unexpected token 'I'` - a message
     about the error message rather than the error. The real cause was a
     missing PULSE_SECRET_KEY, and none of that reached the screen. */
  function readBody(r) {
    return r.text().then(function (text) {
      var data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
      if (!r.ok) {
        throw new Error(
          (data && data.detail) ||
          (text ? text.slice(0, 300) : "HTTP " + r.status)
        );
      }
      return data;
    });
  }

  function adminHeaders() {
    var h = { "Content-Type": "application/json" };
    try {
      var t = sessionStorage.getItem("pulse-admin-token");
      if (t) h["X-Pulse-Admin-Token"] = t;
    } catch (e) { /* refused below, with a reason */ }
    return h;
  }

  /* The gate, without the content type.
     `fetch` must be left to set `Content-Type` itself for a `FormData` body,
     because only it knows the multipart boundary it generated. Sending
     `application/json` alongside one makes the server parse an empty form and
     answer "field required" about a field that was in fact sent. */
  function adminTokenOnly() {
    var h = {};
    try {
      var t = sessionStorage.getItem("pulse-admin-token");
      if (t) h["X-Pulse-Admin-Token"] = t;
    } catch (e) { /* refused below, with a reason */ }
    return h;
  }

  function loadConnections() {
    return fetch("/api/jira/connections")
      .then(function (r) { return r.ok ? r.json() : { connections: [] }; })
      .then(function (j) {
        var table = document.getElementById("jc-table");
        var empty = document.getElementById("jc-empty");
        if (!table) return;
        // Keep the header row, replace the rest.
        while (table.rows.length > 1) table.deleteRow(1);
        var rows = j.connections || [];
        empty.textContent = rows.length ? ""
          : "No Jira is linked yet. Nothing will appear on the Jira page until one is.";
        rows.forEach(function (c) {
          var tr = table.insertRow();
          tr.innerHTML =
            "<td><b>" + esc(c.project_id) + "</b></td>" +
            "<td><code>" + esc(c.site) + "</code></td>" +
            "<td><b>" + esc(c.project_key) + "</b></td>" +
            '<td><span class="hint">' + esc(c.hint || "stored") + "</span></td>" +
            '<td><button type="button" class="small" data-collect="' + c.id +
            '">Collect</button> ' +
            '<button type="button" class="small" data-tool="' +
            esc(c.project_key) + '">Sync tool</button> ' +
            '<button type="button" class="small" data-drop="' + c.id +
            '">Forget</button></td>';
        });
        wireConnectionButtons();
      });
  }

  function wireConnectionButtons() {
    [].forEach.call(programBox.querySelectorAll("[data-collect]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-collect");
        var was = btn.textContent;
        // A first collection pages through the whole project with a gap
        // between requests, so this is slow by design. Saying so beats a
        // button that looks stuck.
        btn.disabled = true;
        btn.textContent = "Collecting…";
        fetch("/api/jira/connections/" + id + "/collect",
              { method: "POST", headers: adminHeaders() })
          .then(readBody)
          .then(function (j) {
            btn.textContent = was;
            btn.disabled = false;
            alert("Collected " + j.project_key + "\n\n" +
                  j.issues + " issue(s), " + j.changelogs + " change(s), " +
                  j.pages + " page(s)" +
                  (j.truncated ? " (stopped at the page cap)" : "") + "\n" +
                  j.extracted_issues + " issue(s) read into the tool layer.\n\n" +
                  (j.since ? "Only changes since " + j.since + "."
                           : "First collection - everything."));
          })
          .catch(function (e) {
            btn.textContent = was;
            btn.disabled = false;
            alert("Could not collect.\n\n" + e.message);
          });
      });
    });

    /* The sync tool, downloaded rather than linked.

       It carries this server's admin token so it can post what it
       collects, so it is fetched with the token rather than exposed at a
       plain URL - and the warning is said out loud, because a file that
       can write to the server does not look dangerous sitting in a
       Downloads folder. */
    [].forEach.call(programBox.querySelectorAll("[data-tool]"), function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-tool");
        if (!confirm("Download the sync tool for " + key + "?\n\n" +
                     "It reads Jira on whichever computer runs it and sends " +
                     "the result here - for a machine that Jira accepts but " +
                     "this server does not. Save it and double-click it.\n\n" +
                     "Keep it and run it again whenever you want an update: " +
                     "it asks what is already here and reads only what " +
                     "changed, and if Jira cuts it off part way it carries " +
                     "on from there next time.\n\n" +
                     "It contains this server's admin token, so treat the " +
                     "file as a credential and rotate the token afterwards.")) return;
        fetch("/api/jira/sync-tool?project_key=" + encodeURIComponent(key),
              { headers: adminHeaders() })
          .then(function (r) {
            if (!r.ok) return readBody(r);
            return r.blob().then(function (blob) {
              var a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              /* `.cmd`, and it must stay in step with the extension the
                 route sets in `Content-Disposition` - this attribute wins
                 over it, so a stale value here is a file Windows will not
                 double-click no matter what the server said. A `.ps1` is
                 refused on a default install for the execution policy and
                 again for having been downloaded, and the window closes
                 before either message can be read. */
              a.download = "sync-" + key.toLowerCase() + ".cmd";
              document.body.appendChild(a);
              a.click();
              a.remove();
              URL.revokeObjectURL(a.href);
            });
          })
          .catch(function (e) { alert("Could not build the tool.\n\n" + e.message); });
      });
    });

    [].forEach.call(programBox.querySelectorAll("[data-drop]"), function (btn) {
      btn.addEventListener("click", function () {
        if (!confirm("Forget this Jira connection?\n\nThe issues it already " +
                     "collected stay; only the link and its token go.")) return;
        fetch("/api/jira/connections/" + btn.getAttribute("data-drop"),
              { method: "DELETE", headers: adminHeaders() })
          .then(readBody)
          .then(loadConnections)
          .catch(function (e) { alert("Could not forget it.\n\n" + e.message); });
      });
    });
  }

  /* The registered repositories.

     Four states, and the third and fourth must not look alike: a server that
     *cannot* clone (no git, no pipeline) reads differently from one that can
     and has simply not been pointed at anything yet. A page that showed the
     same empty table for both would send somebody to register a repository
     that was never going to be read. */
  function loadRepos() {
    var table = document.getElementById("rp-table");
    var empty = document.getElementById("rp-empty");
    var blocked = document.getElementById("rp-blocked");
    if (!table) return Promise.resolve();
    empty.textContent = "Loading\u2026";

    return fetch("/api/repos")
      .then(function (r) {
        if (!r.ok) throw new Error("the server could not list repositories");
        return r.json();
      })
      .then(function (j) {
        while (table.rows.length > 1) table.deleteRow(1);

        /* State 3: this deployment cannot read a repository at all. The
           reason names the missing piece, so it is shown rather than
           summarised. */
        if (j.can_fetch === false) {
          blocked.style.display = "";
          blocked.textContent = j.reason ||
            "This server cannot read a repository.";
        } else {
          blocked.style.display = "none";
        }

        var rows = j.repos || [];
        empty.textContent = rows.length ? ""
          : "No repository is registered yet. Nothing is traced against code " +
            "until one is.";

        rows.forEach(function (c) {
          var tr = table.insertRow();
          /* A failed refresh is shown on the row rather than only in the
             response of the request that failed - the refresh that breaks is
             usually the one nobody was watching. Paired with the word
             "Failed", never colour alone. */
          var state = c.last_error
            ? '<span class="bad">Failed</span> <span class="hint">' +
              esc(c.last_error) + "</span>"
            : '<code>' + esc(c.short_commit || "\u2014") + "</code>" +
              (c.dirty ? ' <span class="hint">+ uncommitted</span>' : "");
          tr.innerHTML =
            "<td><b>" + esc(c.project_id) + "</b></td>" +
            "<td><code>" + esc(c.repo_url) + "</code></td>" +
            "<td>" + esc(c.ref || "default") + "</td>" +
            "<td><code>" + esc(c.docs_path) + "</code></td>" +
            '<td class="num">' + Number(c.doc_count || 0).toLocaleString() +
            "</td>" +
            "<td>" + state + "</td>" +
            '<td><span class="hint">' +
            (c.private ? esc(c.hint || "stored") : "public") + "</span></td>" +
            '<td><button type="button" class="small" data-refetch="' +
            esc(c.project_id) + '">Refresh</button> ' +
            '<button type="button" class="small" data-forget-repo="' +
            esc(c.project_id) + '">Forget</button></td>';
        });
        wireRepoButtons();
      })
      .catch(function (e) {
        /* State 2: the request itself failed. Distinct from an empty list. */
        while (table.rows.length > 1) table.deleteRow(1);
        empty.className = "hint bad";
        empty.textContent = e.message;
      });
  }

  function wireRepoButtons() {
    [].forEach.call(programBox.querySelectorAll("[data-refetch]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-refetch");
        var was = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Reading\u2026";
        fetch("/api/repos/" + encodeURIComponent(id) + "/refresh",
              { method: "POST", headers: adminHeaders() })
          .then(readBody)
          .then(function (j) {
            /* Whether the repository moved is the answer worth having: it is
               what makes a run built from it knowably stale. */
            alert(j.moved
              ? "Moved to " + j.short_commit + " (was " +
                String(j.previous_commit).slice(0, 12) + "). " +
                j.doc_count + " documents."
              : "Unchanged at " + (j.short_commit || "an unknown commit") +
                ". " + j.doc_count + " documents.");
          })
          .catch(function (e) { alert("Could not read it.\n\n" + e.message); })
          .then(function () {
            btn.disabled = false;
            btn.textContent = was;
            return loadRepos();
          });
      });
    });

    [].forEach.call(programBox.querySelectorAll("[data-forget-repo]"), function (btn) {
      btn.addEventListener("click", function () {
        if (!confirm("Forget this repository?\n\nAnything already derived " +
                     "from it stays; only the registration and its token go.")) return;
        fetch("/api/repos/" +
              encodeURIComponent(btn.getAttribute("data-forget-repo")),
              { method: "DELETE", headers: adminHeaders() })
          .then(readBody)
          .then(loadRepos)
          .catch(function (e) { alert("Could not forget it.\n\n" + e.message); });
      });
    });
  }

  /* `12 Sep 2026`. There is no shared date helper on the static pages - the
     only formatter in the front end is Team.tsx's chart axis - so this matches
     that one's vocabulary rather than inventing a third spelling. Move both to
     one helper if a second page ever needs a date. */
  function uploadedOn(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "—";
    return d.getDate() + " " +
      d.toLocaleDateString("en", { month: "short" }) + " " + d.getFullYear();
  }

  function fileSize(bytes) {
    var kb = Number(bytes || 0) / 1024;
    if (kb < 1) return "<1 kB";
    if (kb < 1024) return Math.round(kb).toLocaleString() + " kB";
    return (kb / 1024).toFixed(1) + " MB";
  }

  /* The stored exports. Four states, as every data view here has: loading,
     failed, none stored, and the rows. "None stored" says what it blocks -
     a run cannot read a backlog it does not have - rather than only that the
     table is empty. */
  function loadExports() {
    var table = document.getElementById("tx-table");
    var empty = document.getElementById("tx-empty");
    if (!table) return Promise.resolve();
    empty.className = "hint";
    empty.textContent = "Loading…";

    return fetch("/api/traceability/export")
      .then(function (r) {
        if (!r.ok) throw new Error("the server could not list stored exports");
        return r.json();
      })
      .then(function (j) {
        while (table.rows.length > 1) table.deleteRow(1);
        var rows = j.exports || [];
        empty.textContent = rows.length ? ""
          : "No export is stored yet. A traceability run reads its tickets " +
            "from one, so nothing can be traced until there is.";

        rows.forEach(function (c) {
          var tr = table.insertRow();
          tr.innerHTML =
            "<td><b>" + esc(c.project_id) + "</b></td>" +
            "<td><code>" + esc(c.original_filename || "—") + "</code></td>" +
            '<td class="num">' + esc(fileSize(c.size)) + "</td>" +
            "<td>" + (c.project_filter
              ? esc(c.project_filter)
              : '<span class="hint">every row</span>') + "</td>" +
            /* Named rather than left blank, because an absent value here is a
               decision with a consequence: reconciliation is skipped. */
            "<td>" + (c.done_status
              ? "<code>" + esc(c.done_status) + "</code>"
              : '<span class="hint">not set &mdash; reconcile skipped</span>') +
            "</td>" +
            "<td>" + esc(uploadedOn(c.updated_at)) + "</td>";
        });
      })
      .catch(function (e) {
        while (table.rows.length > 1) table.deleteRow(1);
        empty.className = "hint bad";
        empty.textContent = e.message;
      });
  }

  function saveExport() {
    var statusEl = document.getElementById("tx-status");
    var fileEl = document.getElementById("tx-file");
    var project = document.getElementById("tx-project").value;

    if (project === "__new__") {
      statusEl.className = "hint bad";
      statusEl.textContent = "Pick an existing project - an export is the " +
        "backlog for one, not a way to create one.";
      return;
    }
    if (!fileEl.files || !fileEl.files.length) {
      statusEl.className = "hint bad";
      statusEl.textContent = "Choose the export workbook first.";
      return;
    }

    var form = new FormData();
    form.append("file", fileEl.files[0]);
    form.append("project_id", project);
    form.append("project_filter", document.getElementById("tx-filter").value.trim());
    form.append("done_status", document.getElementById("tx-done").value.trim());

    statusEl.className = "hint";
    statusEl.textContent = "Storing…";

    fetch("/api/traceability/export",
          { method: "POST", headers: adminTokenOnly(), body: form })
      .then(readBody)
      .then(function (j) {
        statusEl.className = "hint ok";
        statusEl.textContent = "Stored " + (j.original_filename || "the export") +
          " (" + fileSize(j.size) + "). Run it from the Traceability page.";
        fileEl.value = "";
        return loadExports();
      })
      .catch(function (e) {
        statusEl.className = "hint bad";
        statusEl.textContent = e.message;
      });
  }

  function saveRepo() {
    var statusEl = document.getElementById("rp-status");
    var body = {
      project_id: document.getElementById("rp-project").value,
      repo_url: document.getElementById("rp-url").value.trim(),
      ref: document.getElementById("rp-ref").value.trim(),
      docs_path: document.getElementById("rp-docs").value.trim() || "docs",
      token: document.getElementById("rp-token").value
    };
    if (body.project_id === "__new__") {
      statusEl.className = "hint bad";
      statusEl.textContent = "Pick an existing project - a repository is the " +
        "code for one, not a way to create one.";
      return;
    }
    statusEl.className = "hint";
    /* The clone happens inside this request, so it is slow the first time.
       Saying so beats a button that looks stuck. */
    statusEl.textContent = "Reading the repository\u2026";

    fetch("/api/repos",
          { method: "POST", headers: adminHeaders(), body: JSON.stringify(body) })
      .then(readBody)
      .then(function (j) {
        statusEl.className = "hint ok";
        statusEl.textContent = "Registered at " + (j.short_commit || "this revision") +
          " - " + j.doc_count + " document" + (j.doc_count === 1 ? "" : "s") +
          " under " + j.docs_path + "/.";
        document.getElementById("rp-token").value = "";
        return loadRepos();
      })
      .catch(function (e) {
        statusEl.className = "hint bad";
        statusEl.textContent = e.message;
      });
  }

  function saveConnection() {
    var statusEl = document.getElementById("jc-status");
    var body = {
      project_id: document.getElementById("jc-project").value,
      site: document.getElementById("jc-site").value.trim(),
      email: document.getElementById("jc-email").value.trim(),
      project_key: document.getElementById("jc-key").value.trim(),
      token: document.getElementById("jc-token").value
    };
    if (body.project_id === "__new__") {
      statusEl.className = "hint bad";
      statusEl.textContent = "Pick an existing project - a Jira link needs one to feed.";
      return;
    }
    statusEl.className = "hint";
    statusEl.textContent = "Saving…";

    fetch("/api/jira/connections",
          { method: "POST", headers: adminHeaders(), body: JSON.stringify(body) })
      .then(readBody)
      .then(function () {
        statusEl.textContent = "Saved. Use Collect to pull the issues in.";
        document.getElementById("jc-token").value = "";
        return loadConnections();
      })
      .catch(function (e) {
        statusEl.className = "hint bad";
        statusEl.textContent = e.message;
      });
  }

  function uploadSource() {
    var statusEl = document.getElementById("up-status");
    var resultEl = document.getElementById("up-result");
    var fileInput = document.getElementById("up-file");
    var target = document.getElementById("up-target").value;
    var kind = document.getElementById("up-kind").value;
    var name = document.getElementById("up-name").value.trim();

    if (!fileInput.files.length) {
      statusEl.className = "hint bad";
      statusEl.textContent = "Choose a workbook first.";
      return;
    }
    if (target === "__new__" && !name) {
      statusEl.className = "hint bad";
      statusEl.textContent = "Name the new project first.";
      return;
    }

    var body = new FormData();
    body.append("file", fileInput.files[0]);
    body.append("sheet_kind", kind);
    if (target === "__new__") {
      body.append("project_name", name);
    } else {
      body.append("project_id", target);
    }

    statusEl.className = "hint";
    statusEl.textContent = "Uploading and syncing…";
    resultEl.innerHTML = "";
    document.getElementById("up-submit").disabled = true;

    fetch("/api/sources/upload", { method: "POST", body: body })
      .then(readBody)
      .then(function (j) {
        if (!j.ok) {
          statusEl.textContent = "";
          resultEl.innerHTML = '<div class="hint bad" style="margin-top:8px">' + esc(j.error) + "</div>";
          return;
        }
        // Refresh first - it replaces this whole card, `up-result` included -
        // then write the outcome into the card that replacement just made.
        return loadProgram().then(function () {
          var freshResult = document.getElementById("up-result");
          var freshStatus = document.getElementById("up-status");
          if (freshStatus) freshStatus.textContent = "";
          if (!freshResult) return;
          var notes = (j.notes || []).map(function (n) {
            return "<div>" + esc(n) + "</div>";
          }).join("");
          // Which tab was read, because that is now resolved from the
          // workbook's own contents rather than fixed - a person uploading a
          // file with several sheets should see which one we took.
          freshResult.innerHTML =
            '<div class="hint" style="margin-top:10px"><span class="ok">' + esc(j.project_name) +
            "</span> &middot; " + j.rows_ok + " row(s), " + j.changes_emitted + " change(s)" +
            (j.rows_rejected ? ", " + j.rows_rejected + " rejected" : "") +
            (j.sheet_name ? " &middot; read the <b>" + esc(j.sheet_name) + "</b> tab" : "") +
            "</div>" +
            '<div class="hint" style="margin-top:4px">' + notes + "</div>" +
            conversionHtml(j.conversion);
        });
      })
      .catch(function (e) {
        statusEl.textContent = "";
        resultEl.innerHTML = '<div class="hint bad" style="margin-top:8px">' + esc(e.message) + "</div>";
      })
      .then(function () {
        var submit = document.getElementById("up-submit");
        if (submit) submit.disabled = false;
      });
  }

  // What a Jira export could not tell us. Rendered from the server's own
  // report rather than restated here, so the page and the converter cannot
  // disagree about which columns arrived empty.
  function conversionHtml(cover) {
    if (!cover) return "";
    var empty = (cover.columns || []).filter(function (c) { return !c.filled; })
      .map(function (c) { return c.column; });
    var notes = (cover.notes || []).map(function (n) {
      return '<div style="margin-top:4px">&bull; ' + esc(n) + "</div>";
    }).join("");
    return '<div class="hint" style="margin-top:8px">' +
      "Converted " + cover.issues + " Jira issue(s) into a schedule sheet." +
      (empty.length ? " Empty after conversion: <b>" + esc(empty.join(", ")) + "</b>." : "") +
      notes + "</div>";
  }

  function renderRules() {
    var rows = program.rules.map(function (r) {
      var conds = r.conditions.map(function (c) {
        return '<code style="display:block">' + esc(c) + "</code>";
      }).join("");
      return '<tr><td><code>' + esc(r.id) + "</code><div class=\"hint\" style=\"margin:3px 0 0\">" +
        esc(r.category) + "</div></td>" +
        '<td><span class="sev" style="background:' + (SEV[r.severity] || "var(--ink-3)") + '">' +
        esc(r.severity) + "</span></td>" +
        "<td>" + conds + "</td>" +
        "<td>" + esc(r.headline) + '<div class="hint" style="margin:4px 0 0"><i>' +
        esc(r.rationale) + "</i></div></td></tr>";
    }).join("");

    programBox.innerHTML =
      '<div class="card"><div class="lbl">Rule table &mdash; ' + esc(program.rule_table) + "</div>" +
      '<div class="hint" style="margin:6px 0 12px">Every finding in the product is defended by ' +
      "pointing at one of these thresholds, so they are shown in full. <b>Read-only:</b> a rule table " +
      "edited in a browser is one with no review and no history. The prose keeps its " +
      "<code>{{tokens}}</code> &mdash; this screen is about the rule, not about today&rsquo;s numbers.</div>" +
      '<table class="grid"><tr><th>Rule</th><th>Severity</th><th>Fires when</th>' +
      "<th>Says, and why that threshold</th></tr>" + rows + "</table></div>";
  }

  var SCOPES = {
    sources: "watched sources, uploads and project pairing",
    rules: "the thresholds every finding is defended by",
  };

  function show(next) {
    view = next;
    var buttons = document.querySelectorAll("#subtabs button");
    for (var i = 0; i < buttons.length; i++) {
      if (buttons[i].getAttribute("data-view") === view) {
        buttons[i].setAttribute("aria-current", "page");
      } else {
        buttons[i].removeAttribute("aria-current");
      }
    }

    var scope = document.querySelector(".appbar .scope");
    if (scope) scope.textContent = SCOPES[view] || "";

    // The other four tabs are separate documents with their own <title>; these
    // two share one, so it has to be set rather than served.
    document.title =
      (view === "rules" ? "Rule table" : "Sources") + " - Settings - ProjectPulse";

    /* Keep the address bar honest. Without this, switching to the rule table
       and reloading - or sharing the URL - lands back on Sources, and the tab
       the other three pages link to would not be the one that opens. */
    try {
      var url = view === "rules" ? "/settings?view=rules" : "/settings";
      window.history.replaceState(null, "", url);
    } catch (e) {
      // Opened as a file, or history blocked. The tab still switched.
    }

    if (view === "sources") renderSources();
    if (view === "rules") renderRules();
  }

  document.getElementById("subtabs").addEventListener("click", function (e) {
    var next = e.target.getAttribute && e.target.getAttribute("data-view");
    if (!next) return;
    if (!program) return;
    show(next);
  });

  /* Allowed to fail: a database that is down costs these tabs and nothing
     else. Also called after a successful upload, so the sources table and
     project pairing reflect it without a reload. */
  function loadProgram() {
    return fetch("/api/program")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        program = j;
        // `show` rather than a bare render: the row, the subtitle and the URL
        // all have to agree with whichever tab the URL opened on.
        show(view);
      })
      .catch(function () { program = null; });
  }

  loadProgram();
})();
</script>
</main>
</div>
</body>
</html>
