<!doctype html>
<!--
  Program configuration: watched sources, project pairing, the rule table.

  The narration form used to live here too - provider, model, endpoint and an
  API key. It moved to `/llm`, which sets a model per *feature* rather than one
  for the whole app, and keeps keys in the encrypted store. Leaving a second
  copy here would not merely have been duplication: this page's save path wrote
  the key as plaintext JSON, so whichever form someone happened to use decided
  whether their credential was encrypted.

  Hand-written rather than part of the React app on purpose: this is the page
  someone opens when the model is NOT working, so it must not depend on the
  bundle being fresh, on npm, or on anything the failure might have taken with
  it. It uses the shared shell tokens, so it follows the theme like every other
  page.

  The page never receives the API key. It gets a hint ("sk-ant-...bQ4A") and a
  boolean, and it sends a key only when someone types one - an untouched field
  submits nothing and the stored key is left alone.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sources - Settings - ProjectPulse</title>
  <!-- Sets data-theme before the stylesheet paints anything, so a saved or
       system dark preference does not flash light first. Kept identical
       across all four rail copies - see theme.js. -->
  <script>(function(){try{var t=localStorage.getItem("pulse-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <link rel="stylesheet" href="/static/shell.css">
  <script src="/static/theme.js" defer></script>
<script src="/static/rail.js" defer></script>
  <style>
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    /* One frame width across the whole Settings section. The four tabs used
       to be 780, 900, 980 and 1120 wide, and `margin: 0 auto` re-centred each
       one - so the title and the tab row slid sideways every time you changed
       tab, which is the other half of why these did not read as one page.
       Content keeps its own comfortable width below. */
    .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 20px 60px; }
    h1 { font-size: 19px; margin: 0 0 4px; }
    .sub { color: var(--ink-2); font-size: 13px; margin-bottom: 20px; }
    .card { max-width: 820px; background: var(--surface); border: 1px solid var(--rule);
            border-radius: 8px; padding: 18px 20px; margin-bottom: 14px; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: .07em;
           text-transform: uppercase; color: var(--ink-3); }
    label { display: block; font-size: 12.5px; color: var(--ink-2); margin: 14px 0 5px; }
    input[type=text], input[type=password], select {
      width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit;
      font-size: 13px; color: var(--ink); background: var(--bg);
      border: 1px solid var(--rule); border-radius: 6px;
    }
    input:focus, select:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
    .row { display: flex; align-items: center; gap: 10px; }
    button { font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
             border-radius: 6px; padding: 9px 16px; border: 1px solid var(--rule);
             background: var(--bg); color: var(--ink); }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    button:disabled { opacity: .55; cursor: default; }
    .hint { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
    .warn { border-left: 2px solid var(--amber); padding-left: 12px;
            font-size: 12.5px; color: var(--ink-2); margin-top: 14px; }
    .ok { color: var(--green); }
    .bad { color: var(--red); }
    pre { white-space: pre-wrap; font: 12.5px/1.6 system-ui, sans-serif;
          background: var(--bg); border: 1px solid var(--rule); border-radius: 6px;
          padding: 12px 14px; margin: 10px 0 0; }
    code { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: 12px; }
    .pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px;
            padding: 2px 10px; border: 1px solid var(--rule); color: var(--ink-2); }
    .key-row { position: relative; }
    .key-row input { padding-right: 62px; font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; }
    .key-toggle { position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
                  font-size: 11px; font-weight: 700; padding: 5px 9px; border-radius: 4px; }
    table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.grid th { text-align: left; font-size: 10.5px; letter-spacing: .06em;
                    text-transform: uppercase; color: var(--ink-3); font-weight: 700;
                    padding: 0 10px 7px 0; border-bottom: 1px solid var(--rule); }
    table.grid td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--rule-2);
                    vertical-align: top; }
    .sev { font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
           border-radius: 4px; padding: 2px 7px; color: var(--surface); }
  </style>
</head>
<body>
<div class="shell">
<nav class="rail" aria-label="Sections">
  <a class="brand" href="/insight" aria-label="ProjectPulse"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></a>
  <button type="button" class="theme-toggle" data-theme-toggle><svg viewBox="0 0 24 24"></svg></button>
  <a href="/programs"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Program</span></a>
  <a href="/projects"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 11h18"/></svg><span>Projects</span></a>
  <a href="/gantt"><svg viewBox="0 0 24 24"><path d="M4 6h9M4 12h14M4 18h6"/></svg><span>Schedule</span></a>
  <a href="/insight"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span>Insight</span></a>
  <a href="/traceability"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1.6"/><circle cx="4" cy="12" r="1.6"/><circle cx="4" cy="18" r="1.6"/></svg><span>Trace</span></a>
  <a href="/risk"><svg viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><span>Risk</span></a>
  <a href="/team"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.5a3 3 0 0 1 0 5"/><path d="M18 20a6 6 0 0 0-2-4.5"/></svg><span>Team</span></a>
  <a href="/reports"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span>Reports</span></a>
  <a href="/agent"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 20h8"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/><path d="M9 14h6"/></svg><span>Agent</span></a>
  <a href="/settings" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Settings</span></a>
</nav>
<main>
<div class="wrap">

  <div class="appbar">
    <h1>Settings</h1>
    <span class="scope">watched sources, uploads and project pairing</span>
  </div>
  <nav class="subtabs" id="subtabs">
    <button type="button" data-view="sources" aria-current="page">Sources</button>
    <button type="button" data-view="rules">Rule table</button>
    <a href="/imports">Imports</a>
    <a href="/llm">Models &amp; keys</a>
    <a href="/usage">Usage</a>
  </nav>

  <div id="program">Loading&hellip;</div>
</div>

<script>
(function () {
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }

  var SEV = { critical: "var(--red)", high: "var(--red)", medium: "var(--orange)",
              low: "var(--blue)", info: "var(--ink-3)" };
  var programBox = document.getElementById("program");
  var program = null;
  /* The tab the URL asks for. Sources and the rule table are views of this
     one document, but the other three tabs are separate pages - so the rule
     table needs a URL of its own, or a link to it from those pages has
     nowhere to point and the row disagrees with itself. */
  var params = new URLSearchParams(window.location.search);
  var view = params.get("view") === "rules" ? "rules" : "sources";

  function renderSources() {
    var rows = program.sources.map(function (src) {
      var when = src.last_scan ? String(src.last_scan).replace("T", " ").slice(0, 16) : "never";
      return "<tr><td><b>" + esc(src.scope) + "</b><div class=\"hint\" style=\"margin:2px 0 0\">" +
        "<code>" + esc(src.path) + "</code></div></td>" +
        "<td>" + esc(src.kind) + "</td>" +
        "<td>" + (src.exists ? '<span class="ok">present</span>' : '<span class="bad">missing</span>') + "</td>" +
        "<td>" + esc(when) + "</td><td>" + src.rows + "</td></tr>";
    }).join("");

    var scope = program.scope.map(function (p) {
      var also = p.also.length
        ? p.also.map(function (a) { return "<code>" + esc(a) + "</code>"; }).join(", ")
        : "<span class=\"hint\">no other source</span>";
      return "<tr><td><b>" + esc(p.name) + "</b></td><td><code>" + esc(p.canonical_id) +
        "</code></td><td>" + also + "</td></tr>";
    }).join("");

    var projectOptions = program.scope.map(function (p) {
      return '<option value="' + esc(p.canonical_id) + '">' + esc(p.name) + "</option>";
    }).join("");

    programBox.innerHTML =
      '<div class="card"><div class="lbl">Upload a document</div>' +
      '<div class="hint" style="margin:6px 0 12px">The alternative to the OneDrive-synced folder below ' +
      "&mdash; the only way to add data on a deployed host, which has no such folder to sync. " +
      "Ingests through the same reader, differ and rules as everything else. " +
      "The tab is found from the workbook's own contents, so it can be called anything &mdash; " +
      "it needs a header row with the template's columns, including <code>Task ID</code>, " +
      "which is what identifies a row across imports.</div>" +
      '<label for="up-target">Project</label>' +
      '<select id="up-target">' +
        '<option value="__new__">New project&hellip;</option>' +
        projectOptions +
      "</select>" +
      '<input type="text" id="up-name" placeholder="project name" style="margin-top:8px">' +
      '<label for="up-kind">Sheet</label>' +
      '<select id="up-kind">' +
        '<option value="schedule">Schedule (Activities)</option>' +
        '<option value="worklog">Worklog</option>' +
        '<option value="jira_export">Jira issue export</option>' +
      "</select>" +
      '<div class="hint" id="up-kind-hint" style="margin-top:6px"></div>' +
      '<label for="up-file">Workbook</label>' +
      '<input type="file" id="up-file" accept=".xlsx,.xlsm">' +
      '<div class="row" style="margin-top:14px">' +
        '<button class="primary" id="up-submit">Upload &amp; sync</button>' +
        '<span id="up-status" class="hint" style="margin:0"></span>' +
      "</div>" +
      '<div id="up-result"></div>' +
      "</div>" +
      '<div class="card"><div class="lbl">Watched sources</div>' +
      '<div class="hint" style="margin:6px 0 12px">Read from <code>' + esc(program.data_root) +
      "</code>. A missing file is a note, not a failure &mdash; someone has not uploaded this week&rsquo;s sheet yet.</div>" +
      '<table class="grid"><tr><th>Scope</th><th>Kind</th><th>File</th><th>Last scan</th><th>Rows</th></tr>' +
      rows + "</table></div>" +
      '<div class="card"><div class="lbl">Project pairing</div>' +
      '<div class="hint" style="margin:6px 0 12px">One delivery project can have several source ids. ' +
      "Jira and Excel each create their own row for the same work, and without this pairing a Jira event " +
      "could never explain a spreadsheet observation.</div>" +
      '<table class="grid"><tr><th>Project</th><th>Canonical id</th><th>Also known as</th></tr>' +
      scope + "</table></div>";

    var target = document.getElementById("up-target");
    var nameField = document.getElementById("up-name");
    function syncNameField() {
      nameField.style.display = target.value === "__new__" ? "" : "none";
    }
    target.addEventListener("change", syncNameField);
    syncNameField();

    document.getElementById("up-submit").addEventListener("click", uploadSource);

    // Said before the upload, not after: a Jira export cannot carry a baseline
    // or dependency edges, and finding that out from a flat dashboard is worse
    // than being told while choosing the file.
    var kindEl = document.getElementById("up-kind");
    var kindHint = document.getElementById("up-kind-hint");
    function describeKind() {
      if (!kindHint) return;
      kindHint.innerHTML = kindEl.value.indexOf("jira") === 0
        ? "Upload the workbook straight from Jira&rsquo;s <b>Excel (All fields)</b> export. " +
          "It is converted into a schedule sheet here. Jira has no baseline or " +
          "dependency column, so recorded slip stays empty until a <i>second</i> " +
          "export is uploaded &mdash; the differ compares the two. Effort is taken " +
          "from the same file when the export carries it."
        : "";
    }
    kindEl.addEventListener("change", describeKind);
    describeKind();
  }

  function uploadSource() {
    var statusEl = document.getElementById("up-status");
    var resultEl = document.getElementById("up-result");
    var fileInput = document.getElementById("up-file");
    var target = document.getElementById("up-target").value;
    var kind = document.getElementById("up-kind").value;
    var name = document.getElementById("up-name").value.trim();

    if (!fileInput.files.length) {
      statusEl.className = "hint bad";
      statusEl.textContent = "Choose a workbook first.";
      return;
    }
    if (target === "__new__" && !name) {
      statusEl.className = "hint bad";
      statusEl.textContent = "Name the new project first.";
      return;
    }

    var body = new FormData();
    body.append("file", fileInput.files[0]);
    body.append("sheet_kind", kind);
    if (target === "__new__") {
      body.append("project_name", name);
    } else {
      body.append("project_id", target);
    }

    statusEl.className = "hint";
    statusEl.textContent = "Uploading and syncing…";
    resultEl.innerHTML = "";
    document.getElementById("up-submit").disabled = true;

    fetch("/api/sources/upload", { method: "POST", body: body })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
          return j;
        });
      })
      .then(function (j) {
        if (!j.ok) {
          statusEl.textContent = "";
          resultEl.innerHTML = '<div class="hint bad" style="margin-top:8px">' + esc(j.error) + "</div>";
          return;
        }
        // Refresh first - it replaces this whole card, `up-result` included -
        // then write the outcome into the card that replacement just made.
        return loadProgram().then(function () {
          var freshResult = document.getElementById("up-result");
          var freshStatus = document.getElementById("up-status");
          if (freshStatus) freshStatus.textContent = "";
          if (!freshResult) return;
          var notes = (j.notes || []).map(function (n) {
            return "<div>" + esc(n) + "</div>";
          }).join("");
          // Which tab was read, because that is now resolved from the
          // workbook's own contents rather than fixed - a person uploading a
          // file with several sheets should see which one we took.
          freshResult.innerHTML =
            '<div class="hint" style="margin-top:10px"><span class="ok">' + esc(j.project_name) +
            "</span> &middot; " + j.rows_ok + " row(s), " + j.changes_emitted + " change(s)" +
            (j.rows_rejected ? ", " + j.rows_rejected + " rejected" : "") +
            (j.sheet_name ? " &middot; read the <b>" + esc(j.sheet_name) + "</b> tab" : "") +
            "</div>" +
            '<div class="hint" style="margin-top:4px">' + notes + "</div>" +
            conversionHtml(j.conversion);
        });
      })
      .catch(function (e) {
        statusEl.textContent = "";
        resultEl.innerHTML = '<div class="hint bad" style="margin-top:8px">' + esc(e.message) + "</div>";
      })
      .then(function () {
        var submit = document.getElementById("up-submit");
        if (submit) submit.disabled = false;
      });
  }

  // What a Jira export could not tell us. Rendered from the server's own
  // report rather than restated here, so the page and the converter cannot
  // disagree about which columns arrived empty.
  function conversionHtml(cover) {
    if (!cover) return "";
    var empty = (cover.columns || []).filter(function (c) { return !c.filled; })
      .map(function (c) { return c.column; });
    var notes = (cover.notes || []).map(function (n) {
      return '<div style="margin-top:4px">&bull; ' + esc(n) + "</div>";
    }).join("");
    return '<div class="hint" style="margin-top:8px">' +
      "Converted " + cover.issues + " Jira issue(s) into a schedule sheet." +
      (empty.length ? " Empty after conversion: <b>" + esc(empty.join(", ")) + "</b>." : "") +
      notes + "</div>";
  }

  function renderRules() {
    var rows = program.rules.map(function (r) {
      var conds = r.conditions.map(function (c) {
        return '<code style="display:block">' + esc(c) + "</code>";
      }).join("");
      return '<tr><td><code>' + esc(r.id) + "</code><div class=\"hint\" style=\"margin:3px 0 0\">" +
        esc(r.category) + "</div></td>" +
        '<td><span class="sev" style="background:' + (SEV[r.severity] || "var(--ink-3)") + '">' +
        esc(r.severity) + "</span></td>" +
        "<td>" + conds + "</td>" +
        "<td>" + esc(r.headline) + '<div class="hint" style="margin:4px 0 0"><i>' +
        esc(r.rationale) + "</i></div></td></tr>";
    }).join("");

    programBox.innerHTML =
      '<div class="card"><div class="lbl">Rule table &mdash; ' + esc(program.rule_table) + "</div>" +
      '<div class="hint" style="margin:6px 0 12px">Every finding in the product is defended by ' +
      "pointing at one of these thresholds, so they are shown in full. <b>Read-only:</b> a rule table " +
      "edited in a browser is one with no review and no history. The prose keeps its " +
      "<code>{{tokens}}</code> &mdash; this screen is about the rule, not about today&rsquo;s numbers.</div>" +
      '<table class="grid"><tr><th>Rule</th><th>Severity</th><th>Fires when</th>' +
      "<th>Says, and why that threshold</th></tr>" + rows + "</table></div>";
  }

  var SCOPES = {
    sources: "watched sources, uploads and project pairing",
    rules: "the thresholds every finding is defended by",
  };

  function show(next) {
    view = next;
    var buttons = document.querySelectorAll("#subtabs button");
    for (var i = 0; i < buttons.length; i++) {
      if (buttons[i].getAttribute("data-view") === view) {
        buttons[i].setAttribute("aria-current", "page");
      } else {
        buttons[i].removeAttribute("aria-current");
      }
    }

    var scope = document.querySelector(".appbar .scope");
    if (scope) scope.textContent = SCOPES[view] || "";

    // The other four tabs are separate documents with their own <title>; these
    // two share one, so it has to be set rather than served.
    document.title =
      (view === "rules" ? "Rule table" : "Sources") + " - Settings - ProjectPulse";

    /* Keep the address bar honest. Without this, switching to the rule table
       and reloading - or sharing the URL - lands back on Sources, and the tab
       the other three pages link to would not be the one that opens. */
    try {
      var url = view === "rules" ? "/settings?view=rules" : "/settings";
      window.history.replaceState(null, "", url);
    } catch (e) {
      // Opened as a file, or history blocked. The tab still switched.
    }

    if (view === "sources") renderSources();
    if (view === "rules") renderRules();
  }

  document.getElementById("subtabs").addEventListener("click", function (e) {
    var next = e.target.getAttribute && e.target.getAttribute("data-view");
    if (!next) return;
    if (!program) return;
    show(next);
  });

  /* Allowed to fail: a database that is down costs these tabs and nothing
     else. Also called after a successful upload, so the sources table and
     project pairing reflect it without a reload. */
  function loadProgram() {
    return fetch("/api/program")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        program = j;
        // `show` rather than a bare render: the row, the subtitle and the URL
        // all have to agree with whichever tab the URL opened on.
        show(view);
      })
      .catch(function () { program = null; });
  }

  loadProgram();
})();
</script>
</main>
</div>
</body>
</html>
