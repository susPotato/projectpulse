<!doctype html>
<!--
  Jira-to-code traceability.

  Hand-written rather than part of the React app, for the same reason as
  /settings: the data comes from a different repository's run directory, and
  the bundle must not acquire a dependency on that pipeline existing. It uses
  the shared shell tokens, so it follows the theme like every other page.

  Read-only. The page never triggers a model call - every figure on it was
  produced by a `tracelink` run that already happened and already reported
  what it cost.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traceability - ProjectPulse</title>
  <!-- Sets data-theme before the stylesheet paints anything, so a saved or
       system dark preference does not flash light first. Kept identical
       across all rail copies - see theme.js. -->
  <script>(function(){try{var t=localStorage.getItem("pulse-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <!-- The sign-in gate. Not deferred, and ahead of the stylesheets and the
       rest of the scripts: everything below is work on a page this visitor
       may not be allowed to see, and a deferred redirect paints it first. -->
  <script src="/static/auth.js"></script>
  <link rel="stylesheet" href="/static/shell.css">
  <script src="/static/theme.js" defer></script>
<script src="/static/rail.js" defer></script>
  <style>
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 22px 20px 70px; }
    h1 { font-size: 19px; margin: 0 0 4px; }
    .sub { color: var(--ink-2); font-size: 13px; margin-bottom: 18px; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: .07em;
           text-transform: uppercase; color: var(--ink-3); }

    .tiles { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .tile { background: var(--surface); border: 1px solid var(--rule);
            border-radius: 8px; padding: 9px 13px; min-width: 96px; }
    .tile b { display: block; font-size: var(--text-title); font-weight: 650;
              font-variant-numeric: tabular-nums; }
    .tile .lbl { margin-top: 1px; }

    /* The verification mix, as one bar rather than four tiles in a row.
       Same four counts, one comparison instead of four, and the whole
       width is the whole set - which is the figure a reader was otherwise
       assembling in their head out of "76" and "173".

       Every segment is a link into exactly the work items it counts. That
       is the point of drawing it: a proportion you can open. */
    .mix { background: var(--surface); border: 1px solid var(--rule);
           border-radius: 8px; padding: 13px 15px; margin-bottom: 14px; }
    .mix-head { display: flex; align-items: baseline; gap: 10px;
                flex-wrap: wrap; margin-bottom: 10px; }
    .mix-head h2 { font-size: var(--text-emph); font-weight: 650; margin: 0; }
    .mix-head .muted { font-size: var(--text-body); }
    .mix-bar { display: flex; height: 10px; width: 100%; overflow: hidden;
               border-radius: 999px; background: var(--rule-2);
               transform-origin: left center; }
    .mix-bar span { height: 100%; display: block; }
    .mix-legend { display: flex; flex-wrap: wrap; gap: 6px 20px;
                  margin-top: 11px; }
    .mix-legend a, .mix-legend span.leg { display: inline-flex;
      align-items: baseline; gap: 6px; text-decoration: none; color: inherit; }
    .mix-legend i { width: 8px; height: 8px; border-radius: 999px;
                    align-self: center; flex: 0 0 8px; }
    .mix-legend b { font-size: var(--text-emph); font-weight: 650;
                    font-variant-numeric: tabular-nums; }
    .mix-legend a b { text-decoration: underline;
                      text-decoration-color: var(--rule);
                      text-underline-offset: 2px; }
    .mix-legend a:hover b { text-decoration-color: currentColor; }
    .mix-legend em { font-style: normal; color: var(--ink-2);
                     font-size: var(--text-body); }
    /* Confirmed is green, conflicts are red, status concerns are amber -
       the three status meanings this product reserves those hues for.
       "Need review" gets none of them: it is absence of evidence, not a
       warning, and painting 95 unmeasured items amber would tell a PM they
       are in trouble when what is true is that nobody has looked yet. */
    .f-good { background: var(--green); } .c-good { color: var(--green); }
    .f-unknown { background: color-mix(in oklab, var(--ink-3) 45%, transparent); }
    .c-unknown { color: var(--ink-2); }
    .f-bad { background: var(--red); } .c-bad { color: var(--red); }
    .f-warn { background: var(--amber); } .c-warn { color: var(--amber); }

    /* Why this list is shorter than the last one. Shown whenever a filter
       is set, whether the reader set it or a link from the Insight page
       did - arriving at a pre-filtered list with nothing saying so is how
       a filtered view gets read as a total. */
    .chip-row { display: flex; align-items: center; gap: 8px;
                flex-wrap: wrap; margin: -4px 0 12px; }
    .chip { display: inline-flex; align-items: center; gap: 7px;
            font-size: var(--text-body); border: 1px solid var(--rule);
            background: var(--surface); border-radius: 999px;
            padding: 3px 5px 3px 11px; color: var(--ink-2); }
    .chip b { color: var(--ink); font-weight: 600; }
    .chip button { font: inherit; font-size: var(--text-label);
                   border: 0; background: var(--rule-2); color: var(--ink-2);
                   border-radius: 999px; padding: 3px 9px; cursor: pointer;
                   transition: background-color var(--dur-tap) var(--ease-out),
                               color var(--dur-tap) var(--ease-out); }
    .chip button:hover { background: var(--red); color: var(--surface); }

    /* The one primary action on this page: produce a run rather than only
       read one. Sits in the project bar because what it runs is whatever
       project that picker names. */
    button.run { font: inherit; font-size: var(--text-body); font-weight: 600;
                 cursor: pointer; border-radius: 6px; padding: 7px 14px;
                 border: 1px solid var(--blue); background: var(--blue);
                 color: var(--on-accent);
                 transition: opacity var(--dur-tap) var(--ease-out); }
    button.run:hover { opacity: .88; }
    button.run:disabled { opacity: .55; cursor: default; }
    /* The second of the two. Outlined rather than filled: rule 8 allows one
       primary action per screen, and which of these is primary depends on
       whether the project has been traced yet - so neither is filled
       permanently and `.secondary` moves between them in `paintRunInfo`. */
    button.run.secondary { background: none; color: var(--blue); }
    button.run.secondary:hover { background: color-mix(in srgb, var(--blue) 10%, transparent);
                                 opacity: 1; }
    /* The stage the pipeline is on. `tabular-nums` because the elapsed
       seconds tick beside it and digits of different widths make the whole
       line jitter once a second. */
    .run-state { font-size: var(--text-label); color: var(--ink-3);
                 font-variant-numeric: tabular-nums; }
    .run-state.ok { color: var(--green); }
    .run-state.bad { color: var(--red); }
    /* The tail of the pipeline's own output, for a run that stopped. Shown
       rather than summarised: the last lines name the stage and what it
       wanted, which no paraphrase of ours would improve on. */
    details.runlog { margin-top: 10px; }
    details.runlog > summary { cursor: pointer; font-size: var(--text-label);
                               color: var(--ink-3); }
    details.runlog pre { margin: 8px 0 0; padding: 10px 12px; max-height: 260px;
                         overflow: auto; background: var(--bg);
                         border: 1px solid var(--rule); border-radius: 6px;
                         font-size: var(--text-label); white-space: pre-wrap;
                         color: var(--ink-2); }

    /* Collapsed by default. Two sentences about what the export cannot
       support are worth having and are not worth the top of the page. */
    details.notes { background: var(--surface); border: 1px solid var(--rule);
                    border-radius: 8px; margin-bottom: 14px; }
    details.notes > summary { cursor: pointer; list-style: none;
      padding: 9px 13px; font-size: var(--text-body); color: var(--ink-2);
      display: flex; align-items: center; gap: 8px; }
    details.notes > summary::-webkit-details-marker { display: none; }
    details.notes > summary::before { content: "\25B8"; color: var(--ink-3);
      transition: transform var(--dur-tap) var(--ease-out); }
    details.notes[open] > summary::before { transform: rotate(90deg); }
    details.notes .note-line { padding: 3px 13px; font-size: var(--text-body);
      color: var(--ink-2); border-left: 3px solid var(--rule);
      margin: 0 13px 8px; }
    details.notes .note-line:first-of-type { margin-top: 2px; }
    details.notes .lv-blocker { border-left-color: var(--red); }
    details.notes .lv-warning { border-left-color: var(--amber); }

    /* A finding group the Insight page can link straight to. The offset
       keeps the heading clear of the sticky nothing above it and, more to
       the point, gives `scrollIntoView` somewhere to land that is not the
       very top of the heading's own text. */
    .kind { scroll-margin-top: 16px; }
    .kind-focus { animation: kind-flash 1.6s var(--ease-out) 1; }
    @keyframes kind-flash {
      0%, 12% { background: color-mix(in oklab, var(--navy) 14%, transparent); }
      100% { background: transparent; }
    }

    details.card { transition: border-color var(--dur-tap) var(--ease-out),
                               box-shadow var(--dur-tap) var(--ease-out); }
    details.card:hover { border-color: color-mix(in oklab, var(--navy) 35%,
                                                 var(--rule)); }
    details.card > summary::-webkit-details-marker { display: none; }

    .subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule);
               margin-bottom: 16px; }
    .subtabs button { background: none; border: 0; border-bottom: 2px solid transparent;
                      color: var(--ink-2); font: inherit; font-size: 13px;
                      padding: 8px 14px; cursor: pointer; }
    .subtabs button[aria-current=page] { color: var(--ink); font-weight: 600;
                                         border-bottom-color: var(--navy); }

    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
           margin-bottom: 14px; }
    input[type=search], select { padding: 7px 10px; font: inherit; font-size: 13px;
      color: var(--ink); background: var(--surface);
      border: 1px solid var(--rule); border-radius: 6px; }
    input[type=search] { min-width: 260px; }

    details.card { background: var(--surface); border: 1px solid var(--rule);
                   border-radius: 8px; margin-bottom: 8px; }
    details.card > summary { padding: 10px 13px; cursor: pointer; display: flex;
                             gap: 9px; align-items: center; list-style: none; }
    details.card > summary::-webkit-details-marker { display: none; }
    details.card[open] > summary { border-bottom: 1px solid var(--rule-2); }
    .body { padding: 13px; }
    .sum { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px;
           border: 1px solid var(--rule); color: var(--ink-3); white-space: nowrap; }
    .t-corroborated { color: var(--green); border-color: currentColor; }
    .t-contradicted { color: var(--red); border-color: currentColor; }
    .t-unverified { color: var(--ink-3); }
    .t-conflict { color: var(--orange); border-color: currentColor; font-weight: 600; }
    .t-scope { color: var(--purple); border-color: currentColor; }
    /* Findings reuse the verdict palette rather than adding a second one:
       red is "the code disagrees" wherever it appears on this page. */
    .t-measured { color: var(--navy); border-color: currentColor; }
    .t-area { color: var(--ink-3); border-style: dashed; }
    .kind { font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
            color: var(--ink-3); margin: 18px 0 6px; display: flex; gap: 8px;
            align-items: baseline; }
    .kind b { color: var(--ink); font-size: 12px; letter-spacing: 0;
              text-transform: none; font-weight: 600; }
    /* The sentence under a group heading. Full width on its own line rather
       than another flex child, or it competes with the count for space and
       wraps at the first comma. */
    .kind-why { font-size: 12px; color: var(--ink-2); line-height: 1.5;
                margin: -2px 0 8px; max-width: 76ch; }
    .where { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 12px; color: var(--ink-2); }

    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                  font-size: 12.5px; }
    ul.files { margin: 5px 0 0; padding-left: 18px; }
    ul.files li { margin: 2px 0; }
    .why { color: var(--ink-3); font-size: 11.5px; }
    .ev { border-left: 2px solid var(--rule); padding: 3px 0 3px 10px; margin: 6px 0; }
    .muted { color: var(--ink-2); }
    .empty { padding: 44px; text-align: center; color: var(--ink-3);
             background: var(--surface); border: 1px solid var(--rule);
             border-radius: 8px; }
    .note { background: var(--surface); border: 1px solid var(--rule);
            border-left: 3px solid var(--amber); border-radius: 6px;
            padding: 10px 13px; margin-bottom: 14px; font-size: 12.5px;
            color: var(--ink-2); }
    h3 { margin: 15px 0 5px; font-size: 11px; letter-spacing: .07em;
         text-transform: uppercase; color: var(--ink-3); }
  </style>
</head>
<body>
<div class="shell">
<nav class="rail" aria-label="Sections">

  <button type="button" class="theme-toggle" data-theme-toggle><svg viewBox="0 0 24 24"></svg></button>
  <a href="/programs"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Program</span></a>

  <a href="/agent"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 20h8"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/><path d="M9 14h6"/></svg><span>Agent</span></a>
