<main>
<div class="wrap">
  <!-- The one page in the rail with no app bar of its own, which meant it was
       also the one page with nowhere for the signed-in avatar to sit. Same
       shape as /jira's, so the heading row is one thing across the product
       rather than ten. `.appbar h1` in shell.css already zeroes the heading's
       own margin and sets its size, so nothing is needed here. -->
  <div class="appbar">
    <h1>Traceability</h1>
  </div>
  <!-- What the page is for, in the reader's terms. The run path and the
       symbol and file counts used to be this line; they are facts about
       the pipeline, not about the delivery, so they moved into the tooltip
       and into the Files Scanned tile where a number belongs. -->
  <div class="sub" id="sub">Checks reported progress against the project&rsquo;s
    code and documents.</div>

  <!-- Which project this page shows. Same rule as /gantt, and deliberately
       the same localStorage key: picking a project here and then clicking
       Schedule or Insight must not show two different projects. -->
  <div class="bar" style="margin-bottom:16px">
    <label for="project" class="lbl" style="align-self:center">Project</label>
    <select id="project"></select>
    <span class="muted" id="runinfo"></span>
    <!-- Two buttons, because they answer different questions. "New trace" is
         "what does this code say about this backlog?" and starts the analysis
         over; "Sync" is "what changed since I last looked?" and updates the
         run this project already has. One button doing both would have to
         pick for you, and the two are not interchangeable: a sync against
         nothing is a first run wearing the wrong label.

         Sync stays disabled until the project has a run - see `paintRunInfo`.
         New trace is the primary of the two only when there is no run yet. -->
    <button type="button" class="run" id="run-new" style="margin-left:auto"
            disabled>New trace</button>
    <button type="button" class="run secondary" id="run-sync"
            disabled>Sync</button>
    <span class="run-state" id="run-state"></span>
  </div>
  <div id="run-detail"></div>

  <div id="gaps"></div>
  <div id="mix"></div>
  <div class="tiles" id="tiles"></div>

  <nav class="subtabs" id="subtabs">
    <button type="button" data-view="findings" aria-current="page">Priority Issues</button>
    <button type="button" data-view="tickets">Tickets</button>
    <button type="button" data-view="code">Code</button>
    <button type="button" data-view="shadow">Untracked Code</button>
    <button type="button" data-view="delivery">Delivery</button>
    <button type="button" data-view="backlog">Backlog</button>
  </nav>

  <div id="chips"></div>

  <div id="main"><div class="empty">Loading&hellip;</div></div>
</div>
</main>
</div>

<script>
(function () {
  "use strict";

  var D = null, view = "findings", q = "", fVerdict = "", fStatus = "",
      fSort = "", focusKind = "";

  /* The filter state lives in the URL.

     Two things needed this. A link from the Insight page has to be able to
     say "open Traceability showing the 95 that need review" - the count on
     that page is now a door, and a door needs an address. And a reader who
     has narrowed this list to something worth discussing has to be able to
     send it: before this, copying the address bar sent a colleague the
     unfiltered page and the sentence "scroll down and pick unverified".

     `view`, `verdict` and `status` are read before the first render and
     written back on every change, alongside the `project` the picker
     already kept there. The search box deliberately stays out of it: it
     changes on every keystroke, and a history entry per character is not
     navigation. */
  var STATE_KEYS = ["view", "verdict", "status", "focus"];
  var VIEWS = ["findings", "tickets", "code", "shadow", "delivery", "backlog"];

  function readUrl() {
    var params = new URLSearchParams(location.search);
    var wanted = params.get("view");
    if (wanted && VIEWS.indexOf(wanted) !== -1) view = wanted;
    fVerdict = params.get("verdict") || "";
    fStatus = params.get("status") || "";
    focusKind = params.get("focus") || "";
  }

  /* `push` for something the reader did, so Back undoes it; `replace` for
     state the page derived for itself, which should not become a step in
     anybody's history. */
  function writeUrl(push) {
    var params = new URLSearchParams(location.search);
    var values = { view: view, verdict: fVerdict, status: fStatus,
                   focus: focusKind };
    STATE_KEYS.forEach(function (k) {
      if (values[k]) params.set(k, values[k]);
      else params.delete(k);
    });
    var url = location.pathname + "?" + params.toString();
    if (push) history.pushState(null, "", url);
    else history.replaceState(null, "", url);
  }

  /* The address of this page in a given state, for a link on it. */
  function filterHref(over) {
    var params = new URLSearchParams(location.search);
    STATE_KEYS.forEach(function (k) { params.delete(k); });
    Object.keys(over).forEach(function (k) {
      if (over[k]) params.set(k, over[k]);
    });
    return location.pathname + "?" + params.toString();
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* Every figure in this product reads the same way, so the word for a
     verdict has to be the same on Insight, here, and in the Word export.
     The keys are the pipeline's and never change; only these labels do. */
  var VERDICT_WORD = {
    corroborated: "Confirmed",
    unverified: "Need Review",
    contradicted: "Conflicts",
    conflict: "Status Concerns",
    none: "Not Analysed"
  };
  var VERDICT_TONE = {
    corroborated: "good", unverified: "unknown",
    contradicted: "bad", conflict: "warn", none: "unknown"
  };

  /* Counts up to its value on first paint, and animates the *change* on
     every later one - so a figure that moves when you switch project reads
     as having moved rather than as a different page. Skipped entirely when
     the reader has asked their OS for less motion; the element already
     holds the answer, so skipping costs nothing. */
  function countTo(el, value) {
    var target = Number(value);
    if (!isFinite(target) || reducedMotion()) { el.textContent = value; return; }
    var from = Number(String(el.dataset.at || 0)) || 0;
    el.dataset.at = target;
    var began = 0;
    function frame(now) {
      if (!began) began = now;
      var t = Math.min(1, (now - began) / 760);
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = String(Math.round(from + (target - from) * eased));
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function reducedMotion() {
    try {
      return window.matchMedia &&
        matchMedia("(prefers-reduced-motion: reduce)").matches;
    } catch (e) { return false; }
  }

  /* The four verdicts as one bar over the set they divide.

     Each segment and each legend entry is a link that pre-filters this
     page's own ticket list - which is the same contract the Insight page's
     Delivery Verification numbers now have, and it is served by the same
     URL parameters, so the two cannot disagree about what "Need Review"
     selects. */
  function mix() {
    var t = D.totals;
    var whole = t.tickets || 1;
    var parts = [
      ["corroborated", t.corroborated],
      ["unverified", t.unverified],
      ["contradicted", t.contradicted],
      ["conflict", t.conflicts]
    ].filter(function (kv) { return kv[1] > 0; });

    var bar = parts.map(function (kv) {
      return '<span class="f-' + VERDICT_TONE[kv[0]] + '" style="width:' +
        ((kv[1] / whole) * 100).toFixed(2) + '%" title="' +
        esc(VERDICT_WORD[kv[0]]) + ": " + kv[1] + " of " + whole + '"></span>';
    }).join("");

    var legend = parts.map(function (kv) {
      return '<a href="' + esc(filterHref({ view: "tickets", verdict: kv[0] })) +
        '" title="Open these work items"><i class="f-' + VERDICT_TONE[kv[0]] +
        '"></i><b class="c-' + VERDICT_TONE[kv[0]] + '">' + kv[1] +
        "</b><em>" + esc(VERDICT_WORD[kv[0]]) + "</em></a>";
    }).join("");

    document.getElementById("mix").innerHTML =
      '<div class="mix rise"><div class="mix-head"><h2>Delivery Verification</h2>' +
      '<span class="muted">' + t.adjudicated + " of " + t.tickets +
      " work items were eligible for code verification.</span></div>" +
      '<div class="mix-bar' + (reducedMotion() ? "" : " grow-x") +
      '" role="img" aria-label="' +
      esc(parts.map(function (kv) {
        return kv[1] + " " + VERDICT_WORD[kv[0]];
      }).join(", ")) + '">' + bar + "</div>" +
      '<div class="mix-legend' + (reducedMotion() ? "" : " stagger") + '">' +
      legend + "</div></div>";
  }

  function tiles() {
    var t = D.totals, c = D.corpus;
    /* Renamed, not recomputed. "SYMBOLS/FILES" and "RUN COST" described the
       pipeline; "Files Scanned" and "Analysis Cost" describe the same two
       numbers to the person paying for them. The four verdict counts left
       this row entirely - they are the bar above, where they can be
       compared against each other and against the whole. */
    var items = [
      ["work items", t.tickets, "Rows this run read out of the export"],
      ["analysed", t.adjudicated, "Work items a verdict was reached on"],
      ["with candidates", t.with_candidates,
       "Work items the matcher proposed at least one file for"],
      ["files scanned", c ? c.files : "\u2014",
       c ? (c.symbols + " symbols across " + c.files + " files, via " +
            c.analyzer) : "No code corpus was read for this run"],
      ["citations checked",
       D.has_grounding ? (t.grounded + "/" + t.corroborated) : "\u2014",
       "Confirmed work items whose cited files and functions were looked up " +
       "in the source and found"],
      ["inferred links", (D.links || []).length,
       "Relationships between work items that the code implies and the " +
       "tracker never recorded"],
      ["analysis cost", "$" + t.cost, "What this run cost to produce"]
    ];
    document.getElementById("tiles").innerHTML =
      '<div class="tiles' + (reducedMotion() ? "" : " stagger") + '">' +
      items.map(function (kv) {
        var numeric = typeof kv[1] === "number";
        return '<div class="tile lift" title="' + esc(kv[2]) + '"><b' +
          (numeric ? ' data-count="' + kv[1] + '"' : "") + ">" +
          esc(kv[1]) + '</b><div class="lbl">' + esc(kv[0]) + "</div></div>";
      }).join("") + "</div>";
    Array.prototype.forEach.call(
      document.querySelectorAll("#tiles b[data-count]"), function (b) {
        countTo(b, Number(b.dataset.count));
      });

    document.getElementById("runinfo").title = D.run;
    document.getElementById("gaps").innerHTML =
      (D.gaps.length
        ? '<div class="note"><b>Not produced yet.</b> ' +
          D.gaps.map(esc).join("<br>") + "</div>"
        : "") + sourceNotes();
  }

  /* What the source export can and cannot support.

     Collapsed, and rewritten. The old version opened with "173 rows, 4 of
     31 columns carry anything" and then printed the diagnostic's own
     sentences - which are written for whoever runs the pipeline. A PM needs
     one line per point saying what it means for what they are reading, and
     needs it out of the way until they want it.

     The mapping below is by finding code where there is one, so a new
     diagnostic finding still shows up (in its own words) rather than
     silently vanishing because nobody added a translation for it. */
  var NOTE_WORDS = {
    "no-dependencies":
      "Dependencies aren\u2019t recorded in this export, so any links " +
      "between items are inferred.",
    "raw-dates":
      "Some dates in Description are raw spreadsheet numbers and can\u2019t " +
      "be read as dates.",
    "no-assignee":
      "There is no assignee column, so ownership is read out of the " +
      "description text and may be incomplete.",
    "unkeyed-rows":
      "Most work items carry no tracker key, so they are identified by " +
      "their row in the sheet."
  };

  function noteWords(f) {
    if (NOTE_WORDS[f.code]) return NOTE_WORDS[f.code];
    var d = String(f.detail || "");
    // The diagnostic words this one as "every relationship field is empty
    // (Epic Link, Epic Name, Linked Issues, Parent Link)". What that means
    // for a reader is that nothing here states a dependency.
    if (/depend|relationship|epic link|linked issue|parent link/i.test(d)) {
      return NOTE_WORDS["no-dependencies"];
    }
    if (/date/i.test(d) && /(serial|raw|number)/i.test(d)) {
      return NOTE_WORDS["raw-dates"];
    }
    if (/assignee/i.test(d)) return NOTE_WORDS["no-assignee"];
    return d;
  }

  function sourceNotes() {
    var d = D.diagnosis || {};
    var findings = (d.findings || []).filter(function (f) {
      return f.level === "blocker" || f.level === "warning";
    });
    if (!findings.length) return "";
    return '<details class="notes"><summary>Data notes (' + findings.length +
      ")</summary>" +
      findings.map(function (f) {
        return '<p class="note-line lv-' + esc(f.level) + '">' +
          esc(noteWords(f)) + "</p>";
      }).join("") +
      '<p class="note-line" style="border-left-color:var(--rule)">' +
      "This export has " + d.rows + " rows; " + (d.populated || []).length +
      " of its " + d.columns + " columns carry anything.</p></details>";
  }

  /* How to find this ticket again in the source.

     The tracker key first when there is one. In this export there is not:
     the 173 feature rows are unkeyed sub-rows, which is itself the finding,
     so the locator that always works is where the row physically sits in
     the sheet. `T0032` is ours and stable within a run - enough to name a
     ticket in a conversation - but it means nothing outside this tool, so
     it is shown last and dimmed. */
  function locator(r) {
    var bits = [];
    if (r.key) bits.push('<span class="tag">' + esc(r.key) + "</span>");
    if (r.source_row) {
      bits.push('<span class="tag" title="Row ' + r.source_row +
        " of the exported sheet" + (r.source_sheet ? " ‘" +
        esc(r.source_sheet) + "’" : "") + '">' +
        (r.source_sheet ? esc(r.source_sheet) + "!" : "") +
        "row " + r.source_row + "</span>");
    }
    if (!r.key && r.parent) {
      bits.push('<span class="why" title="This row carries no key of its own; ' +
        'it sits under this issue">under ' + esc(r.parent) + "</span>");
    }
    bits.push('<span class="why">' + esc(r.uid) + "</span>");

    /* People and dates the export inlined into its description field. Shown
       beside the locator because that is what they are: the only record of
       who owns this and when it arrived, and they exist nowhere the tracker
       can filter on. */
    var inline = r.inline || {};
    Object.keys(inline).forEach(function (k) {
      if (/\(date\)$/.test(k)) return;               // shown via its label
      var v = inline[k];
      var decoded = inline[k + " (date)"];
      bits.push('<span class="why" title="From the description text, not a ' +
        'tracker field">' + esc(k) + ": " + esc(decoded || v) +
        (decoded ? " (raw " + esc(v) + ")" : "") + "</span>");
    });
    return bits.join(" ");
  }

  /* Whether the names a verdict cited are actually in the files it named.

     This is the only claim on the page that was checked rather than
     produced: no model, no network, just the source. It is shown next to
     the verdict precisely because the verdict is the part that cannot be
     checked — a reader deserves to see which of the two they are looking
     at. Silent when `verify` has not been run, rather than implying a
     clean result nobody established. */
  function groundTag(r) {
    var g = r.grounding;
    if (!g || g.status === "uncited") return "";
    if (g.status === "grounded") {
      var n = (g.checks || []).length;
      return '<span class="tag t-corroborated" title="All ' + n +
        " cited name(s) were found in the files named. Checked against the " +
        'source, not asserted by the model.">\u2713 cited names verified</span>';
    }
    return '<span class="tag t-contradicted" title="A name this verdict ' +
      'cites is not in the file it names.">citation not found</span>';
  }

  function groundNote(r) {
    var g = r.grounding;
    if (!g || !g.checks || !g.checks.length) return "";
    var ok = g.checks.filter(function (c) {
      return c.status === "defined" || c.status === "present";
    }).length;
    return ' <span class="why">\u2014 ' + ok + " of " + g.checks.length +
      " checked against the source</span>";
  }

  /* Per-citation, because a verdict can be right about one file and wrong
     about another, and "partly grounded" at the card level does not say
     which. `present` is not a fault: the name is in the file but not as a
     definition, which usually means a call site. */
  function citeMark(r, e) {
    var g = r.grounding;
    if (!g || !g.checks) return "";
    var file = String(e.file || "").split("\\").join("/");
    var hits = g.checks.filter(function (c) { return c.file === file; });
    if (!hits.length) return "";
    var worst = hits.some(function (c) { return c.status === "absent"; }) ? "absent"
      : hits.some(function (c) { return c.status === "no-file"; }) ? "no-file"
      : hits.some(function (c) { return c.status === "present"; }) ? "present"
      : hits.some(function (c) { return c.status === "defined"; }) ? "defined"
      : "";
    var line = (hits.find(function (c) { return c.line; }) || {}).line;
    if (worst === "defined") {
      return ' <span class="why" title="Found as a definition in this file">' +
        "\u2713 defined" + (line ? " line " + line : "") + "</span>";
    }
    if (worst === "present") {
      return ' <span class="why" title="The name is in the file but not as a ' +
        'definition \u2014 probably a call site">\u25cb present' +
        (line ? " line " + line : "") + "</span>";
    }
    if (worst === "absent" || worst === "no-file") {
      return ' <span class="tag t-contradicted" title="This name is not in ' +
        'that file">not found</span>';
    }
    return "";
  }

  /* The reader's word, the pipeline's class. `t-corroborated` still keys
     the colour, because that is what the stylesheet and every other tag on
     this page agree on; what changed is only the word inside it. */
  function verdictTag(v) {
    if (!v) return '<span class="tag">not analysed</span>';
    return '<span class="tag t-' + v.verdict + '" title="' +
           esc(v.verdict) + '">' + esc(VERDICT_WORD[v.verdict] || v.verdict) +
           " · " + esc(v.confidence) + "</span>";
  }

  function ticketCard(r, open) {
    var v = r.verdict, h = "";
    h += '<p style="margin:0 0 8px">' + locator(r) + "</p>";
    /* The tracker's own words stay the headline; the English is shown under
       them and labelled. Showing only the translation would mean a reader
       searching Jira for the text on this page would find nothing. */
    if (r.summary_en && r.summary_en !== r.summary) {
      h += '<p style="margin:0 0 6px"><b>' + esc(r.summary_en) + "</b> " +
        '<span class="tag" title="Machine translation, used for matching. ' +
        'The original above is what the tracker says.">translated from ' +
        esc(r.lang) + "</span></p>";
    }
    if (r.description) h += '<p class="muted">' + esc(r.description) + "</p>";
    if (r.description_en && r.description_en !== r.description) {
      h += '<p class="muted">' + esc(r.description_en) + "</p>";
    }
    if (v) h += "<h3>Reasoning</h3><p>" + esc(v.reasoning) + "</p>";
    if (v && v.evidence && v.evidence.length) {
      h += "<h3>Cited evidence" + groundNote(r) + "</h3>" +
        v.evidence.map(function (e) {
          return '<div class="ev"><code>' + esc(e.file) +
                 (e.symbol ? "::" + esc(e.symbol) : "") + "</code>" +
                 citeMark(r, e) + "<div class=\"muted\">" +
                 esc(e.why) + "</div></div>";
        }).join("");
    }
    /* Relationships nobody recorded. Always labelled as inferred, always
       with the file or import that produced them, so a reader can reject a
       bad one instead of having to trust the whole set. */
    if (r.related && r.related.length) {
      var titles = {};
      (D.tickets || []).forEach(function (x) { titles[x.uid] = x; });
      h += "<h3>Related work (inferred from the code, not the tracker)</h3>" +
        '<ul class="files">' + r.related.slice(0, 8).map(function (rel) {
          var other = titles[rel.other];
          var phrase = rel.kind === "depends-on"
            ? (rel.direction === "to" ? "depends on" : "is depended on by")
            : "shares code with";
          return "<li>" + esc(phrase) + " <b>" +
            esc(other ? other.summary : rel.other) + "</b>" +
            (other && other.source_row
              ? ' <span class="why">row ' + other.source_row + "</span>" : "") +
            ' <span class="tag">' + esc(rel.confidence) + "</span>" +
            '<div class="why">via ' + esc(rel.via.slice(0, 2).join(", ")) +
            "</div></li>";
        }).join("") + "</ul>";
    }

    if (r.candidates.length) {
      h += "<h3>Candidate files</h3><ul class=\"files mono\">" +
        r.candidates.map(function (p) {
          return "<li>" + esc(p) + ' <span class="why">' +
                 esc((r.why[p] || []).join(", ")) + "</span></li>";
        }).join("") + "</ul>";
    } else {
      h += '<p class="muted">The retriever proposed nothing for this ticket, so a ' +
           "verdict here would be a guess.</p>";
    }
    return "<details class=\"card\"" + (open ? " open" : "") + "><summary>" +
      (v && v.status_conflict
        ? '<span class="tag t-conflict" title="The code looks finished and ' +
          'the tracker still has this open">Status Concern</span>' : "") +
      '<span class="tag" title="' +
        (r.key ? "Tracker key" : "No tracker key — row position in the export") +
        '">' + esc(r.key || ("row " + (r.source_row || "?"))) + "</span>" +
      '<span class="tag">' + esc(r.status || "—") + "</span>" +
      '<span class="sum">' + esc(r.summary) + "</span>" +
      (r.head_collision ? '<span class="tag">shared head</span>' : "") +
      groundTag(r) +
      (r.related && r.related.length
        ? '<span class="tag" title="Inferred from the code, not recorded in ' +
          'the tracker">' + r.related.length + " related</span>" : "") +
      verdictTag(v) + "</summary><div class=\"body\">" + h + "</div></details>";
  }

  // The tracker is not the only record of what a team did. Here the backlog
  // holds 173 feature tickets and knows nothing about the ten-EPIC refactor
  // the same project documents in 63 dated tasks, so a page that reads only
  // the tracker is showing half the delivery.
  // Five honest views and no answer to "what do I look at first". Each
  // finding keeps where to look and how strong the evidence is, because the
  // strengths genuinely differ and flattening them is the one thing this
  // pipeline keeps refusing to do.
  /* The ten categories, titled and explained.

     The list itself now comes from the server (`labels` on
     `/api/traceability`, built from `app/tracelabels.py`), because the Word
     export prints the same ten headings and the two had already drifted -
     the report called one of them "A verdict resting on something that is
     not there" while this page called it "The reason given points at
     nothing", and a reader holding both had no way to know they were the
     same category. What is left here is a fallback for a server that
     predates that, kept deliberately short.

     The sentence under each title says what it means for delivery and what
     to do about it, in that order. The method - which model read what, and
     how strong that makes it - is on each row's own tag, where a reader who
     wants it can find it without everyone else having to read past it. */
  var FALLBACK_LABELS = {
    "contradicted": ["Code Contradicts Ticket",
      "The code does something different from what the ticket claims; check " +
      "with the developer and correct whichever one is wrong."],
    "status-conflict": ["Built But Still Open",
      "The code for this looks finished while the ticket is still open; " +
      "confirm with the team and update the tracker."],
    "gate-failing": ["Team Quality Checks Failing",
      "A rule this team wrote for itself is broken in the code; assign a fix " +
      "before the next release."],
    "acceptance-unanswered": ["Acceptance Not Signed Off",
      "The sign-off form on these tickets is still blank; chase the reviewer " +
      "before anyone calls them done."],
    "process-undelegated": ["Process Tasks Not Assigned",
      "The written procedure names roles nobody has been given; hand the " +
      "steps out or this work has no owner."],
    "roles-concentrated": ["One Person Holds Every Role",
      "The same person requests, specifies and builds nearly every item; add " +
      "a second reviewer before this becomes a single point of failure."],
    "missing-test": ["Promised Tests Missing",
      "A task marked finished says it wrote a test that is not in the code; " +
      "ask for the test or reopen the task."],
    "documented-not-built": ["Marked Done, No Code Found",
      "The documents call this done and no matching code exists; check " +
      "whether the code you have is older than the documents first."],
    "unsupported-citation": ["Unsupported AI Verdicts",
      "The reason given for this verdict points at a file or function that " +
      "is not there; treat the item as unjudged and review it by hand."],
    "unclaimed-code": ["Code Without a Ticket",
      "Code in the repository that no backlog item accounts for; raise a " +
      "ticket for it or confirm it is out of scope."]
  };

  function findingLabel(kind, part) {
    var served = (D && D.labels && D.labels[kind]) || null;
    if (served && served[part]) return served[part];
    var pair = FALLBACK_LABELS[kind];
    if (!pair) return part === "title" ? kind : "";
    return part === "title" ? pair[0] : pair[1];
  }

  /* Written for whoever opens this page, which is usually not the person
     who built the pipeline. Each line says how the finding was arrived at
     and how much to trust it, in words that need no knowledge of how any
     of this works. "Arithmetic over the corpus" told a reader nothing. */
  var EVIDENCE_NOTE = {
    "measured": "Counted directly from the code. No AI involved — you can " +
      "re-run this and get the same answer. Strongest evidence here.",
    "cited": "An AI read the code and said so, and we then checked every " +
      "file and function it pointed at. They all exist.",
    "partly-grounded": "An AI read the code and said so. Some of what it " +
      "pointed at was checked, some was not.",
    "ungrounded": "An AI said so, but at least one file or function it " +
      "pointed at is not in the code. Treat with suspicion.",
    "uncited": "An AI said so and pointed at nothing in particular. Weakest " +
      "evidence here.",
    "direct": "This task named a file, and we found tickets that touch that " +
      "exact file. A solid match.",
    "area": "We could not match this task to a file, so we matched it to the " +
      "area it sits in. It tells you about the area, not this task.",
    "failed check": "Something was claimed to be in the code, we looked, and " +
      "it is not there."
  };

  function renderFindings(el) {
    var f = D.findings || [];
    if (!f.length) {
      el.innerHTML = '<div class="empty">Nothing needs a person in this run. ' +
        "That is either good news or a pipeline that has not finished — " +
        "check the notes above.</div>";
      return;
    }

    // Worst-founded last within a kind is already the server's order; the
    // tag says which, because the strengths genuinely differ.
    var TAG = {
      "measured": "t-measured", "cited": "t-corroborated",
      "failed check": "t-contradicted", "area": "t-area",
      "direct": "t-measured", "ungrounded": "t-contradicted",
      "partly-grounded": "t-unverified", "uncited": "t-unverified"
    };

    var h = '<p class="kind-why" style="margin:0 0 14px" title="Impact is ' +
      "what it costs to be wrong; strength of evidence is how the finding " +
      "was established, so a deterministic check outranks a model verdict " +
      'and volume earns nothing.">Ordered by impact and strength of ' +
      "evidence. Each item says where to look.</p>";

    var kind = null;
    f.forEach(function (x) {
      if (x.kind !== kind) {
        kind = x.kind;
        var n = f.filter(function (y) { return y.kind === kind; }).length;
        // `data-kind` is the anchor the Insight page links to - see
        // `focus` in the URL state above.
        h += '<div class="kind" data-kind="' + esc(kind) + '"><b>' +
          esc(findingLabel(kind, "title")) + "</b><span>" + n + "</span></div>" +
          '<p class="kind-why" data-why="' + esc(kind) + '">' +
          esc(findingLabel(kind, "why")) + "</p>";
      }
      h += '<details class="card"><summary>' +
        '<span class="tag ' + (TAG[x.evidence] || "") + '" title="' +
        esc(EVIDENCE_NOTE[x.evidence] || "") + '">' +
        esc(x.evidence) + "</span>" +
        '<span class="sum">' + esc(x.title) + "</span>" +
        (x.confidence ? '<span class="tag">' + esc(x.confidence) + "</span>" : "") +
        '</summary><div class="body">' +
        "<p>" + esc(x.detail) + "</p>" +
        (x.where ? '<p class="where">' + esc(x.where) + "</p>" : "") +
        '<p class="why">evidence: ' + esc(EVIDENCE_NOTE[x.evidence] || x.evidence) +
        (x.command ? " · the document runs <code>" + esc(x.command) + "</code>" : "") +
        (x.signed_off ? " · signed off in the document, and failing" : "") +
        "</p></div></details>";
    });
    el.innerHTML = h;
    highlightFocus(el);
  }

  /* A reader who arrived by clicking a number on the Insight page lands on
     a list of ten categories, one of which is the one they asked for.
     Scrolling to it and flashing it once is the whole of the answer to
     "which of these did I click". */
  function highlightFocus(el) {
    if (!focusKind) return;
    var head = el.querySelector('[data-kind="' + focusKind + '"]');
    if (!head) return;
    head.scrollIntoView({
      behavior: reducedMotion() ? "auto" : "smooth", block: "start"
    });
    head.classList.add("kind-focus");
    var why = el.querySelector('[data-why="' + focusKind + '"]');
    if (why) why.classList.add("kind-focus");
  }

  /* Is this one backlog, or several appended into one sheet?

     A single corroboration rate assumes every row means the same kind of
     thing. Here 149 rows carry a fix version and corroborate at 50%, and
     24 rows at the end of the sheet carry none and corroborate at 4% -
     because they are a roadmap, not a record. Pooling them produces one
     number that describes neither, and reads as a retrieval failure where
     it is a difference in what the rows are.

     The process tickets below are the third population: work that is real
     and tracked, whose deliverables live in systems this pipeline cannot
     read. The block leads with what cannot be checked, because that is
     the honest finding and the tempting alternative - grep the docs tree,
     report what is absent - would be wrong on every row. */
  function renderBacklog(el) {
    var c = D.cohorts || {};
    var g = D.governance || {};
    var cohorts = c.cohorts || [];
    var tasks = g.tasks || [];

    if (!cohorts.length && !tasks.length) {
      el.innerHTML = '<div class="empty">Neither reading has been run yet. ' +
        "Run: <code>tracelink cohorts</code> and " +
        "<code>tracelink governance &lt;export.xlsx&gt;</code></div>";
      return;
    }

    var h = "";
    if (cohorts.length) {
      var seam = c.seam || {};
      h += "<h3>Cohorts</h3>";
      h += '<div class="note"><b>Seam: ' + esc(seam.field || "") + "</b> — " +
        seam.groups + " values in " + seam.runs + " contiguous runs. " +
        "A field whose values block up this way records <i>when rows were " +
        "written</i>, not what the work is.</div>";

      var rates = [];
      cohorts.forEach(function (co) {
        var v = co.verdicts || {};
        var pct = co.corroboration === null || co.corroboration === undefined
          ? null : Math.round(co.corroboration * 100);
        if (pct !== null) rates.push(pct);
        var langs = Object.keys(co.lang || {}).map(function (k) {
          return esc(k) + " " + co.lang[k];
        }).join(", ");
        var stat = Object.keys(co.status || {}).sort(function (a, b) {
          return co.status[b] - co.status[a];
        }).slice(0, 3).map(function (k) {
          return esc(k) + " " + co.status[k];
        }).join(", ");
        h += '<details class="card" open><summary>' +
          '<span class="tag">' + co.n + " tickets</span>" +
          '<span class="sum">' + esc(co.label) + "</span>" +
          (pct === null ? "" : '<span class="tag ' +
            (pct < 20 ? "t-contradicted" : "") + '">' + pct +
            "% corroborated</span>") +
          "</summary><div class=\"body\">" +
          (co.span ? "<div>rows " + co.span[0] + "&ndash;" + co.span[1] +
            "</div>" : "") +
          "<div>status: " + stat + "</div>" +
          (langs ? "<div>language: " + langs + "</div>" : "") +
          "</div></details>";
      });

      if (rates.length > 1) {
        var lo = Math.min.apply(null, rates), hi = Math.max.apply(null, rates);
        h += '<div class="note"><b>Why one number will not do</b> — the ' +
          "cohorts run " + lo + "% to " + hi + "%. A pooled figure describes " +
          "neither, and reads as a retrieval failure where it is a difference " +
          "in what the rows are.</div>";
      }
    }

    if (tasks.length) {
      var counts = g.counts || {};
      var checkable = g.checkable || 0;

      /* The checklist first. The verdicts below say what may be *claimed*;
         these say what to do, and they are the only part of this export a
         PM can act on this morning. */
      if (g.n_steps) {
        h += "<h3>Process checklist</h3>";
        var del = g.delegation || {};
        if (del.single_assignee) {
          var who = Object.keys(del.assignees || {})[0] || "one person";
          h += '<div class="note"><b>' + tasks.length + " process tickets, " +
            g.n_steps + " steps, all assigned to " + esc(who) + ".</b> " +
            "The procedures name " + (del.roles_named || []).length +
            " different roles. The checklist exists and has not been " +
            "handed out.</div>";
        }
        (g.commitments || []).length && (h +=
          '<div class="note"><b>Steps with a deadline</b> — ' +
          g.commitments.map(function (c) {
            return esc(c.key) + " step " + c.n + " within " + esc(c.sla) +
              " (" + esc(c.owner || "unassigned") + ")";
          }).join("; ") + ". No start event is recorded against these " +
          "tickets, so nothing here can say whether one was met.</div>");

        tasks.forEach(function (t) {
          if (!(t.steps || []).length) return;
          h += '<details class="card"><summary>' +
            '<span class="tag">' + t.steps.length + " steps</span>" +
            '<span class="sum">' + esc(t.key || "") + " " +
            esc(t.summary || "") + "</span>" +
            (t.assignee ? '<span class="tag">' + esc(t.assignee) + "</span>" : "") +
            "</summary><div class=\"body\">";
          t.steps.forEach(function (st) {
            h += "<div><b>" + st.n + ".</b> " +
              '<span class="tag">' + esc(st.owner || "unassigned") + "</span> " +
              esc(st.text) +
              (st.sla ? ' <span class="tag t-conflict">within ' +
                esc(st.sla) + "</span>" : "") +
              (st.contacts || []).map(function (c) {
                return "<br><small>send to: " + esc(c) + "</small>";
              }).join("") +
              "</div>";
          });
          h += "</div></details>";
        });
      }

      h += "<h3>What can be checked</h3>";
      if (!checkable) {
        h += '<div class="note"><b>0 of ' + tasks.length + " can support a " +
          "finding about a missing deliverable.</b> Every one is either still " +
          "open — so its deliverable is owed, not overdue — or names a system " +
          "this pipeline cannot read. That is the finding: grepping the docs " +
          "tree for these names and reporting what is absent would be wrong " +
          "on every row.</div>";
      } else {
        h += '<div class="note">' + checkable + " of " + tasks.length +
          " are claimed done and name something to look for.</div>";
      }

      var held = {};
      tasks.forEach(function (t) {
        (t.systems || []).forEach(function (sys) {
          held[sys] = (held[sys] || 0) + 1;
        });
      });
      var names = Object.keys(held);
      if (names.length) {
        h += '<div class="note"><b>To verify these at all you need access to:' +
          "</b> " + names.sort(function (a, b) { return held[b] - held[a]; })
            .map(function (k) {
              return esc(k) + " (" + held[k] + ")";
            }).join(", ") + "</div>";
      }

      tasks.forEach(function (t) {
        var open = t.verdict === "not-claimed-done";
        h += '<details class="card"><summary>' +
          '<span class="tag ' + (open ? "" : "t-conflict") + '">' +
          esc(t.verdict) + "</span>" +
          '<span class="sum">' + esc(t.key || "") + " " +
          esc(t.summary || "") + "</span></summary><div class=\"body\">" +
          "<div>" + esc(t.why || "") + "</div>" +
          ((t.deliverables || []).length
            ? "<div>names: " + esc(t.deliverables.slice(0, 5).join(", ")) +
              "</div>" : "") +
          ((t.systems || []).length
            ? "<div>evidence lives in: " + esc(t.systems.join(", ")) +
              "</div>" : "") +
          "</div></details>";
      });
    }
    el.innerHTML = h;
  }

  function renderDelivery(el) {
    var d = D.delivery || {};
    if (!d.items && !(d.gates || []).length) {
      el.innerHTML = '<div class="empty">This project has no documentation ' +
        "tree read yet. Run: <code>tracelink progress --docs &lt;docs dir&gt;" +
        "</code></div>";
      return;
    }

    var h = '<div class="tiles">' +
      tile(d.items, "tasks the documents record") +
      tile(d.done + " / " + d.open, "done / open") +
      tile(d.timed, "with real start and end times") +
      tile(d.schedule, "plan rows") + "</div>";

    h += "<h3>By group</h3>";
    (d.groups || []).forEach(function (g) {
      var open = g.done === 0 && g.open;
      h += '<details class="card"><summary>' +
        '<span class="tag ' + (open ? "t-contradicted" : "") + '">' +
        g.done + " done · " + g.open + " open</span>" +
        '<span class="sum">' + esc(g.group) + "</span>" +
        (open ? '<span class="tag t-conflict">none started</span>' : "") +
        "</summary></details>";
    });

    // Two blocks, never one. A task joins the tracker directly only when one
    // of its deliverables resolves in the code, so every row whose code is
    // absent is joined at area level - exactly the set a reader cares most
    // about. Together they would read as equally solid.
    var c = d.confidence || {};
    [["direct", "Direct — the task’s own code anchor found these tickets"],
     ["area", "Area-level — joined through the task’s doc section, so " +
      "the tracker column is about this part of the system, not this task"]]
      .forEach(function (pair) {
        var counts = c[pair[0]] || {};
        if (!Object.keys(counts).length) return;
        h += "<h3>" + pair[1] + "</h3><p>";
        Object.keys(counts).forEach(function (k) {
          h += '<span class="tag ' +
            (pair[0] === "area" ? "t-area" : "t-measured") + '">' +
            counts[k] + " " + esc(k) + "</span> ";
        });
        h += "</p>";
      });

    if ((d.gates || []).length) {
      h += "<h3>Gates the documents set</h3>";
      h += '<div class="note">' + d.gates_failing + " failing, " +
        d.gates_unchecked + " not checkable against this repository" +
        (d.gates_contradicting
          ? ", " + d.gates_contradicting + " signed off and failing" : "") +
        ". Criteria are re-implemented over the corpus, not shell-executed — " +
        "the commands name scripts this repository does not contain. A gate " +
        "about a directory that does not exist is <em>unchecked</em>, never a pass." +
        "</div>";
      d.gates.forEach(function (g) {
        h += '<details class="card"><summary><span class="tag ' +
          (g.status === "fail" ? "t-contradicted"
            : g.status === "pass" ? "t-corroborated" : "t-unverified") + '">' +
          esc(g.status) + "</span>" +
          '<span class="sum">' + esc(g.name) + "</span></summary>" +
          '<div class="body"><p>' + esc(g.detail) + "</p>" +
          (g.command ? '<p class="where">' + esc(g.command) + "</p>" : "") +
          "</div></details>";
      });
    }
    el.innerHTML = h;
  }

  // Same markup as the header tiles at the top of the page, so the two rows
  // of numbers cannot drift apart visually.
  function tile(value, label) {
    return '<div class="tile"><b>' + esc(String(value)) +
      '</b><div class="lbl">' + esc(label) + "</div></div>";
  }

  function renderShadow(el) {
    var s = D.shadow || {};
    if (!s.counts) {
      el.innerHTML = '<div class="empty">No shadow pass yet. Run: ' +
        "<code>tracelink shadow --describe</code></div>";
      return;
    }
    var c = s.counts;
    var h = '<div class="tiles">' +
      '<div class="tile lift"><b>' + c.cited + '</b><div class="lbl">accounted for by a work item</div></div>' +
      '<div class="tile lift"><b>' + c.retrieved_only + '</b><div class="lbl">proposed, never relied on</div></div>' +
      '<div class="tile lift"><b>' + c.unclaimed + '</b><div class="lbl">no work item at all</div></div>' +
      "</div>" +
      '<p class="muted" title="A file the matcher proposed is not evidence ' +
      "of anything until a verdict actually rests on it - which is why the " +
      'middle column is neither claimed nor unclaimed.">Of ' +
      c.eligible_files + " files in scope. The middle figure is neither " +
      "side of the question: the matcher put the file forward and no " +
      "verdict ended up resting on it.</p>";

    var desc = s.described;
    if (desc && desc.length) {
      var scope = desc.filter(function (d) { return d.user_facing; }).length;
      h += "<h3>Untracked Code</h3>" +
        '<p class="muted">' + desc.length + " area" +
        (desc.length === 1 ? "" : "s") + " of code no work item accounts " +
        "for; " + scope + " look" + (scope === 1 ? "s" : "") +
        " like delivered scope rather than plumbing. Raise a ticket for " +
        "those or confirm they are out of scope.</p>";
      h += desc.slice().sort(function (a, b) {
        return (b.user_facing ? 1 : 0) - (a.user_facing ? 1 : 0);
      }).map(function (d) {
        return '<details class="card" open><summary>' +
          '<span class="tag ' + (d.user_facing ? "t-scope" : "") + '">' +
          (d.user_facing ? "looks like scope" : "plumbing") + "</span>" +
          '<span class="sum"><code>' + esc(d.directory) + "/</code></span>" +
          '<span class="tag">' + d.n_symbols + " symbols</span>" +
          '<span class="tag">' + esc(d.confidence) + "</span></summary>" +
          '<div class="body"><p>' + esc(d.capability) + "</p>" +
          (d.suggested_ticket
            ? "<p><b>Suggested ticket:</b> " + esc(d.suggested_ticket) + "</p>" : "") +
          '<ul class="files mono">' + d.files.map(function (f) {
            return "<li>" + esc(f) + "</li>";
          }).join("") + "</ul></div></details>";
      }).join("");
    } else {
      h += "<h3>Untracked Code</h3>" +
        '<p class="muted">Areas of code no work item accounts for, largest ' +
        "first. Run <code>tracelink shadow --describe</code> to have each " +
        "one named in plain language.</p>" +
        (s.groups || []).map(function (g) {
          return '<details class="card"><summary><span class="tag">' + g.n_symbols +
            ' symbols</span><span class="sum"><code>' + esc(g.directory) +
            "/</code></span></summary><div class=\"body\"><ul class=\"files mono\">" +
            g.files.map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") +
            "</ul></div></details>";
        }).join("");
    }
    el.innerHTML = h;
  }

  /* Which code each area of the backlog maps to.

     Organised by the tracker's own Component field, not by directory. The
     first version of this view listed 163 file paths with their tickets
     nested underneath, which is accurate and unreadable: a reader arrives
     holding a feature in mind, not a path. Twenty-nine components is a list
     somebody can scan; 163 paths is a list somebody closes.

     The code side is summarised as directories rather than files for the
     same reason, and only *cited* evidence counts toward it - a keyword hit
     that no verdict relied on is not a mapping, and showing it as one would
     overstate how much of this backlog is actually anchored in code. */
  function renderCode(el) {
    var rows = D.tickets || [];
    if (!rows.length) {
      el.innerHTML = '<div class="empty">No tickets in this run.</div>';
      return;
    }

    var needle = q.toLowerCase();
    var groups = {};
    rows.forEach(function (r) {
      var name = r.component || "(no component)";
      var g = groups[name] || (groups[name] = {
        name: name, tickets: [], built: 0, unverified: 0,
        conflicts: 0, notAdjudicated: 0, dirs: {}
      });
      g.tickets.push(r);
      var v = r.verdict;
      if (!v) { g.notAdjudicated += 1; return; }
      if (v.verdict === "corroborated") g.built += 1;
      else if (v.verdict === "unverified") g.unverified += 1;
      if (v.status_conflict) g.conflicts += 1;
      (v.evidence || []).forEach(function (e) {
        var f = String(e.file || "").split("\\").join("/");
        var d = f.indexOf("/") === -1 ? "(root)" : f.slice(0, f.lastIndexOf("/"));
        g.dirs[d] = (g.dirs[d] || 0) + 1;
      });
    });

    var names = Object.keys(groups).filter(function (n) {
      if (!needle) return true;
      if (n.toLowerCase().indexOf(needle) !== -1) return true;
      return groups[n].tickets.some(function (t) {
        return t.summary.toLowerCase().indexOf(needle) !== -1 ||
          t.candidates.join(" ").toLowerCase().indexOf(needle) !== -1;
      });
    }).sort(function (a, b) {
      return groups[b].tickets.length - groups[a].tickets.length ||
             a.localeCompare(b);
    });

    var areaCount = Object.keys(groups).length;
    // "29 of 29 areas" read as a shortfall in a page full of real
    // shortfalls. It is a shortfall only when the search has narrowed it.
    document.getElementById("count").textContent =
      names.length === areaCount
        ? areaCount + " functional areas"
        : names.length + " of " + areaCount + " functional areas";

    var anchored = 0;
    Object.keys(groups).forEach(function (n) {
      if (Object.keys(groups[n].dirs).length) anchored += 1;
    });

    // Plain-language summaries, if `tracelink explain` has been run. Keyed by
    // component so an area with no summary simply shows the counts.
    var said = {};
    (D.explain || []).forEach(function (e) { said[e.component] = e; });

    /* What the reader is looking at, in one sentence, with the rule that
       governs it in the tooltip. The old version led with the rule -
       "count cited evidence only, a keyword match that no verdict relied
       on is not a mapping" - which is the correct rule and is not what
       somebody opening this tab wants first. */
    var html = "<h3>Implementation Coverage</h3>" +
      '<p class="muted" title="Only evidence a verdict actually cited ' +
      "counts toward coverage. A keyword match no verdict relied on is not " +
      'a mapping.">' + areaCount +
      " functional area" + (areaCount === 1 ? "" : "s") +
      " " + (areaCount === 1 ? "was" : "were") +
      " analyzed against available code; " + anchored +
      " ha" + (anchored === 1 ? "s" : "ve") + " code evidence.</p>";
    if (!D.explain || !D.explain.length) {
      html += '<p class="muted">Run <code>tracelink explain</code> to add a ' +
        "plain-language summary to each area.</p>";
    }

    if (!names.length) {
      el.innerHTML = html + '<div class="empty">Nothing matches.</div>';
      return;
    }

    html += names.map(function (n) {
      var g = groups[n];
      var dirs = Object.keys(g.dirs).sort(function (a, b) {
        return g.dirs[b] - g.dirs[a] || a.localeCompare(b);
      });
      var top = dirs.slice(0, 4).map(function (d) {
        return "<code>" + esc(d) + "/</code> " +
          '<span class="why">' + g.dirs[d] + "</span>";
      }).join(" &nbsp; ");

      var head = '<details class="card"><summary>' +
        '<span class="sum">' + esc(n) +
        (said[n] ? ' <span class="why">— ' +
          esc(said[n].headline.split(/[;.]\s/)[0]).slice(0, 96) + "</span>" : "") +
        "</span>" +
        '<span class="tag">' + g.tickets.length + " tickets</span>" +
        (g.built ? '<span class="tag t-corroborated">' + g.built +
          " Confirmed</span>" : "") +
        (g.unverified ? '<span class="tag t-unverified">' + g.unverified +
          " Need Review</span>" : "") +
        (g.conflicts ? '<span class="tag t-conflict">' + g.conflicts +
          " Status Concern" + (g.conflicts === 1 ? "" : "s") + "</span>" : "") +
        "</summary><div class=\"body\">";

      /* The plain-language summary goes first and gets the most room: it is
         the only part of this page a reader who does not know the codebase
         can act on. The counts and paths below it are the audit trail for
         anyone who wants to check it. */
      var e = said[n];
      var body = e
        ? '<p style="font-size:14px;margin:0 0 10px">' + esc(e.headline) + "</p>" +
          '<div style="display:grid;gap:8px;grid-template-columns:1fr 1fr;' +
          'margin-bottom:4px">' +
          '<div><h3 style="margin-top:0">What the code shows</h3><div>' +
          esc(e.what_is_there) + "</div></div>" +
          '<div><h3 style="margin-top:0">What is unclear</h3><div>' +
          esc(e.what_is_unclear) + "</div></div></div>" +
          (e.suggested_action
            ? '<p style="margin:8px 0 0"><b>Next step:</b> ' +
              esc(e.suggested_action) + "</p>" : "") +
          (e.caveat
            ? '<p class="note" style="margin:8px 0 0"><b>Caveat:</b> ' +
              esc(e.caveat) + "</p>" : "")
        : "";

      body += dirs.length
        ? "<h3>Code this area maps to</h3><p>" + top +
          (dirs.length > 4 ? ' <span class="why">+' + (dirs.length - 4) +
            " more</span>" : "") + "</p>"
        : '<p class="muted">No verdict in this area rested on any file, so ' +
          "nothing here is anchored in code yet.</p>";

      body += "<h3>Tickets</h3>";
      body += g.tickets.slice().sort(function (a, b) {
        var av = (a.verdict || {}), bv = (b.verdict || {});
        return (bv.status_conflict ? 1 : 0) - (av.status_conflict ? 1 : 0) ||
               (bv.evidence || []).length - (av.evidence || []).length;
      }).map(function (t) {
        var v = t.verdict;
        var cited = v && v.evidence && v.evidence.length
          ? v.evidence.map(function (e) {
              return "<code>" + esc(e.file) +
                (e.symbol ? "::" + esc(e.symbol) : "") + "</code>";
            }).join(", ")
          : "";
        return '<div style="margin:9px 0">' +
          (v && v.status_conflict
            ? '<span class="tag t-conflict" title="The code looks finished ' +
              'and the tracker still has this open">Status Concern</span> ' : "") +
          '<span class="tag" title="' +
            (t.key ? "Tracker key" : "No tracker key \u2014 row in the export") +
            '">' + esc(t.key || ("row " + (t.source_row || "?"))) + "</span> " +
          '<span class="tag">' + esc(t.status || "\u2014") + "</span> " +
          esc(t.summary) +
          (v ? ' <span class="tag t-' + v.verdict + '" title="' + esc(v.verdict) +
            '">' + esc(VERDICT_WORD[v.verdict] || v.verdict) + "</span>" : "") +
          (cited
            ? '<div class="why" style="padding-left:2px;margin-top:2px">' +
              cited + "</div>"
            : '<div class="why" style="padding-left:2px;margin-top:2px">' +
              (t.candidates.length
                ? "no verdict rested on a file; the matcher proposed " +
                  t.candidates.length + " candidate" +
                  (t.candidates.length === 1 ? "" : "s")
                : "no candidate files were found") + "</div>") +
          "</div>";
      }).join("");

      return head + body + "</div></details>";
    }).join("");

    el.innerHTML = html;
  }

  /* Why this list is shorter than the whole.

     Rendered whenever a filter is set, and set by a link as often as by a
     control now - which is exactly why it has to exist. Arriving from
     Insight on "the 95 that need review" and seeing 95 rows with nothing
     saying why is how a filtered list gets quoted as a total. */
  function renderChips() {
    var host = document.getElementById("chips");
    if (!host) return;
    var active = [];
    if (fVerdict) {
      active.push(VERDICT_WORD[fVerdict] || fVerdict);
    }
    if (fStatus) active.push(fStatus);
    if (!active.length || (view !== "tickets" && view !== "code")) {
      host.innerHTML = "";
      return;
    }
    host.innerHTML =
      '<div class="chip-row fade-in"><span class="chip">Filtered: <b>' +
      esc(active.join(" \u00b7 ")) +
      '</b><button type="button" id="clearf">Clear filter</button></span></div>';
    document.getElementById("clearf").addEventListener("click", function () {
      fVerdict = "";
      fStatus = "";
      var fv = document.getElementById("fv"), fs = document.getElementById("fs");
      if (fv) fv.value = "";
      if (fs) fs.value = "";
      writeUrl(true);
      render();
    });
  }

  /* One settle per render, rather than per card.

     A list of a hundred and seventy-three rows each fading in on its own
     schedule is a page that looks like it is still loading for most of a
     second. Replaying one short fade over the whole list says the same
     thing - this is new content, in answer to what you just clicked - and
     says it once. Re-triggered by removing the class and forcing a reflow,
     because an animation does not restart just because the element's
     children changed. */
  function settle(el) {
    if (reducedMotion()) return;
    el.classList.remove("fade-in");
    void el.offsetWidth;
    el.classList.add("fade-in");
  }

  function render() {
    var el = document.getElementById("main");
    renderChips();
    Array.prototype.forEach.call(
      document.querySelectorAll("#subtabs button"), function (b) {
        if (b.dataset.view === view) b.setAttribute("aria-current", "page");
        else b.removeAttribute("aria-current");
      });
    renderBody(el);
    settle(el);
  }

  function renderBody(el) {
    if (view === "findings") { renderFindings(el); return; }
    if (view === "delivery") { renderDelivery(el); return; }
    if (view === "backlog") { renderBacklog(el); return; }
    if (view === "shadow") { renderShadow(el); return; }
    if (view === "code") { renderCode(el); return; }

    var rows = D.tickets;

    // "Status conflicts" was its own tab until the digest ranked the same
    // rows better - by how well evidenced each is, rather than by the
    // model's own confidence in itself. Two doors to one set of rows is
    // one door too many; the full ticket detail is still under Tickets.

    var needle = q.toLowerCase();
    rows = rows.filter(function (r) {
      if (fStatus && r.status !== fStatus) return false;
      if (fVerdict === "none" && r.verdict) return false;
      // The status-conflict set had no filter of its own - it was a sort
      // key only - so the "Status Concerns" count on Insight had nothing
      // to link to. It is a filter now, over the same predicate the sort
      // and the tile already use, so the three cannot disagree.
      if (fVerdict === "conflict" &&
          !(r.verdict && r.verdict.status_conflict)) return false;
      if (fVerdict && fVerdict !== "none" && fVerdict !== "conflict" &&
          (!r.verdict || r.verdict.verdict !== fVerdict)) return false;
      if (!needle) return true;
      return (r.summary + " " + r.component + " " + r.candidates.join(" "))
        .toLowerCase().indexOf(needle) !== -1;
    });
    rows = sortRows(rows);
    el.innerHTML = rows.length
      ? rows.map(function (r) { return ticketCard(r, false); }).join("")
      : '<div class="empty">Nothing matches.</div>';
    // Says what is being counted *and* how many of them carry a conflict,
    // because the sort puts them first and a reader needs to know where the
    // four stop and the other hundred and sixty-nine begin.
    var conflicts = rows.filter(function (r) {
      return r.verdict && r.verdict.status_conflict;
    }).length;
    document.getElementById("count").textContent =
      rows.length + " of " + D.tickets.length +
      (conflicts ? " · " + conflicts + " Status Concern" +
       (conflicts === 1 ? "" : "s") : "");
  }

  /* How the ticket list can be ordered.

     Declared as data for the same reason the filters are: the control, the
     ordering and the default all read one table, so a name on a menu cannot
     come to mean something other than what the list does.

     `sort` is stable in every engine this page runs in, so each of these is a
     *partial* order - rows that tie on the key keep the sheet order they came
     in with. That matters more than it sounds: the export's row order is the
     only structure this backlog has (`tracelink diagnose` found the sheet is
     written in contiguous blocks of Component and Description), so preserving
     it inside a tie means "conflicts first" still reads as the document. */
  var SORTS = [
    { id: "", label: "sheet order", key: null },
    /* The four rows where the code looks built and the tracker still has the
       row open. This was a tab of its own once; it is a sort key now, which
       keeps the rows in one list with everything else about them. */
    { id: "conflict", label: "Status Concerns first",
      key: function (r) { return r.verdict && r.verdict.status_conflict ? 0 : 1; } },
    { id: "verdict", label: "contradicted first",
      key: function (r) {
        var order = ["contradicted", "unverified", "corroborated"];
        var v = r.verdict && r.verdict.verdict;
        var at = order.indexOf(v);
        // A ticket nobody adjudicated sorts last: it is not a weak result,
        // it is no result, and putting it above one is a lie about effort.
        return at === -1 ? order.length : at;
      } },
    /* Whether the names a verdict cited were actually found. Deterministic,
       and decided without the model - so this orders by how much of the page
       you can check yourself. */
    { id: "unchecked", label: "citations unchecked first",
      key: function (r) {
        var order = ["ungrounded", "uncited", "partly-grounded", "grounded"];
        var at = order.indexOf((r.grounding || {}).status);
        return at === -1 ? order.length : at;
      } }
  ];

  function sortRows(rows) {
    var s = SORTS.filter(function (x) { return x.id === fSort; })[0];
    if (!s || !s.key) return rows;
    return rows.slice().sort(function (a, b) { return s.key(a) - s.key(b); });
  }

  function buildBar() {
    var statuses = [];
    D.tickets.forEach(function (r) {
      if (r.status && statuses.indexOf(r.status) === -1) statuses.push(r.status);
    });
    statuses.sort();
    var bar = document.createElement("div");
    bar.className = "bar";
    bar.id = "bar";
    bar.innerHTML =
      '<input type="search" id="q" placeholder="search summary, component, file…">' +
      '<select id="fv"><option value="">any result</option>' +
        /* The value is the pipeline's, the text is the reader's - so a URL
           carrying `verdict=corroborated` and a menu reading "Confirmed"
           are the same selection. `conflict` is new: the status-conflict
           set was reachable only by sorting. */
        ["corroborated", "unverified", "contradicted", "conflict", "none"]
          .map(function (v) {
            return '<option value="' + esc(v) + '">' +
              esc(VERDICT_WORD[v] || v) + "</option>";
          }).join("") + "</select>" +
      '<select id="fs"><option value="">any status</option>' +
        statuses.map(function (s) {
          return "<option>" + esc(s) + "</option>"; }).join("") + "</select>" +
      '<select id="fo">' +
        SORTS.map(function (o) {
          return '<option value="' + o.id + '">' + esc(o.label) + "</option>";
        }).join("") + "</select>" +
      '<span class="muted" id="count"></span>';
    return bar;
  }

  function mountBar() {
    var host = document.getElementById("subtabs");
    var bar = buildBar();
    host.parentNode.insertBefore(bar, host.nextSibling);
    // Listeners live on the persistent bar, so typing never loses focus the
    // way it would if the input were re-rendered with the results.
    document.getElementById("q").addEventListener("input", function (e) {
      q = e.target.value; render();
    });
    document.getElementById("fv").addEventListener("change", function (e) {
      fVerdict = e.target.value; writeUrl(true); render();
    });
    document.getElementById("fs").addEventListener("change", function (e) {
      fStatus = e.target.value; writeUrl(true); render();
    });
    document.getElementById("fo").addEventListener("change", function (e) {
      fSort = e.target.value; render();
    });
  }

  function syncBar() {
    var fv = document.getElementById("fv"), fs = document.getElementById("fs");
    if (fv) fv.value = fVerdict;
    /* A status carried in from a link may not be one this run has. Falling
       back to "any status" rather than leaving the menu blank keeps the
       control honest about what it is actually filtering on. */
    if (fs) {
      fs.value = fStatus;
      if (fs.value !== fStatus) { fStatus = ""; fs.value = ""; }
    }
  }

  function showBar(which) {
    var b = document.getElementById("bar");
    if (!b) return;
    var on = which === "tickets" || which === "code";
    b.style.display = on ? "flex" : "none";
    // A verdict filter means nothing on the Code tab, and a control that
    // silently does nothing is worse than no control.
    var fv = document.getElementById("fv"), fs = document.getElementById("fs"),
        q = document.getElementById("q");
    var fo = document.getElementById("fo");
    if (fv) fv.style.display = which === "tickets" ? "" : "none";
    if (fs) fs.style.display = which === "tickets" ? "" : "none";
    // Same reason as the verdict filter: the Code tab is a list of files and
    // has no verdicts to order by, so the control would do nothing.
    if (fo) fo.style.display = which === "tickets" ? "" : "none";
    if (q) q.placeholder = which === "code"
      ? "search area, ticket or path…" : "search summary, component, file…";
    // The count belongs to whichever list is showing. Left alone it follows
    // you onto Shadow scope and reports a file count next to unrelated rows.
    var c = document.getElementById("count");
    if (c && !on) c.textContent = "";
  }

  Array.prototype.forEach.call(
    document.querySelectorAll("#subtabs button"), function (b) {
      b.addEventListener("click", function () {
        view = b.dataset.view;
        // Changing tab drops a focus that belonged to the tab you left.
        focusKind = "";
        writeUrl(true);
        showBar(view);
        render();
      });
    });

  /* Back really goes back. Every filter change pushes an entry, so the
     browser's own button undoes the last narrowing instead of leaving the
     page and taking the reader off it entirely - which is what it did when
     the state lived only in these variables. */
  window.addEventListener("popstate", function () {
    readUrl();
    if (!D) return;
    syncBar();
    showBar(view);
    render();
  });

  /* Which project this page shows.

     A `?project=` in the URL wins and is persisted; otherwise the last one
     picked anywhere in the app is reused. The key is shared with /gantt and
     the React pages on purpose - picking a project here and then clicking
     Insight must not show two different projects. */
  var STORAGE_KEY = "pulse.project";

  function wantedProject() {
    var fromUrl = new URLSearchParams(location.search).get("project");
    if (fromUrl) { try { localStorage.setItem(STORAGE_KEY, fromUrl); } catch (e) {} return fromUrl; }
    try { return localStorage.getItem(STORAGE_KEY) || ""; } catch (e) { return ""; }
  }

  function choose(id) {
    try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
    var params = new URLSearchParams(location.search);
    params.set("project", id);
    history.replaceState(null, "", location.pathname + "?" + params.toString());
    load(id);
  }

  /* The picker lists every delivery project, not only the traced ones - the
     point of the page is partly to show which projects have no traceability
     at all, and a picker that hid them would hide that. */
  function buildPicker(traced, current) {
    var sel = document.getElementById("project");
    fetch("/api/portfolio").then(function (r) {
      return r.ok ? r.json() : { projects: [] };
    }).catch(function () {
      return { projects: [] };
    }).then(function (bundle) {
      var rows = (bundle && bundle.projects) || [];
      var known = {};
      rows.forEach(function (p) { known[p.project_id] = p.name; });
      // A run whose project is not in the portfolio still deserves an entry,
      // or its findings become unreachable from the UI.
      traced.forEach(function (t) {
        if (t.project_id && !known[t.project_id]) {
          known[t.project_id] = (t.project_name || t.name) + " (not in portfolio)";
        }
      });
      var tracedIds = {};
      traced.forEach(function (t) { if (t.project_id) tracedIds[t.project_id] = true; });

      sel.innerHTML = Object.keys(known).map(function (id) {
        return '<option value="' + esc(id) + '"' +
          (id === current ? " selected" : "") + ">" + esc(known[id]) +
          (tracedIds[id] ? "" : " — not traced") + "</option>";
      }).join("");
      sel.onchange = function () { choose(sel.value); };
    });
  }

  /* Producing a run, rather than only reading one.
     ----------------------------------------------------------------
     The POST returns as soon as the pipeline starts, so everything a
     person learns after that comes from polling. Three things have to be
     on screen at all times: whether this server can run at all (the
     button is disabled with the reason when it cannot), which stage is
     executing, and - if it stopped - the pipeline's own last words. */

  var runTimer = null;
  var runStartedAt = 0;

  function adminTokenOnly() {
    var h = {};
    try {
      var t = sessionStorage.getItem("pulse-admin-token");
      if (t) h["X-Pulse-Admin-Token"] = t;
    } catch (e) { /* reported by the request that needed it */ }
    return h;
  }

  function elapsed() {
    if (!runStartedAt) return "";
    return " · " + Math.round((Date.now() - runStartedAt) / 1000) + "s";
  }

  /* Both run buttons, and whether each one is offered.

     `traced` is whether this project has a run to update. It decides two
     things: that Sync is pressable at all, and which of the two is the
     screen's one primary action - a project with nothing to compare against
     should be led to New trace, and one already traced to Sync. */
  var hasRun = false;
  /* Whether this server runs the stages that call a model. Null until the
     first poll answers - the empty state simply omits the sentence until
     then rather than guessing at it. */
  var verdictStages = null;

  function runButtons() {
    return [document.getElementById("run-new"),
            document.getElementById("run-sync")];
  }

  function setRunEnabled(on) {
    var pair = runButtons();
    pair[0].disabled = !on;
    // Never pressable without a run behind it: the server refuses that with
    // a sentence, and a button whose only outcome is that sentence is a
    // button that should not have been offered.
    pair[1].disabled = !on || !hasRun;
    pair[0].classList.toggle("secondary", hasRun);
    pair[1].classList.toggle("secondary", !hasRun);
  }

  function paintRun(j) {
    var state = document.getElementById("run-state");
    var detail = document.getElementById("run-detail");
    var run = j.run;
    if (typeof j.verdicts === "boolean") verdictStages = j.verdicts;

    /* State 3 of the four: this deployment cannot do it at all. Disabled
       with the reason beside it, rather than a button that fails when
       pressed. */
    if (j.available === false) {
      setRunEnabled(false);
      state.className = "run-state";
      state.textContent = j.detail || "This server cannot run the pipeline.";
      detail.innerHTML = "";
      return false;
    }

    if (j.running && run) {
      setRunEnabled(false);
      state.className = "run-state";
      /* The stage, paired with the word "Running" - motion and colour never
         carry the meaning alone. */
      state.textContent = "Running" +
        (run.stage ? ": " + run.stage : "…") + elapsed();
      detail.innerHTML = "";
      return true;
    }

    setRunEnabled(true);
    if (!run) {
      state.className = "run-state";
      state.textContent = "";
      detail.innerHTML = "";
      return false;
    }

    if (run.status === "done") {
      state.className = "run-state ok";
      state.textContent = "Last run finished";
      detail.innerHTML = "";
      return false;
    }

    state.className = "run-state bad";
    state.textContent = "Last run failed";
    var log = (run.log || []).join("\n");
    detail.innerHTML =
      '<details class="runlog"><summary>Why it stopped</summary><pre>' +
      esc(run.error ? run.error + "\n\n" + log : log) + "</pre></details>";
    return false;
  }

  function refreshRun(onFinish) {
    return fetch("/api/traceability/run")
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var stillRunning = paintRun(j);
        if (!stillRunning && runTimer) {
          clearInterval(runTimer);
          runTimer = null;
          runStartedAt = 0;
          if (onFinish) onFinish(j);
        }
        return j;
      })
      .catch(function () { /* a failed poll is not a failed run */ });
  }

  function watchRun() {
    if (runTimer) clearInterval(runTimer);
    runStartedAt = runStartedAt || Date.now();
    runTimer = setInterval(function () {
      refreshRun(function (j) {
        /* Finished: show what it produced. A successful run means this
           project has a run it did not have a minute ago, so the page has
           to re-read rather than leave "Not traced" on screen. */
        if (j && j.run && j.run.status === "done") load(wantedProject());
      });
    }, 2000);
  }

  /* `mode` is "new" or "sync", and the server takes the same two words -
     one vocabulary, so a log line and a button agree about what happened. */
  function startRun(mode) {
    var state = document.getElementById("run-state");
    var project = wantedProject();
    if (!project) {
      state.className = "run-state bad";
      state.textContent = "Pick a project first.";
      return;
    }

    setRunEnabled(false);
    state.className = "run-state";
    /* The clone happens inside this request, so the first press is slow.
       Saying so beats a button that looks stuck. Named per mode because the
       two take visibly different amounts of time and a person who pressed
       Sync should not be left wondering whether they hit the wrong one. */
    state.textContent = mode === "new"
      ? "Starting a new trace: reading the repository…"
      : "Syncing: reading the repository…";
    document.getElementById("run-detail").innerHTML = "";

    var headers = adminTokenOnly();
    headers["Content-Type"] = "application/json";

    fetch("/api/traceability/run", {
      method: "POST", headers: headers,
      body: JSON.stringify({ project_id: project, mode: mode })
    })
      .then(function (r) {
        return r.text().then(function (text) {
          var data = null;
          try { data = JSON.parse(text); } catch (e) { /* not JSON */ }
          if (!r.ok) {
            throw new Error((data && data.detail) || text ||
                            ("the server answered " + r.status));
          }
          return data;
        });
      })
      .then(function () {
        runStartedAt = Date.now();
        watchRun();
        return refreshRun();
      })
      .catch(function (e) {
        setRunEnabled(true);
        state.className = "run-state bad";
        state.textContent = e.message;
      });
  }

  function load(project) {
    var url = "/api/traceability" + (project ? "?project=" + encodeURIComponent(project) : "");
    fetch(url).then(function (r) { return r.json(); }).then(function (data) {
      var traced = data.available || [];
      buildPicker(traced, project || data.project_id || "");
      document.getElementById("runinfo").textContent =
        traced.length + (traced.length === 1 ? " run available" : " runs available");

      /* Whether THIS project has a run, not whether the server has any.
         `available` lists every run on disk, and a project with none of them
         still has nothing for Sync to compare against. */
      hasRun = !!data.run;
      setRunEnabled(true);

      if (!data.run) {
        document.getElementById("mix").innerHTML = "";
        document.getElementById("chips").innerHTML = "";
        document.getElementById("tiles").innerHTML = "";
        document.getElementById("gaps").innerHTML = "";
        showBar(null);
        document.getElementById("main").innerHTML =
          '<div class="empty"><p><b>Not traced.</b></p><p>' + esc(data.detail) +
          '</p><p>Press <b>New trace</b> above to produce one. It ' +
          "needs two things registered for this project on " +
          '<a href="/settings">Settings &rsaquo; Sources</a>: the ' +
          "<b>code repository</b> it is traced against, and the <b>backlog " +
          "export</b> its tickets are read from.</p>" +
          "<p class=\"muted\">Once a project has a run, <b>Sync</b> updates " +
          "it against the current code and backlog instead of starting " +
          "over.</p>" +
          /* Restored rather than dropped: it is still true on a server that
             has not enabled them, and it is the difference between a board
             with verdicts on it and one without. Asked of the server, so it
             cannot describe the wrong deployment. */
          (verdictStages === false
            ? "<p class=\"muted\">Only the free stages run here. The ones that " +
              "call a model &mdash; translate, adjudicate, explain &mdash; cost " +
              "money per ticket and are off on this server.</p>"
            : "") +
          "</div>";
        return;
      }
      D = data;
      mix();
      tiles();
      if (!document.getElementById("bar")) mountBar();
      syncBar();
      showBar(view);
      writeUrl(false);
      render();
    }).catch(function (err) {
      document.getElementById("main").innerHTML =
        '<div class="empty"><p><b>Could not read traceability.</b></p><p>' +
        esc(err.message) + "</p></div>";
    });
  }

  /* The URL decides the view and the filters before anything renders, so
     a link never flashes the default tab on its way to the one it asked
     for. */
  readUrl();
  Array.prototype.forEach.call(
    document.querySelectorAll("#subtabs button"), function (b) {
      if (b.dataset.view === view) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
  load(wantedProject());

  document.getElementById("run-new")
          .addEventListener("click", function () { startRun("new"); });
  document.getElementById("run-sync")
          .addEventListener("click", function () { startRun("sync"); });
  /* Asked once on load, so the button knows whether this server can run at
     all before anybody presses it - and so a run somebody else started, or
     one still going after a reload, is picked up rather than invisible. */
  refreshRun().then(function (j) { if (j && j.running) watchRun(); });
})();
</script>
</body>
</html>
