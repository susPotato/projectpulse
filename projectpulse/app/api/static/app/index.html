<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProjectPulseAI</title>
    <!-- Sets data-theme before the stylesheet paints anything, so a saved or
         system dark preference does not flash light first. Kept identical
         across all four rail copies - see theme.js and Shell.tsx's
         ThemeToggle, which read this same attribute once React mounts. -->
    <script>(function(){try{var t=localStorage.getItem("pulse-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <!-- The shared Gantt is one vanilla implementation used by both the static
         Schedule page and this app. Porting it to React would create a second
         one, and two implementations eventually draw two different pictures of
         one projection. -->
    <!-- The app shell - rail, app bar, panel and board classes - is defined
         once in `shell.css` and shared with the three hand-written pages. The
         app must link it: without it `.rail` is unstyled and its `<svg>`
         elements fall back to the CSS default 300x150, which pushed the whole
         page off screen and photographed as a blank frame. -->
    <link rel="stylesheet" href="/static/shell.css" />
    <link rel="stylesheet" href="/static/gantt.css" />
    <script src="/static/gantt.js"></script>
    <script type="module" crossorigin src="/static/app/assets/index-SyzaHyfj.js"></script>
    <link rel="stylesheet" crossorigin href="/static/app/assets/index-Dxpf8iFe.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
