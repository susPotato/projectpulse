<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjectPulseAI - Schedule</title>
<!-- Sets data-theme before the stylesheet paints anything, so a saved or
     system dark preference does not flash light first. Kept identical
     across all four rail copies - see theme.js. -->
<script>(function(){try{var t=localStorage.getItem("pulse-theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/gantt.css">
<script src="/static/gantt.js" defer></script>
<script src="/static/theme.js" defer></script>
<script src="/static/rail.js" defer></script>
<!--
  The schedule view.

  Read-only on purpose. This is an intelligence layer over Jira and Excel, not a
  system of record: the precision model exists *because* we observe someone
  else's spreadsheet rather than own it. Make this draggable and every change
  becomes precision='exact', bounded intervals stop existing, and the most
  defensible engineering in the project turns into dead code. The PM keeps
  editing in Excel and re-uploads the sheet from Settings > Sources.

  Three bars per row, and the third is the product: baseline (what was
  committed), plan (what the tracker says today), and the projected overrun (what
  the dependency chain implies and nobody has written down).

  Computes nothing. Every date arrives already decided by project_schedule().
-->
<style>
  * { box-sizing: border-box; }

  /* No padding. This page was the only one of the six that had any, and it
     put 20px between the viewport and `.shell` - which is the rail. So the
     navigation on Schedule sat inset from the edge, top and left, while on
     every other tab it ran flush against it, and switching tabs moved the
     whole rail. The content's own gutter comes from `.wrap` in the shared
     stylesheet, where the other five have always taken it from. */
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--ink-2); margin: 0 0 16px; font-size: 13px; }
  h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-3); margin: 24px 0 8px; font-weight: 700;
  }
  .card {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 8px; padding: 14px 16px;
  }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--surface); border: 1px solid var(--rule);
          border-radius: 8px; padding: 11px 13px; }
  .stat b { display: block; font-size: 22px; line-height: 1.2;
            font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink-3); font-size: 11px;
               text-transform: uppercase; letter-spacing: .06em; }
  .stat.bad b { color: var(--red); }

  /* The feature table. Its own rules rather than the shared `.card` grid:
     this is the only tabular thing on the page, and the one property that
     matters is that a 173-row body scrolls inside a fixed box instead of
     pushing the milestones section off the screen. */
  /* Search and ordering for the chart. Same shapes as `.ft-controls` below,
     which does the same job for the features table - one visual language for
     "narrow this list", whichever list it is. */
  .g-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin: 0 0 10px; }
  .g-controls input[type="search"] { font: inherit; font-size: 13px;
    padding: 6px 9px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 6px; min-width: 260px;
    flex: 1 1 260px; }
  .g-controls select { font: inherit; font-size: 13px; padding: 6px 9px;
    color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
    border-radius: 6px; }
  /* Pushed to the far end: it is the answer to "did my search do anything",
     read after the controls rather than between them. */
  .g-count { margin-left: auto; font-size: 12px; color: var(--ink-3); }

  .ft-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin: 12px 0 8px; }
  .ft-controls input[type="search"] { font: inherit; font-size: 13px;
    padding: 6px 9px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 6px; min-width: 240px; }
  .ft-chip { font: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer;
    color: var(--ink-2); background: var(--surface); border: 1px solid var(--rule);
    border-radius: 999px; }
  .ft-chip[aria-pressed="true"] { color: var(--ink); border-color: var(--blue);
    background: var(--rule-2); font-weight: 600; }
  .ft-count { font-size: 12px; color: var(--ink-3); margin-left: auto; }
  .ft-scroll { max-height: 460px; overflow: auto; border: 1px solid var(--rule);
    border-radius: 8px; }
  .ft { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .ft th { position: sticky; top: 0; z-index: 1; text-align: left;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-3); background: var(--surface);
    border-bottom: 1px solid var(--rule); padding: 8px 10px; white-space: nowrap; }
  .ft td { border-bottom: 1px solid var(--rule-2); padding: 7px 10px;
    vertical-align: top; }
  .ft tbody tr:hover { background: var(--rule-2); }
  .ft .t-title { color: var(--ink); }
  .ft .t-why { display: block; margin-top: 3px; color: var(--ink-3);
    font-size: 11.5px; line-height: 1.45; }
  .ft-tag { display: inline-block; font-size: 11px; font-weight: 600;
    padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .ft-corroborated { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
  .ft-contradicted { color: var(--red); background: color-mix(in srgb, var(--red) 16%, transparent); }
  .ft-unverified { color: var(--ink-3); background: var(--rule-2); }
  .ft-none { color: var(--ink-3); font-style: italic; }
  .ft-empty { padding: 18px 12px; color: var(--ink-3); font-size: 13px; }
  .ms-list { display: grid; gap: 2px; }
  .ms-row { display: flex; align-items: baseline; gap: 10px; padding: 5px 0;
            border-bottom: 1px dotted var(--rule-2); font-size: 13px; }
  .ms-row .nm { font-weight: 650; min-width: 160px; }
  .ms-row .dt { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .ms-row .risk {
    margin-left: auto; font-size: 10.5px; font-weight: 800; letter-spacing: .05em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 4px;
    color: #fff; background: var(--red);
  }
  .note {
    margin-top: 12px; padding: 9px 12px; border-radius: 7px; font-size: 12.5px;
    background: color-mix(in srgb, var(--amber) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
  }
  .err { color: var(--red); }
  .mono { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; }
</style>

<main>
<div class="wrap">

  <div class="appbar">
    <h1>Schedule</h1>
    <span class="scope">baseline, plan and projected overrun on one window</span>
    <span class="spacer"></span>
    <!-- This page is hand-written, so it does not get the React rail's own
         ProjectSwitcher for free. Without one it fetched `/api/gantt` bare and
         always got the route's default project - and the project dashboard's
         "Schedule" link passes `?project=`, which this page ignored, so it
         showed HRMS's schedule under another project's link. -->
    <label class="field-label" for="proj">Project</label>
    <select id="proj"></select>
    <!-- Lived in the old tab bar and was lost when the rail replaced it. It is
         load-bearing copy: it is the answer to "why can I not drag a bar?" -->
    <span class="asof">read-only - the PM edits in Excel</span>
  </div>
  <p class="sub" id="sub">loading...</p>
  <div id="main"></div>

  <!-- Traceability folded onto the same rows the chart draws. Rendered here
       rather than inside the chart on purpose: `gantt.js` is shared with the
       React Calculation tab, so a column added there would appear on a screen
       that has no traceability data and no way to explain it. Absent unless
       this project has a run. -->
  <div id="trace-panel" hidden></div>
</div>

<script>
(function () {
  "use strict";

  /* Which project this page shows.

     Deliberately the same mechanism as `web/src/api.ts#currentProject`, key
     included: a `?project=` in the URL wins and is persisted, otherwise the
     stored selection is used. If this page invented its own key, picking a
     project here and then clicking Insight would show two different projects,
     which is worse than not being able to pick at all. */
  var STORAGE_KEY = "pulse.project";

  function currentProject() {
    var params = new URLSearchParams(window.location.search);
    var fromUrl = params.get("project");
    if (fromUrl) {
      var selection = { id: fromUrl, also: params.getAll("also") };
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(selection));
      } catch (e) {
        // Private window or storage blocked. The URL still won this page load,
        // which is all correctness needs here.
      }
      return selection;
    }
    try {
      var stored = window.localStorage.getItem(STORAGE_KEY);
      if (!stored) return null;
      var parsed = JSON.parse(stored);
      return parsed && parsed.id ? { id: parsed.id, also: parsed.also || [] } : null;
    } catch (e) {
      return null;
    }
  }

  function ganttUrl() {
    var sel = currentProject();
    if (!sel) return "/api/gantt";
    var params = new URLSearchParams();
    params.set("project", sel.id);
    (sel.also || []).forEach(function (id) { params.append("also", id); });
    return "/api/gantt?" + params.toString();
  }

  /* The picker. Reads the portfolio so the list is the same set of projects -
     and the same names - every other page offers, rather than a second idea of
     what exists. A failure here leaves the select empty and the chart still
     renders: not being able to switch is a smaller problem than not drawing. */
  function fillPicker() {
    var select = document.getElementById("proj");
    if (!select) return;
    fetch("/api/portfolio")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (bundle) {
        if (!bundle || !bundle.projects || !bundle.projects.length) return;
        var sel = currentProject();
        var selectedId = sel ? sel.id : bundle.projects[0].project_id;
        bundle.projects.forEach(function (row) {
          var option = document.createElement("option");
          option.value = row.project_id;
          option.textContent = row.name;
          option.dataset.also = JSON.stringify(row.source_ids.filter(function (id) {
            return id !== row.project_id;
          }));
          if (row.project_id === selectedId) option.selected = true;
          select.appendChild(option);
        });
        select.addEventListener("change", function () {
          var option = select.options[select.selectedIndex];
          var params = new URLSearchParams();
          params.set("project", option.value);
          JSON.parse(option.dataset.also || "[]").forEach(function (id) {
            params.append("also", id);
          });
          // A real navigation rather than a re-render: the URL is then
          // linkable, and `currentProject` persists the choice on the way in
          // so every other page follows.
          window.location.search = params.toString();
        });
      })
      .catch(function () { /* see above - the chart matters more */ });
  }

  function $(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function d(v) { return v === null || v === undefined ? "-" : v; }

  /* Resolve once the document is parsed.

     `gantt.js` is deferred, so it runs after parsing; this inline script runs
     during it. Without this gate a cached API response can arrive before the
     chart component exists - which is exactly how `PulseGantt is not defined`
     happened. */
  function documentReady() {
    return new Promise(function (resolve) {
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () { resolve(); });
      } else {
        resolve();
      }
    });
  }

  function renderStats(bundle) {
    var stats = $("div", "stats");
    var worst = 0;
    bundle.rows.forEach(function (r) {
      if (r.propagated_days > worst) worst = r.propagated_days;
    });
    var risky = bundle.milestones.filter(function (m) { return m.at_risk; }).length;

    /* Three of these five are forward-pass results over a dependency graph, and
       on a source that states no links they are not zero - nothing was
       assessed. Reporting 0 was worse than useless: "0 milestones at risk" is a
       clean bill of health nobody issued, which is the one thing this product
       exists not to say.

       But a row of dashes is barely better. It is honest and it is unreadable -
       three of five tiles saying "not available" tells a PM nothing they can do
       anything about. So the tiles change to the strongest claims this data
       *can* support: how much is past due, and how much of the project is not
       on a timeline at all. Both need only a row and a date, both are exactly
       what somebody opening a schedule wants to know, and neither pretends to a
       graph that is not there.

       `chain implies finish` goes with them. With no chain it equals the planned
       date exactly, so it was the sheet's own number wearing a second hat and
       coloured red for emphasis. */
    var linked = bundle.rows.some(function (r) {
      return (r.depends_on || []).length > 0;
    });
    //: ISO dates compare correctly as strings, and `day()` lives inside
    //: gantt.js's closure. Same comparison the chart makes, so the tile and the
    //: red tails beside it cannot disagree about what "past due" means.
    var scan = bundle.as_of || "";
    var overdue = bundle.rows.filter(function (r) {
      if (r.status === "DONE" || r.status === "DROPPED") return false;
      return scan && r.planned_end && r.planned_end < scan;
    }).length;
    var undated = bundle.rows.filter(function (r) {
      return !r.start && !r.planned_end;
    }).length;

    var tiles = [
      [bundle.rows.length, "tasks", false],
      [d(bundle.project_end_planned), "tracker says finish", false],
      [overdue, "past due, still open", overdue > 0]
    ];
    if (linked) {
      tiles.push([d(bundle.project_end_projected), "chain implies finish", true]);
      tiles.push([worst + "d", "worst hidden slip", true]);
      tiles.push([risky, "milestones at risk", risky > 0]);
    } else {
      //: Said once, here, rather than as three separate "not available" tiles.
      tiles.push([undated, "carry no date - not on this chart", undated > 0]);
      tiles.push(["none", "dependencies stated - no critical path", false]);
    }
    tiles.forEach(function (row) {
      var st = $("div", "stat" + (row[2] ? " bad" : ""));
      st.appendChild($("b", null, row[0]));
      st.appendChild($("span", null, row[1]));
      stats.appendChild(st);
    });
    return stats;
  }

  function renderMilestones(bundle) {
    var card = $("div", "card");
    var list = $("div", "ms-list");
    bundle.milestones.forEach(function (m) {
      var row = $("div", "ms-row");
      row.appendChild($("div", "nm", m.name));
      row.appendChild($("div", "dt", d(m.planned_date)));
      if (m.slipped_days) {
        row.appendChild($("div", "dt", "+" + m.slipped_days + "d vs baseline"));
      }
      if (m.at_risk) row.appendChild($("div", "risk", "at risk"));
      list.appendChild(row);
    });
    card.appendChild(list);
    card.appendChild($("p", "sub",
      "Each milestone is dated from the last task beneath it. " +
      "At risk means work under it cannot finish on its planned date."));
    return card;
  }

  function section(title, node) {
    var frag = document.createDocumentFragment();
    if (title) frag.appendChild($("h2", null, title));
    frag.appendChild(node);
    return frag;
  }

  /* Searching and ordering 190 rows.

     The chart draws every task it is given, in the order the server sent
     them, which was fine at 20 rows and is a page and a half of scrolling at
     190. Both controls narrow or reorder the *data* and re-render, rather
     than hiding rows with CSS: a hidden row still occupies the time axis and
     still counts in "3 x same dates", so the chart would disagree with
     itself.

     State lives here rather than in the URL. It is a view preference, not a
     thing to link somebody to - and the project *is* in the URL, so a
     reloaded page comes back to the same data with a clean view. */
  var view = { q: "", sort: "due" };

  /* What each ordering is for, in the order somebody reaches for them.
     `due` first because the question is almost always "what is next". */
  var SORTS = [
    ["due", "due date"],
    ["late", "most overdue"],
    ["slip", "biggest slip"],
    ["start", "start date"],
    ["owner", "owner"],
    ["name", "name"]
  ];

  function haystack(row) {
    return [row.label, row.title, row.assignee, row.milestone_name, row.phase,
            row.status].join(" ").toLowerCase();
  }

  /* A missing date sorts last in every date ordering. Ascending would put
     every undated row at the top, which is the one group nobody opened the
     chart to look at. */
  function by(pick) {
    return function (a, b) {
      var x = pick(a), y = pick(b);
      if (x === null || x === undefined || x === "") return 1;
      if (y === null || y === undefined || y === "") return -1;
      return x < y ? -1 : x > y ? 1 : 0;
    };
  }

  var ORDER = {
    due: by(function (r) { return r.planned_end; }),
    start: by(function (r) { return r.start; }),
    name: by(function (r) { return (r.title || r.label || "").toLowerCase(); }),
    owner: by(function (r) { return (r.assignee || "").toLowerCase(); }),
    late: function (a, b) {
      return (b.days_past_due || 0) - (a.days_past_due || 0);
    },
    slip: function (a, b) {
      return (b.propagated_days || 0) - (a.propagated_days || 0);
    }
  };

  /* The bundle the chart is actually handed. Milestones are left whole: the
     grouping headers still make sense when a search leaves one task under
     one feature, and dropping them would make the chart reshape itself as
     somebody types. */
  function narrow(bundle) {
    var q = view.q.trim().toLowerCase();
    var rows = bundle.rows.slice();
    if (q) {
      rows = rows.filter(function (r) { return haystack(r).indexOf(q) >= 0; });
    }
    rows.sort(ORDER[view.sort] || ORDER.due);
    var out = {};
    for (var k in bundle) if (bundle.hasOwnProperty(k)) out[k] = bundle[k];
    out.rows = rows;
    return out;
  }

  function controls(bundle, card) {
    var bar = $("div", "g-controls");

    var search = document.createElement("input");
    search.type = "search";
    search.placeholder = "Search key, title, owner, feature...";
    search.value = view.q;
    search.setAttribute("aria-label", "Search tasks on this chart");

    var order = document.createElement("select");
    order.setAttribute("aria-label", "Sort tasks");
    SORTS.forEach(function (pair) {
      var option = document.createElement("option");
      option.value = pair[0];
      option.textContent = "Sort: " + pair[1];
      if (pair[0] === view.sort) option.selected = true;
      order.appendChild(option);
    });

    var count = $("span", "g-count");

    function redraw() {
      var shown = narrow(bundle);
      count.textContent = shown.rows.length === bundle.rows.length
        ? bundle.rows.length + " tasks"
        : shown.rows.length + " of " + bundle.rows.length + " tasks";
      /* Replace only the chart. Rebuilding the whole card would rebuild the
         search box too, and an input that is recreated on every keystroke
         loses focus after the first character. */
      var old = card.querySelector(".gantt");
      if (old) card.replaceChild(PulseGantt.render(shown), old);
    }

    var typing = null;
    search.addEventListener("input", function () {
      view.q = search.value;
      // The chart is a full SVG rebuild, so one per keystroke is visible as
      // a stutter on a 190-row board.
      clearTimeout(typing);
      typing = setTimeout(redraw, 120);
    });
    order.addEventListener("change", function () {
      view.sort = order.value;
      redraw();
    });

    bar.appendChild(search);
    bar.appendChild(order);
    bar.appendChild(count);
    count.textContent = bundle.rows.length + " tasks";
    return bar;
  }


  function render(bundle) {
    document.getElementById("sub").textContent =
      bundle.project_id + "  -  " + bundle.rows.length + " tasks, " +
      bundle.rows.filter(function (r) { return r.is_inconsistent; }).length +
      " whose planned date the chain cannot support";
    // Same data the line above reads, into the tab - the React pages' Page
    // component does this for every one of them; this hand-written page has
    // no equivalent so it is set here instead.
    document.title = bundle.project_id + " · " + bundle.rows.length + " tasks — ProjectPulseAI - Schedule";

    var main = document.getElementById("main");
    main.textContent = "";
    main.appendChild(renderStats(bundle));

    var card = $("div", "card");
    card.appendChild(controls(bundle, card));
    card.appendChild(PulseGantt.render(narrow(bundle)));
    card.appendChild($("p", "sub",
      "Bold rows and red arrows are the driving path - the only chain that can " +
      "be shortened to pull the finish date in. Hover any row or bar for its dates."));
    main.appendChild(section(null, card));

    main.appendChild(section("Milestones", renderMilestones(bundle)));

    if (bundle.project_end_projected > bundle.project_end_planned) {
      main.appendChild($("div", "note",
        "Nothing on this chart was edited by us. The red segments are dates the " +
        "spreadsheet still shows as achievable; the schedule underneath them " +
        "says otherwise. Fix them in Excel and re-upload the sheet."));
    }
  }

  function fail(title, detail, fix) {
    var main = document.getElementById("main");
    main.textContent = "";
    var card = $("div", "card");
    card.appendChild($("p", "err", title + ": " + detail));
    if (fix) card.appendChild($("div", "mono", fix));
    main.appendChild(card);
    document.getElementById("sub").textContent = title;
  }

  fillPicker();

  fetch(ganttUrl())
    .then(function (r) {
      return r.json().then(function (body) {
        return { ok: r.ok, status: r.status, body: body };
      });
    })
    .catch(function (e) {
      // Network layer only. A render fault must not land here, or it gets
      // reported as an unreachable server.
      var offline = location.protocol === "file:";
      fail(
        offline ? "Opened as a file, not served" : "Could not reach the server",
        offline ? "This page fetches /api/gantt, which needs the app running." : e.message,
        "python -m scripts.replay\npython -m scripts.demo\nthen open http://127.0.0.1:8000/gantt"
      );
      return null;
    })
    .then(function (res) {
      if (!res) return null;
      if (!res.ok) {
        var detail = (res.body && res.body.detail) || "HTTP " + res.status;
        if (res.status === 503) fail("Database unreachable", detail, "docker compose up -d");
        else if (res.status === 404) fail("No data yet", detail, "python -m scripts.replay");
        else fail("Could not load /api/gantt", detail, null);
        return null;
      }
      return documentReady().then(function () {
        if (typeof PulseGantt === "undefined") {
          fail("Chart component did not load",
               "/static/gantt.js is missing or failed to parse.",
               "check the browser console, then reload");
          return;
        }
        try {
          render(res.body);
          drawTraceability(res.body);
        } catch (e) {
          fail("Could not draw the schedule", e.message, null);
        }
      });
    });

  /* What the code says about the work each schedule row stands for.

     The chart's rows are the tracker's keyed issues; the features live in the
     unkeyed rows beneath them. `/api/traceability/rollup` folds the verdicts
     onto those keys so a bar can report how much of its work the code backs
     up. Silent when this project has no traceability run - most do not, and
     an empty panel on every other project would be noise. */
  function drawTraceability(bundle) {
    var panel = document.getElementById("trace-panel");
    if (!panel) return;
    var project = (bundle && bundle.project_id) || currentProject();
    var url = "/api/traceability/rollup" +
      (project ? "?project=" + encodeURIComponent(project) : "");

    fetch(url).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data || !data.run || !data.parents) return;
        var keys = Object.keys(data.parents);
        if (!keys.length) return;

        var rows = (bundle && bundle.rows) || [];
        /* Every row on the chart, in the chart's order - including the ones
           with no features. Listing only the rows that carry work would hide
           the finding: that sixteen of seventeen issues carry none. Any key
           the export has but the chart does not is appended after. */
        var ordered = rows.map(function (r) { return r.label; });
        keys.forEach(function (k) {
          if (ordered.indexOf(k) === -1) ordered.push(k);
        });

        var titles = {};
        rows.forEach(function (r) { titles[r.label] = r.title || ""; });

        var total = 0, carried = 0;
        keys.forEach(function (k) {
          total += data.parents[k].features;
          if (data.parents[k].features > 0) carried += 1;
        });

        /* Which rows are drawn as bars, and which of the rows that actually
           carry work are not. This is the comparison worth making: a chart
           can look complete while the row holding every feature is missing
           from it, because an undated row is correctly kept off the Gantt
           and then reads as nothing rather than as an omission. */
        var isDated = {};
        rows.forEach(function (r) {
          isDated[r.label] = !!(r.start || r.planned_end);
        });
        var undatedCarriers = keys.filter(function (k) {
          return data.parents[k].features > 0 && !isDated[k];
        });
        var featuresOffChart = undatedCarriers.reduce(function (n, k) {
          return n + data.parents[k].features;
        }, 0);

        /* Every status the export uses, in the order the chart's own rows
           report them, so the bar below is labelled with the team's words
           rather than a done/not-done split we invented. Deciding which of
           "Release it" / "In Progress" / "To Do" counts as finished is the
           tracker owner's call, not this page's. */
        var statusNames = [];
        keys.forEach(function (k) {
          Object.keys(data.parents[k].statuses || {}).forEach(function (s) {
            if (statusNames.indexOf(s) === -1) statusNames.push(s);
          });
        });
        var FILLS = ["var(--viz-plan)", "var(--amber)", "var(--ink-3)",
                     "var(--purple)", "var(--blue)"];

        var html = '<h2 style="font-size:15px;margin:26px 0 4px">' +
          "What the code says about these rows</h2>";

        if (undatedCarriers.length) {
          html += '<p class="sub" style="border-left:3px solid var(--orange);' +
            'padding-left:10px"><b>' + featuresOffChart +
            " of the " + total + " feature rows in this backlog are not on the " +
            "chart above.</b> They sit under " +
            undatedCarriers.map(function (k) { return "<b>" + k + "</b>"; }).join(", ") +
            ", which carr" + (undatedCarriers.length === 1 ? "ies" : "y") +
            " no dates and " + (undatedCarriers.length === 1 ? "is" : "are") +
            " therefore drawn as nothing. The bars you can see are the " +
            (rows.length - undatedCarriers.length) +
            " planning tasks, which carry no product work at all.</p>";
        } else {
          html += '<p class="sub">' + total + " feature rows sit beneath " +
            carried + " of the " + ordered.length + " issues on this chart.</p>";
        }

        /* A flat backlog has nothing to roll up.

           This breakdown exists to show how a hundred-odd feature rows
           distribute across the handful of keyed issues they sit under -
           which is a real question when the export nests, and no question
           at all when it does not. Read from Jira every ticket is its own
           row, so every block here reads "of 1 features, 0 are backed by
           code": one hundred and ninety times, saying nothing the sortable
           table below does not say better. */
        var nested = keys.some(function (k) {
          return data.parents[k].features > 1;
        });

        if (!nested) {
          var backed = 0, unver = 0, clash = 0, grounded = 0;
          keys.forEach(function (k) {
            var p = data.parents[k];
            backed += p.corroborated; unver += p.unverified;
            clash += p.conflicts; grounded += p.grounded;
          });
          html += '<p class="sub">Every row here is its own issue, so there ' +
            "is no roll-up to do - each one is listed in the table below. " +
            "Across all " + keys.length + ": <b>" + backed +
            "</b> backed by code" +
            (grounded ? ' (<b style="color:var(--green)">' + grounded +
              "</b> with every cited name found in the file)" : "") +
            (unver ? ", " + unver + " not verified from the candidate code" : "") +
            (clash ? ', <b style="color:var(--orange)">' + clash +
              " status conflict" + (clash === 1 ? "" : "s") + "</b>" : "") +
            ".</p>";
        }

        // Claimed-versus-verified, for the issues that carry work.
        if (nested) keys.forEach(function (key) {
          var p = data.parents[key];
          if (!p.features) return;
          var adjudicated = p.corroborated + p.contradicted + p.unverified;
          var segs = statusNames.map(function (s, i) {
            var n = (p.statuses || {})[s] || 0;
            if (!n) return "";
            return '<span title="' + s + ': ' + n + '" style="display:inline-block;' +
              "height:12px;width:" + (100 * n / p.features) + "%;background:" +
              FILLS[i % FILLS.length] + ';"></span>';
          }).join("");

          html += '<div style="margin:14px 0 4px"><b>' + key + "</b> " +
            '<span class="asof">' + (titles[key] || "") +
            (isDated[key] ? "" : " · no dates, so not on the chart") +
            "</span></div>" +
            '<div style="display:flex;width:100%;border-radius:3px;overflow:hidden;' +
            'background:var(--rule-2)">' + segs + "</div>" +
            '<p class="sub" style="margin:4px 0 0">' +
            statusNames.filter(function (s) { return (p.statuses || {})[s]; })
              .map(function (s, i) {
                return '<span style="display:inline-block;width:8px;height:8px;' +
                  "background:" + FILLS[statusNames.indexOf(s) % FILLS.length] +
                  ';margin-right:4px;border-radius:2px"></span>' +
                  s + " " + p.statuses[s];
              }).join(" &nbsp; ") +
            " &nbsp;&mdash;&nbsp; of " + p.features + " features, <b>" +
            p.corroborated + "</b> are backed by code" +
            /* Of those, how many had every cited name checked against the
               source. The distinction the rest of this page cannot make:
               one number is the model's conclusion, the other was verified
               without it. */
            (p.grounded ? ' (<b style="color:var(--green)">' + p.grounded +
              "</b> with every cited name found in the file)" : "") +
            (p.unverified ? ", " + p.unverified + " could not be verified " +
              "from the candidate code" : "") +
            (p.conflicts ? ', <b style="color:var(--orange)">' + p.conflicts +
              " status conflict" + (p.conflicts === 1 ? "" : "s") + "</b>" : "") +
            ".</p>";
        });

        /* The rest of the chart's rows, counted rather than listed.

           This used to name every one of them in a semicolon-joined
           paragraph, which read as a sentence while the project held
           seventeen rows. The real export put a hundred and ninety on the
           chart and the same code produced a wall of a hundred and eighty-nine
           names - and a misleading one, because most of those rows *are* the
           feature rows, they just reach the run under a different id than the
           tracker gave them. The rows themselves are in the table below. */
        var bare = ordered.filter(function (k) {
          return !data.parents[k] || !data.parents[k].features;
        });
        if (bare.length) {
          html += '<p class="sub" style="margin-top:14px">' + bare.length +
            " other row" + (bare.length === 1 ? "" : "s") + " on this chart " +
            (bare.length === 1 ? "is" : "are") + " not grouped under a key the " +
            "run reports against, so nothing above counts " +
            (bare.length === 1 ? "it" : "them") + ".</p>";
        }

        html += '<p class="sub" style="margin-top:10px">' +
          "&ldquo;Backed by code&rdquo; means code exists that plausibly " +
          "implements the feature. It does not mean the feature works — " +
          "the analysis reads code, it does not run it. " +
          '<a href="/traceability?project=' + encodeURIComponent(project) +
          '">Open Traceability</a></p>';

        html += '<div id="ft-mount"></div>';

        panel.innerHTML = html;
        panel.hidden = false;
        markTraceability(data, isDated);
        drawFeatureTable(project);
      })
      .catch(function () { /* no traceability is not a schedule failure */ });
  }

  /* The feature rows, as something a person can search.

     Fed by `/api/traceability/rows` rather than `/api/traceability`, which is
     most of a megabyte - the whole reason the flat view exists. Rendering is
     one pass over a filtered array with `innerHTML`, not a row-diffing
     renderer: 173 rows is small enough that the simplest thing is also the
     fast thing, and a hand-written page earns its keep by being readable. */
  /* Every cell below is built by string concatenation, and every value in
     them came out of somebody's spreadsheet. A summary containing `<` is not
     hypothetical in a backlog full of `Task<T>` and `a -> b`, and without
     this the table would render it as markup. */
  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  var FEATURES = [];
  var FT_FILTER = "all";
  var FT_QUERY = "";

  /* What each chip keeps. Kept as data so the chip row, the filtering and the
     empty state cannot disagree about what a name means. */
  var FT_FILTERS = [
    { id: "all", label: "All", keep: function () { return true; } },
    { id: "corroborated", label: "Backed by code",
      keep: function (r) { return r.verdict === "corroborated"; } },
    { id: "unverified", label: "Not verified",
      keep: function (r) { return r.verdict === "unverified"; } },
    { id: "contradicted", label: "Contradicted",
      keep: function (r) { return r.verdict === "contradicted"; } },
    { id: "conflict", label: "Status conflict",
      keep: function (r) { return r.conflict; } },
    /* The one a delivery manager actually opens this for.

       It filters on `missing`, which the server fills from the same learned
       convention `_ownership` uses: a field most rows carry is one every row
       is expected to carry, and this row leaves it blank. The first version
       asked whether the row named *anybody* and matched nothing at all -
       every row on this export carries a `BA`, so "has a person on it" is
       true of all 173 while 22 of them are still missing a field the sheet
       expects. Two definitions of unowned on one screen, and the filter got
       the useless one. */
    { id: "unowned", label: "Missing a name",
      keep: function (r) { return (r.missing || []).length > 0; } }
  ];

  function ftKeep(row) {
    var f = FT_FILTERS.filter(function (x) { return x.id === FT_FILTER; })[0];
    if (f && !f.keep(row)) return false;
    if (!FT_QUERY) return true;
    var hay = (row.title + " " + row.component + " " + row.status + " " +
      Object.keys(row.people || {}).map(function (k) { return row.people[k]; })
        .join(" ")).toLowerCase();
    // Every word has to appear, so a second word narrows rather than widens.
    return FT_QUERY.split(/\s+/).every(function (term) {
      return hay.indexOf(term) !== -1;
    });
  }

  function ftRender() {
    var body = document.getElementById("ft-body");
    var count = document.getElementById("ft-count");
    if (!body) return;
    var shown = FEATURES.filter(ftKeep);

    count.textContent = shown.length === FEATURES.length
      ? FEATURES.length + " rows"
      : shown.length + " of " + FEATURES.length + " rows";

    if (!shown.length) {
      body.innerHTML = '<tr><td colspan="5" class="ft-empty">' +
        "No feature row matches that." + "</td></tr>";
      return;
    }

    body.innerHTML = shown.map(function (r) {
      var who = Object.keys(r.people || {}).map(function (k) {
        return esc(k) + " " + esc(r.people[k]);
      }).join("<br>");
      // Named after the people, so the gap reads as part of the same list.
      (r.missing || []).forEach(function (field) {
        who += (who ? "<br>" : "") +
          '<span class="ft-none">no ' + esc(field) + "</span>";
      });
      return "<tr>" +
        '<td><span class="t-title">' + esc(r.title) + "</span>" +
        /* The model's own sentence, shown rather than hidden behind a
           tooltip. It is the only part of the row a reader can argue with,
           and an unarguable claim is worth less than no claim. */
        (r.why ? '<span class="t-why">' + esc(r.why) + "</span>" : "") +
        "</td>" +
        "<td>" + esc(r.status) + "</td>" +
        "<td>" + (esc(r.component) || '<span class="ft-none">none</span>') + "</td>" +
        "<td>" + (who || '<span class="ft-none">nobody named</span>') + "</td>" +
        '<td><span class="ft-tag ft-' + esc(r.verdict || "unverified") + '">' +
        esc(r.verdict || "not checked") + "</span>" +
        (r.conflict ? '<br><span class="ft-tag ft-contradicted">status conflict</span>' : "") +
        "</td></tr>";
    }).join("");
  }

  function drawFeatureTable(project) {
    var mount = document.getElementById("ft-mount");
    if (!mount) return;
    fetch("/api/traceability/rows" +
      (project ? "?project=" + encodeURIComponent(project) : ""))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data || !data.rows || !data.rows.length) return;
        FEATURES = data.rows;

        mount.innerHTML =
          '<div class="ft-controls">' +
            '<input type="search" id="ft-q" placeholder="Search title, component, person...">' +
            FT_FILTERS.map(function (f) {
              return '<button type="button" class="ft-chip" data-ft="' + f.id +
                '" aria-pressed="' + (f.id === FT_FILTER) + '">' + f.label +
                "</button>";
            }).join("") +
            '<span class="ft-count" id="ft-count"></span>' +
          "</div>" +
          '<div class="ft-scroll"><table class="ft">' +
            "<thead><tr><th>Feature</th><th>Status</th><th>Component</th>" +
            "<th>Named on the row</th><th>Against the code</th></tr></thead>" +
            '<tbody id="ft-body"></tbody>' +
          "</table></div>";

        mount.querySelector("#ft-q").addEventListener("input", function (e) {
          FT_QUERY = e.target.value.trim().toLowerCase();
          ftRender();
        });
        Array.prototype.forEach.call(
          mount.querySelectorAll(".ft-chip"),
          function (chip) {
            chip.addEventListener("click", function () {
              FT_FILTER = chip.dataset.ft;
              Array.prototype.forEach.call(
                mount.querySelectorAll(".ft-chip"),
                function (c) {
                  c.setAttribute("aria-pressed", String(c === chip));
                }
              );
              ftRender();
            });
          }
        );
        ftRender();
      })
      .catch(function () { /* the chart is the page; the table is a bonus */ });
  }

  /* Put what the code says onto the chart itself.

     Done by decorating the rendered label column rather than by teaching
     `gantt.js` about verdicts: that renderer is shared with the React
     Calculation tab, which has no traceability data, and a chart component
     that knows about Jira statuses would be the wrong shape for both.

     Matching is on the row's own key text, so a row that `gantt.js` merged
     or dropped simply does not get a badge - it cannot end up on the wrong
     row.

     Two things are marked, and the second matters even when the first finds
     nothing. Conflicts are the alarm. The coverage badge is the ordinary
     state of the world: how much of the work a row stands for the code
     actually backs up. A chart that only lit up on conflicts would read as
     "all clear" on a project where nothing had been checked at all. */
  function markTraceability(data, isDated) {
    var left = document.querySelector("#main .g-left");
    if (!left) return;

    function span(cls, text, title) {
      var s = document.createElement("span");
      s.className = cls;
      s.textContent = text;
      if (title) s.title = title;
      return s;
    }

    function decorate(line, key, p) {
      if (!p || !p.features) return;
      var adjudicated = p.corroborated + p.contradicted + p.unverified;
      line.appendChild(span(
        "g-coverage",
        p.corroborated + "/" + p.features + " in code" +
        (p.grounded ? " ✓" + p.grounded : ""),
        p.features + " feature rows sit under " + key + ". " +
        p.corroborated + " are backed by code" +
        (p.grounded ? " (" + p.grounded + " with every cited name checked "
          + "against the source)" : "") +
        (p.unverified ? ", " + p.unverified + " could not be verified" : "") +
        (adjudicated < p.features
          ? ", " + (p.features - adjudicated) + " not yet analysed" : "") +
        ". Backed by code means code exists that plausibly implements it - " +
        "not that it works."));
      if (p.conflicts) {
        line.appendChild(span(
          "g-conflict", p.conflicts + " conflict" + (p.conflicts === 1 ? "" : "s"),
          "Tracker status and code disagree on " + p.conflicts + " of them. " +
          "See the Traceability page."));
      }
    }

    Array.prototype.forEach.call(left.querySelectorAll(".g-row"), function (line) {
      var idEl = line.querySelector(".g-id");
      if (!idEl) return;
      var key = idEl.textContent.trim();
      decorate(line, key, data.parents[key]);
    });

    /* The rows with no dates are collapsed by `gantt.js` into one grey
       "N tasks, no dates" strip. That is right for tasks nobody dated and
       nobody is waiting on - and wrong when one of them is the issue the
       entire product backlog hangs off, which is exactly this export. Name
       the carriers there so the most important row on the page stops
       reading as a footnote. */
    var offChart = Object.keys(data.parents).filter(function (k) {
      return data.parents[k].features && !isDated[k];
    });
    if (!offChart.length) return;
    var band = left.querySelector(".g-undated-row");
    if (!band) return;

    var title = band.querySelector(".g-title");
    if (title) {
      title.textContent = offChart.join(", ") + " · no dates";
      title.className = "g-title g-carrier";
    }
    band.className = "g-row g-undated-row g-carrier-row";
    offChart.forEach(function (k) { decorate(band, k, data.parents[k]); });
  }
})();
</script>
</main>
</div>
