[project]
name = "projectpulse"
version = "0.1.0"
description = "Delivery intelligence for project managers - deterministic analysis with a language interface"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # The dependency DAG and its forward pass.
    "networkx>=3.4",
    # The rule engine. `intelligence/rules/engine.py` is the only module that
    # imports it and carries a built-in evaluator, so a failed wheel degrades
    # rather than breaks - but the wheel is expected to be here.
    "zen-engine>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx"]  # httpx backs fastapi.testclient

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
