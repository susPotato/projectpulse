# fly.toml app configuration file generated for projectpulse on 2026-09-08T21:36:40+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'projectpulse'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  PULSE_NARRATION = '0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options]
    [http_service.http_options.response]
      pristine = true

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/state'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
