# fly.toml app configuration file generated for projectpulse on 2026-09-08T21:36:40+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'projectpulse'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

# Non-secret configuration lives here, in git, where it can be read. Anything
# that is a credential is a Fly secret instead - `fly secrets list`.
#
# ⚠️ **A secret of the same name wins over anything in this block.** That is how
# `PULSE_NARRATION` came to be declared twice with opposite values: '0' here and
# '1' as a secret. Production ran narration the whole time while the only
# configuration anybody could read said it was off. If you add a name here, make
# sure it is not also a secret.
[env]
  PORT = '8080'
  # The admin gate, off. Deliberate, and here in git rather than as a secret
  # because it is a boolean and not a credential - the same rule the comment
  # above states. It means anybody who can reach this host can change
  # settings, replace stored API keys, and run the routes that spend this
  # deployment's model budget.
  #
  # Turn it back on with `fly secrets unset` on nothing - remove this line, or
  # set it to '0', and deploy. `PULSE_ADMIN_TOKEN` is still set, so the token
  # gate resumes working the moment this is off.
  PULSE_OPEN_ADMIN = '1'
  # On, and visibly so. Both of these are booleans, not credentials, so they
  # belong in git rather than in `fly secrets` - the keys they gate are the
  # secrets.
  PULSE_NARRATION = '1'
  # A model may propose risks by reading issue text. Deliberately a separate
  # permission from narration - see `app/config.py` - so it is listed
  # separately rather than implied.
  PULSE_RISK_DRAFTS = '1'
  # Which vendor the features default to. Not a credential either - the key it
  # selects is the secret. Any feature can override this on `/llm` without a
  # deploy; see `app/llm/features.py`.
  PULSE_NARRATION_PROVIDER = 'anthropic'
  # Where the Traceability page looks for run snapshots, and where
  # `app/traceability_run.py` writes the ones this server produces.
  #
  # On the volume, not in the image. A run is minutes of CPU and the only copy
  # of what it found, so it has to outlive the machine - `auto_stop_machines`
  # takes the container's own filesystem away every time the app idles.
  #
  # ⚠️ Deliberately **not** `/app/traceability_runs`. A Fly mount covers the
  # directory it is mounted at, so pointing the volume there would hide the
  # runs the Dockerfile copies in - the page would go from 173 verdicts to
  # "Not traced" on the first deploy, with the artifacts still in the image and
  # unreachable. The baked runs stay where they are and `scripts/serve.py`
  # seeds them onto the volume when it is empty.
  TRACELINK_RUNS = '/data/runs'
  # The clone cache, also on the volume. Still disposable - `tracelink.source`
  # re-fetches rather than re-clones and `app/models/repo.py` explains why a
  # clone is the one input this app does not keep in Postgres - but keeping it
  # across an idle-stop turns the first run after a sleep from a fresh shallow
  # clone into a fetch of whatever changed.
  PULSE_REPO_CACHE = '/data/repos'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # One machine stays up, because a traceability run is a background thread
  # rather than a request. At zero, Fly stops the machine when the last
  # request finishes and nothing holds it open - the run is killed part-way
  # through, which is not corrupt (the page names each missing artifact) but
  # is entirely wasted work.
  #
  # ⚠️ This is the one setting here that costs money while idle. Set it back
  # to 0 if you would rather the machine sleep and accept that a run only
  # completes while somebody keeps the page busy.
  min_machines_running = 1

  [http_service.http_options]
    [http_service.http_options.response]
      pristine = true

  # Checked against a route the product actually serves. This pointed at
  # `/api/state`, the retriever console's own endpoint, which was deleted with
  # the console - the app kept serving every real page and Fly took both
  # machines out of the pool anyway, because a 404 from a health check reads as
  # "this machine is unhealthy", not "that path is gone".
  #
  # `/api/portfolio` instead: it is the landing page's own bundle, so a machine
  # that passes this check can actually answer the first request a visitor
  # makes, which `/api/state` never proved.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/portfolio'

# The volume runs are written to, and the clone cache alongside them.
#
# One volume, therefore one machine that can mount it - which is consistent
# with `min_machines_running = 1` above and with the runner refusing to start a
# second run concurrently. Scaling past one machine means either a volume each
# (and runs that only exist on whichever machine produced them) or moving the
# artifacts to object storage; neither is a config change, so do not scale this
# app out without reading `app/traceability_run.py` first.
[[mounts]]
  source = 'pulse_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
