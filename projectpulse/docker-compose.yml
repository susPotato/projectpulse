# The judged artifact: `docker compose up -d` must be enough.
#
# Port 5433 on the host so a local Postgres, if there is one, stays untouched.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: projectpulse-db
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: projectpulse
    ports:
      - "5433:5432"
    volumes:
      - pulse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d projectpulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The app itself, built from the same Dockerfile the deploy target uses.
  # Narration settings and the API key come from `.env` (copy `.env.example`,
  # never committed); DATABASE_URL is fixed here to the `db` service's
  # internal address, overriding whatever `.env` has for local, non-Docker
  # runs - `environment:` wins over `env_file:` in Compose.
  app:
    build:
      context: .
      args:
        # CodeWiki's doc generator, for repositories registered without a
        # docs/ tree. Local only - the Fly image leaves it out (Dockerfile).
        PULSE_CODEWIKI_GENERATE: "1"
    container_name: projectpulse-app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://pulse:pulse@db:5432/projectpulse
      # Runs and clones on the `pulse-state` volume, as fly.toml does with
      # `/data`. In the container's own filesystem they died with every
      # `--build`: a finished trace, its paid verdict cache, and any docs
      # generated into a clone. `scripts.serve` seeds the baked demo run here.
      TRACELINK_RUNS: /data/runs
      PULSE_REPO_CACHE: /data/repos
    volumes:
      - pulse-state:/data
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pulse-pgdata:
  pulse-state:
